<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>靈感撤離 2080</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="在水淹的 2080 年浮城打工捱窮，同時守住靈感，爭取被外星人選中。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&family=Silkscreen&family=VT323&display=swap">
<style>
/* 版面概念：一個俯瞰水淹浮城的像素窗口，下方裝著一部 2080 年廉價手機的介面 */
:root {
  color-scheme: dark;
  --ink: #0a0e17;        /* 夜晚的浮城 */
  --deck: #111827;       /* 手機介面底色 */
  --deck-2: #172036;
  --line: #26334d;
  --fg: #e8edf6;
  --mute: #8d99b4;
  --sea: #37c3d6;        /* 水淹藍綠 */
  --neon: #ff4fb4;       /* 霓虹粉紫 */
  --spark: #ffc247;      /* 火花 */
  --cash: #8be28f;
  --body: #ff6b6b;
  --danger: #ff4d5e;
  --alien: #9be36b;
  --paper: #eef1f7;      /* 外星 HR 的企業表格 */
  --paper-ink: #1b2233;
  --paper-line: #c9d1e2;
  --font-display: "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "VT323", ui-monospace, "SFMono-Regular", monospace;
  --font-pixel: "Silkscreen", "VT323", ui-monospace, monospace;
  --r: 6px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--ink); color: var(--fg); }
body {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
.num { font-family: var(--font-num); font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.px { font-family: var(--font-pixel); font-size: 0.72em; letter-spacing: 0.08em; text-transform: uppercase; }
.mute { color: var(--mute); }

#app {
  max-width: 980px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 32px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ---------- 畫面 ---------- */
.stage {
  position: relative;
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
  background: #05070c;
  max-width: 100%;
}
.stage canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; transition: filter 1.2s ease; }
.stage.playing { touch-action: none; box-shadow: 0 0 0 2px var(--sea); }
.stage-tag {
  position: absolute; left: 8px; bottom: 8px;
  font-size: 11px; padding: 2px 8px; border-radius: 3px;
  background: rgba(10, 14, 23, 0.72); color: var(--mute); pointer-events: none;
}

/* ---------- HUD ---------- */
.hud { display: grid; gap: 8px; }
.hud-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.hud-day { font-size: 15px; font-weight: 700; display: flex; align-items: baseline; gap: 6px; }
.hud-day .num { font-size: 26px; line-height: 1; color: #fff; }
.hud-btns { margin-left: auto; display: flex; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; line-height: 1; padding: 5px 8px; border-radius: 999px;
  background: var(--deck-2); border: 1px solid var(--line); color: var(--fg); white-space: nowrap;
}
.chip.warn { border-color: var(--danger); color: #ffd0d5; }
.chip.season { border-color: color-mix(in srgb, var(--sea) 60%, var(--line)); }
.icon-btn {
  min-width: 40px; height: 34px; padding: 0 10px; border-radius: var(--r);
  background: var(--deck-2); border: 1px solid var(--line); cursor: pointer; font-size: 13px;
}
.icon-btn:hover { border-color: var(--sea); }
.icon-btn .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--neon); margin-left: 4px; vertical-align: middle; }

.hud-meters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.meter {
  min-width: 0; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: var(--r); background: var(--deck); border: 1px solid var(--line);
}
.meter .lbl { font-size: 12px; color: var(--mute); white-space: nowrap; }
.meter .num { font-size: 22px; line-height: 1; white-space: nowrap; }
.bar { position: relative; height: 6px; background: #1d2740; border-radius: 3px; overflow: visible; min-width: 30px; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; transition: width 0.5s ease; }
.bar > em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff; border-radius: 1px; }
.m-cash { grid-template-columns: auto 1fr; }
.m-cash .num { color: var(--cash); text-align: right; }
.m-body .bar > i { background: var(--body); }
.m-body .num { color: #ffb3b3; }
.m-spark .bar > i { background: linear-gradient(90deg, #ff8a3c, var(--spark)); }
.m-spark .num { color: var(--spark); }
.m-spark.numb { border-color: #6b7280; }
.m-spark.numb .num { color: #9ca3af; }
.m-signal .bar > i { background: linear-gradient(90deg, var(--sea), var(--neon)); }
.m-signal .num { font-size: 18px; color: #ffd6ef; }
.hud-sub { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--mute); }
.hud-sub b { color: var(--fg); font-weight: 500; }
.hud-sub .bad { color: #ff9aa6; }

/* ---------- 面板 ---------- */
.panel { display: grid; gap: 12px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.panel-head h2 { margin: 0; font-size: 18px; font-weight: 900; text-wrap: balance; }
.panel-head p { margin: 0; font-size: 13px; color: var(--mute); }

.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.act {
  position: relative; text-align: left; cursor: pointer; min-width: 0;
  display: grid; gap: 6px; align-content: start;
  padding: 12px 12px 10px; border-radius: var(--r);
  background: var(--deck); border: 1px solid var(--line);
  transition: border-color 0.15s, transform 0.15s, background 0.15s;
}
.act:hover:not(:disabled) { border-color: var(--sea); background: var(--deck-2); transform: translateY(-1px); }
.act:focus-visible { outline: 2px solid var(--spark); outline-offset: 2px; }
.act:disabled { cursor: not-allowed; opacity: 0.5; }
.act-key { position: absolute; top: 10px; right: 10px; font-family: var(--font-num); font-size: 16px; color: var(--mute); }
.act-name { font-size: 16px; font-weight: 900; padding-right: 18px; }
.act-sub { font-size: 12px; color: var(--mute); line-height: 1.4; }
.act-why { font-size: 12px; color: #ff9aa6; }
.fx { display: flex; flex-wrap: wrap; gap: 4px; }
.fx span { font-size: 11px; line-height: 1; padding: 4px 6px; border-radius: 3px; background: #1a2338; white-space: nowrap; }
.fx .fx-cr { color: var(--cash); }
.fx .fx-body { color: #ffb3b3; }
.fx .fx-spark { color: var(--spark); }
.fx .fx-card { color: #cbd5f0; }
.fx .fx-sig { color: #ffd6ef; }
.fx .neg { box-shadow: inset 0 0 0 1px rgba(255, 77, 94, 0.35); }

.inv-wrap { display: grid; gap: 6px; }
.inv-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--mute); }
.inv { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }

/* 素材卡 */
.card {
  flex: 0 0 auto; width: 132px; min-height: 74px; text-align: left;
  display: grid; gap: 6px; align-content: space-between;
  padding: 8px; border-radius: var(--r); background: #1a2236; border: 1px solid var(--line); color: var(--fg);
}
.card .c-name { font-size: 12px; font-weight: 700; line-height: 1.35; }
.card .c-foot { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.card .c-val { font-family: var(--font-num); font-size: 18px; line-height: 1; color: #cbd5f0; }
.card.legacy { border-color: #8f6bd8; background: #221a38; }
button.card { cursor: pointer; }
button.card:hover { border-color: var(--sea); }
button.card.sel { border-color: var(--spark); background: #2a2414; box-shadow: 0 0 0 1px var(--spark); }
button.card:disabled { opacity: 0.35; cursor: not-allowed; }
.tags { display: flex; flex-wrap: wrap; gap: 3px; }
.tag {
  font-size: 11px; line-height: 1; padding: 3px 5px; border-radius: 3px; font-weight: 700;
  color: #0b0f1a; background: var(--c, #8e9bb0);
}

/* 按鈕 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 42px; padding: 0 16px; border-radius: var(--r); cursor: pointer;
  background: var(--deck-2); border: 1px solid var(--line); font-weight: 700;
}
.btn:hover:not(:disabled) { border-color: var(--sea); }
.btn:focus-visible { outline: 2px solid var(--spark); outline-offset: 2px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--neon); border-color: var(--neon); color: #1a0613; }
.btn.primary:hover:not(:disabled) { background: #ff77c6; border-color: #ff77c6; }
.btn.sea { background: var(--sea); border-color: var(--sea); color: #04161f; }
.btn.big { min-height: 64px; font-size: 20px; font-weight: 900; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row > .btn { flex: 1 1 140px; }

/* 小遊戲控制 */
.controls { display: grid; gap: 10px; }
.controls .hint { margin: 0; font-size: 13px; color: var(--mute); }
.ctrl-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.ctrl-row .btn { min-height: 76px; font-size: 22px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.ctrl-row .btn small { font-family: var(--font-num); font-size: 16px; color: inherit; opacity: 0.6; font-weight: 400; }
.ctrl-row .btn.no { background: #3a1620; border-color: #6b2433; color: #ffc2cb; }
.ctrl-row .btn.yes { background: #14321c; border-color: #2a6b3a; color: #c9f7cf; }
.ctrl-row .btn { -webkit-touch-callout: none; }
.ctrl-row .btn:active { transform: translateY(1px); filter: brightness(1.2); }
.ctrl-row .btn.laugh { background: #3a2a0a; border-color: #8a6a1f; color: #ffe2a0; }
.ctrl-row .btn.nod { background: #0b2f36; border-color: #1f6b7a; color: #bff3fb; }
.ctrl-row .btn.pour { background: #2a1430; border-color: #6b2a5a; color: #ffd6ef; }
.ctrl-row .btn.fire { background: #0b2f36; border-color: var(--sea); color: #e8fdff; }
.ctrl-row .btn.up { background: #172036; border-color: var(--line); }

/* ---------- 對話框 ---------- */
.modal-wrap {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(4, 6, 12, 0.72);
  backdrop-filter: blur(2px);
}
.modal {
  width: min(560px, 100%); max-height: 100%; overflow: auto;
  background: var(--deck); border: 1px solid var(--line); border-radius: 10px;
  display: grid; gap: 14px; padding: 18px;
  animation: pop 0.18s ease-out;
}
.modal.wide { width: min(760px, 100%); }
.modal h2 { margin: 0; font-size: 22px; font-weight: 900; text-wrap: balance; }
.modal h3 { margin: 0; font-size: 14px; color: var(--mute); font-weight: 700; }
.modal p { margin: 0; }
.modal-wrap.static .modal, .modal-wrap.static .phone { animation: none; }
@keyframes pop { from { transform: translateY(8px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }

.lines { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.lines li { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 6px 0; border-bottom: 1px dashed #24304a; }
.lines li .v { font-family: var(--font-num); font-size: 18px; line-height: 1.1; white-space: nowrap; }
.lines li.bad { color: #ffb3bd; }
.lines li.good { color: #c9f7cf; }
.lines li.event { color: #ffe7a8; }
.lines li.news { color: #9fdcff; }
.lines li.auto { color: var(--mute); font-size: 12px; }

.deltas { display: flex; flex-wrap: wrap; gap: 8px; }
.delta { display: grid; gap: 2px; padding: 8px 12px; border-radius: var(--r); background: #0d1424; border: 1px solid var(--line); min-width: 92px; }
.delta .k { font-size: 11px; color: var(--mute); }
.delta .num { font-size: 26px; line-height: 1; }
.delta.cr .num { color: var(--cash); }
.delta.body .num { color: #ffb3b3; }
.delta.spark .num { color: var(--spark); }
.gained { display: flex; flex-wrap: wrap; gap: 6px; }

/* 手機：早上 */
.phone {
  width: min(400px, 100%); max-height: 100%; overflow: auto; margin: 0 auto;
  background: #0d1220; border: 2px solid #2d3a59; border-radius: 22px;
  display: grid; gap: 10px; padding: 12px 14px 16px;
  animation: pop 0.2s ease-out;
}
.phone-bar { display: flex; justify-content: space-between; font-family: var(--font-num); font-size: 16px; color: var(--mute); padding: 0 4px; }
.phone-bar .low { color: var(--danger); }
.phone h2 { margin: 0; font-size: 20px; font-weight: 900; }
.feed { display: grid; gap: 8px; }
.post { padding: 10px 12px; border-radius: 12px; background: #151c2e; font-size: 14px; line-height: 1.5; }
.post .who { display: block; font-size: 11px; color: var(--mute); margin-bottom: 2px; }
.post.ad { background: #2a1430; border: 1px dashed var(--neon); }
.post.alien { background: #14261a; border: 1px solid #3c6b2a; color: #d9f7c7; }
.post.news { background: #10233a; }
.post.warn { background: #3a1620; color: #ffd0d5; }
.msg { justify-self: start; max-width: 88%; padding: 10px 12px; border-radius: 4px 14px 14px 14px; background: #1f6b4f; color: #eafff4; font-size: 14px; }
.msg.memo { background: #e8ecf4; color: #1b2233; border-radius: 4px; font-size: 13px; }
.msg.auto { background: #2a3350; color: #b8c2db; border-radius: 4px; font-size: 13px; }
.msg.glitch { background: #3a0d16; color: #ff8a9a; font-weight: 900; letter-spacing: 0.3em; animation: glitch 0.4s steps(2) infinite; }
@keyframes glitch { 0% { transform: translate(0); } 50% { transform: translate(2px, -1px); } 100% { transform: translate(-1px, 1px); } }
.msg-head { font-size: 11px; color: var(--mute); }
.shop { display: grid; gap: 6px; }
.shop-item { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: #151c2e; }
.shop-item .n { font-weight: 700; font-size: 14px; }
.shop-item .d { font-size: 12px; color: var(--mute); }
.shop-item .btn { min-height: 36px; padding: 0 12px; font-family: var(--font-num); font-size: 18px; font-weight: 400; }

/* 外星 HR 考績表 */
.review {
  background: var(--paper); color: var(--paper-ink); border-radius: 4px; padding: 18px;
  display: grid; gap: 12px; position: relative; overflow: hidden;
}
.review .r-head { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: #5b6b90; border-bottom: 2px solid var(--paper-ink); padding-bottom: 6px; }
.review h2 { margin: 0; font-size: 20px; color: var(--paper-ink); }
.review table { width: 100%; border-collapse: collapse; font-size: 14px; }
.review td { padding: 8px 4px; border-bottom: 1px solid var(--paper-line); vertical-align: middle; }
.review td.g { font-family: var(--font-num); font-size: 34px; line-height: 1; width: 48px; text-align: center; }
.review td.n { color: #5b6b90; font-size: 12px; text-align: right; }
.review .verdict { font-size: 15px; font-weight: 700; }
.stamp {
  position: absolute; right: 14px; bottom: 16px; transform: rotate(-12deg);
  font-size: 26px; font-weight: 900; padding: 4px 12px; border: 4px solid currentColor; border-radius: 6px;
  animation: stamp 0.35s cubic-bezier(.2, 2, .4, 1) both 0.4s;
}
.stamp.pass { color: #2a8a3e; }
.stamp.fail { color: #c62f45; }
@keyframes stamp { from { transform: rotate(-12deg) scale(2.4); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: 0.9; } }

/* 創作 */
.craft { display: grid; gap: 14px; }
.craft > .btn-row { position: sticky; bottom: -18px; margin: 0 -18px -18px; padding: 12px 18px 18px; background: var(--deck); border-top: 1px solid var(--line); }
.craft-tray { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.slot { min-height: 74px; border-radius: var(--r); border: 1px dashed #34446a; display: grid; place-items: center; color: #4a5a80; font-size: 12px; min-width: 0; }
.slot .card { width: 100%; }
.slot.locked { opacity: 0.35; }
.craft-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 6px; }
.craft-grid .card { width: auto; }
.formula { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--font-num); font-size: 26px; line-height: 1; }
.formula .term { display: grid; gap: 2px; padding: 6px 10px; border-radius: var(--r); background: #0d1424; border: 1px solid var(--line); }
.formula .term small { font-family: var(--font-body); font-size: 11px; color: var(--mute); }
.formula .t-chips { color: #9fdcff; }
.formula .t-mult { color: var(--neon); }
.formula .t-spark { color: var(--spark); }
.formula .t-kpi { color: var(--alien); }
.formula .t-total { color: #fff; font-size: 34px; }
.formula .op { color: var(--mute); }
.combos { display: flex; flex-wrap: wrap; gap: 6px; }
.combo { font-size: 13px; padding: 5px 9px; border-radius: 999px; background: #2a1430; border: 1px solid var(--neon); color: #ffd6ef; }
.combo.res { background: #10233a; border-color: var(--sea); color: #c9f3fb; }
.combo.secondary { opacity: 0.75; border-style: dashed; }
.combo.hidden { background: #1a1a24; border-color: #4a4a60; color: #a0a0b8; }
.combo .m { font-family: var(--font-num); font-size: 16px; margin-left: 4px; }
.reveal { display: grid; gap: 10px; justify-items: center; text-align: center; padding: 10px 0; }
.reveal .work { font-size: 26px; font-weight: 900; text-wrap: balance; }
.reveal .score { font-family: var(--font-num); font-size: 64px; line-height: 1; color: #fff; text-shadow: 0 0 18px var(--neon); }
.reveal .score.boom { animation: boom 0.5s ease-out; }
@keyframes boom { 0% { transform: scale(0.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
.reveal .new { color: var(--spark); font-weight: 900; }

/* 標題與結局 */
.title-menu { display: grid; gap: 14px; }
.tagline { margin: 0; font-size: clamp(18px, 3.6vw, 26px); font-weight: 900; text-wrap: balance; }
.tagline em { font-style: normal; color: var(--neon); }
.lede { margin: 0; color: var(--mute); max-width: 62ch; }
.stats-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--mute); }
.stats-row b { color: var(--fg); font-family: var(--font-num); font-size: 18px; font-weight: 400; }
.bg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.bg-card { text-align: left; cursor: pointer; display: grid; gap: 6px; padding: 12px; border-radius: var(--r); background: var(--deck); border: 1px solid var(--line); min-width: 0; }
.bg-card:hover { border-color: var(--sea); }
.bg-card.sel { border-color: var(--spark); box-shadow: 0 0 0 1px var(--spark); }
.bg-card .n { font-weight: 900; font-size: 16px; }
.bg-card .d { font-size: 12px; color: var(--mute); }
.bg-card .p { font-size: 12px; color: var(--spark); }
.bg-card .s { display: flex; gap: 10px; font-family: var(--font-num); font-size: 17px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 8px 12px; border-radius: 999px; background: var(--deck); border: 1px solid var(--line); cursor: pointer; font-size: 13px; }
.seg button.sel { border-color: var(--sea); background: #10233a; }

.ending { display: grid; gap: 14px; text-align: center; justify-items: center; }
.ending .e-kind { font-family: var(--font-pixel); font-size: 12px; letter-spacing: 0.2em; color: var(--mute); }
.ending h2 { font-size: clamp(34px, 8vw, 54px); line-height: 1.05; }
.ending .epitaph { font-size: 17px; max-width: 34ch; line-height: 1.7; }
.ending.death h2 { color: #ffb3bd; }
.ending.grey h2 { color: #9ca3af; }
.ending.ordinary h2 { color: #c9f3fb; }
.ending.agent h2 { color: var(--alien); }
.ending.returned h2 { color: var(--spark); }
.e-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 8px; width: 100%; }
.e-stat { padding: 8px; border-radius: var(--r); background: #0d1424; border: 1px solid var(--line); display: grid; gap: 2px; }
.e-stat .k { font-size: 11px; color: var(--mute); }
.e-stat .num { font-size: 24px; line-height: 1; }

.help { display: grid; gap: 10px; font-size: 14px; }
.help h3 { color: var(--fg); font-size: 15px; margin-top: 4px; }
.help ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.recipe { padding: 8px; border-radius: var(--r); background: #0d1424; border: 1px solid var(--line); font-size: 13px; display: grid; gap: 4px; }
.recipe.unknown { color: var(--mute); }

/* 提示 */
.toasts { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; width: min(440px, calc(100% - 32px)); pointer-events: none; }
.toast { padding: 10px 14px; border-radius: var(--r); background: #1f2a44; border: 1px solid var(--line); font-size: 14px; animation: pop 0.2s ease-out; }
.toast.good { border-color: var(--cash); }
.toast.bad { border-color: var(--danger); }

@media (max-width: 720px) {
  .hud-meters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .meter { padding: 6px 8px; gap: 6px; }
  .meter .num { font-size: 20px; }
  .acts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .act { padding: 10px; }
  .act-name { font-size: 15px; }
  .craft-tray { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .formula { font-size: 22px; }
  .reveal .score { font-size: 52px; }
}
@media (max-width: 380px) {
  .acts { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

    if (s.legacy.length && !picked && rand(s) < 0.4) legacy = legacyCard(pick(s, s.legacy));
    const scrap = [];
    for (let i = 0; i < (picked ? 1 : 3); i++) scrap.push(3 + Math.floor(rand(s) * 4));
    return {
      oxygen: 45 * (p.oxygen || 1) * (s.gear.tank ? 1.3 : 1) * (1 + 0.02 * Math.min(10, s.mastery.dive)),
      harpoon: { cd: s.gear.harpoon ? 0.4 : 0.7, dmg: s.gear.harpoon ? 2 : 1 },
      capacity: 8 + (s.gear.bag ? 4 : 0),
      zones, legacy, scrap, picked,
      fish: { sardine: 2, eel: 2 + Math.floor(s.day / 12), grouper: 1 + Math.floor(s.day / 15), jelly: 3 + Math.floor(s.day / 8) },
    };
  }
  function diveBodyCost(s) {
    return Math.round((14 - seasonOf(s).outdoorBody) * (perk(s).diveBody || 1));
  }
  // res：{ relics: [卡 id 或前世作品], money, fish: { sardine, eel, grouper }, hits, drowned }
  function applyDive(s, res) {
    const rep = report(s, '舊城潛水');
    const fish = res.fish || {};
    const cost = diveBodyCost(s) + 5 * res.hits + (res.drowned ? 15 : 0);
    s.body -= cost;
    s.cr += res.money; s.stats.crEarned += res.money;
    const n = res.relics.length;
    const sp = addSpark(s, 0.05 * n);
    const caught = (fish.sardine || 0) + (fish.eel || 0) + (fish.grouper || 0);
    s.mastery.dive++;
    s.flags.divedDay = s.day;
    s.stats.dives++; s.stats.relics += n; s.stats.fish += caught;
    Object.keys(fish).forEach((k) => { if (fish[k]) s.log.fish[k] = true; });
    res.relics.forEach((r) => { if (typeof r === 'string') s.log.relics[r] = true; });
    if (res.drowned) rep.line('氧氣耗盡，你掙扎著浮上水面，失去了一半收穫', 'bad');
    if (res.hits) rep.line('被咬或碰撞 ' + res.hits + ' 次', 'bad');
    const fishText = Object.keys(fish).filter((k) => fish[k] && D.FISH[k].value)
      .map((k) => D.FISH[k].name + ' ×' + fish[k]).join('、');
    if (fishText) rep.line('漁獲：' + fishText, '');
    rep.line('打撈遺物 ' + n + ' 件，賣出漁獲與廢料 $' + res.money, '');
    if (Object.keys(fish).some((k) => fish[k] && D.FISH[k].dinner)) {
      s.flags.fishDinner = s.day;
      rep.line('留下一條大魚當晚餐，今晚不用花錢吃飯', 'good');
    }
    rep.delta('cr', res.money); rep.delta('body', -cost);
    if (sp) rep.delta('spark', sp);
    res.relics.forEach((r) => rep.gain(r));
    return rep.done();
  }

  // ---------- 聊天、休息 ----------
  function chatCost(s) { return perk(s).freeChat ? 0 : 15; }
  function aliveNpcs(s) { return s.npcs.filter((n) => n.alive); }
  function applyChat(s, npcId) {
    const n = s.npcs.find((x) => x.id === npcId);
    const def = D.NPCS.find((x) => x.id === npcId);
    const rep = report(s, '與' + def.name + '聊天');
    const cost = chatCost(s);
    const outdoor = seasonOf(s).outdoorBody;
    s.cr -= cost;
    const sp = addSpark(s, 0.4 + 0.1 * Math.min(3, n.friend));
    s.body = Math.min(100, s.body + 5 + outdoor);
    n.friend++;
    s.stats.chats++;
    if (cost) rep.delta('cr', -cost);
    rep.delta('spark', sp); rep.delta('body', 5 + outdoor);
    rep.gain(def.cards[(n.friend - 1) % def.cards.length]);
    if (perk(s).chatExtra) rep.gain(def.cards[n.friend % def.cards.length]);
    return rep.done();
  }
  function applyRest(s) {
    const rep = report(s, '休息');
    const b = s.floor === 0 ? 12 : 22;
    s.body = Math.min(100, s.body + b);
    const sp = addSpark(s, 0.3);
    s.stats.rests++;
    rep.delta('body', b); rep.delta('spark', sp);
    if (s.spark >= 3.5) { rep.line('你做了一個很奇怪的夢', 'good'); rep.gain(pick(s, D.CARD_POOLS.dream)); }
    return rep.done();
  }

  // ---------- 創作 ----------
  function evalCraft(s, uids) {
    const cards = uids.map((u) => s.cards.find((c) => c.uid === u)).filter(Boolean);
    const counts = {};
    cards.forEach((c) => c.tags.forEach((t) => { counts[t] = (counts[t] || 0) + 1; }));
    const cardChips = cards.reduce((a, c) => a + c.value, 0) * (perk(s).craftChips || 1);
    const combos = [];
    let maxTag = null, maxCount = 0;
    Object.keys(counts).forEach((t) => { if (counts[t] > maxCount) { maxCount = counts[t]; maxTag = t; } });
    for (const r of D.RESONANCE) {
      if (maxCount >= r.count) {
        combos.push({ id: r.id, name: r.name + '・' + D.TAGS[maxTag].name, chips: r.chips, mult: r.mult, kind: 'res' });
        break;
      }
    }
    // 主組合計足倍率，其餘組合只加 0.5（避免倍率無限疊加）
    const recipes = D.RECIPES
      .filter((rec) => Object.keys(rec.need).every((t) => (counts[t] || 0) >= rec.need[t]))
      .sort((a, b) => b.mult - a.mult);
    recipes.forEach((rec, i) => {
      combos.push({ id: rec.id, name: rec.name, chips: rec.chips, mult: i === 0 ? rec.mult : 0.5, kind: 'recipe',
        secondary: i > 0, isNew: !s.discovered[rec.id], used: !!s.usedRecipes[rec.id] });
    });
    if (Object.keys(counts).length >= D.MEDLEY.minTags) {
      combos.push({ id: D.MEDLEY.id, name: D.MEDLEY.name, chips: D.MEDLEY.chips, mult: D.MEDLEY.mult, kind: 'medley' });
    }
    const chips = Math.round(cardChips + combos.reduce((a, c) => a + c.chips, 0));
    const mult = round1(1 + combos.reduce((a, c) => a + c.mult, 0));
    const base = chips * mult * s.spark;
    const k = kpi(s);
    let kpiMod = 1;
    if (k.tag && counts[k.tag]) kpiMod = k.mod;
    if (k.special === 'lean' && cards.length >= 4) kpiMod = 0.5;
    if (k.special === 'pliable' && s.spark < 2) kpiMod = 1.5;
    if (k.special === 'novelty') {
      const named = combos.filter((c) => c.kind === 'recipe');
      if (named.length && named.every((c) => c.used)) kpiMod = 0.2;
    }
    return { cards, counts, cardChips: Math.round(cardChips), chips, mult, spark: s.spark,
      combos, kpi: k, kpiMod, raw: Math.round(base), total: Math.round(base * kpiMod) };
  }
  function workName(s, ev) {
    const named = ev.combos.filter((c) => c.kind === 'recipe').sort((a, b) => b.mult - a.mult);
    if (named.length) return named[0].name;
    const tags = Object.keys(ev.counts).sort((a, b) => ev.counts[b] - ev.counts[a]);
    if (tags.length >= 2) return D.TAGS[tags[0]].name + '與' + D.TAGS[tags[1]].name;
    return '無題 #' + (s.stats.works + 1);
  }
  // 創作需要材料費：藝術不是免費的
  const craftCost = (n) => 10 + 5 * n;
  function canCreate(s) {
    if (s.spark < 1) return { ok: false, reason: '火花不足 ×1.0，你什麼都想不出來' };
    if (s.cards.length < 2) return { ok: false, reason: '最少需要 2 張素材' };
    if (s.cr < craftCost(2)) return { ok: false, reason: '連 $' + craftCost(2) + ' 材料費都付不起' };
    return { ok: true };
  }
  function commitCraft(s, uids) {
    const ev = evalCraft(s, uids);
    const used = new Set(uids);
    s.cards = s.cards.filter((c) => !used.has(c.uid));
    s.cr -= craftCost(ev.cards.length);
    const fresh = ev.combos.filter((c) => c.kind === 'recipe' && !s.discovered[c.id]);
    fresh.forEach((c) => { s.discovered[c.id] = true; });
    ev.combos.filter((c) => c.kind === 'recipe').forEach((c) => { s.usedRecipes[c.id] = true; });
    const tags = Object.keys(ev.counts).sort((a, b) => ev.counts[b] - ev.counts[a]);
    const work = { day: s.day, quarter: s.quarter, name: workName(s, ev), tags,
      score: ev.total, raw: ev.raw, medium: bgOf(s).medium, n: ev.cards.length };
    s.works.push(work);
    s.stats.works++;
    if (!s.stats.bestWork || work.raw > s.stats.bestWork.raw) s.stats.bestWork = work;
    s.body -= 4;
    s.saturation = Math.min(1.15, s.saturation + 0.02);
    let sparkUp = 0;
    if (fresh.length) sparkUp = addSpark(s, 0.15);
    return { ev, work, fresh, sparkUp };
  }

  // ---------- 行動清單（讓介面顯示取捨） ----------
  function actions(s) {
    const list = [];
    const outdoor = seasonOf(s).outdoorBody;
    const labelLocked = s.rating < 2 ? '平台帳戶審查中（評分低於 2 星）' : null;
    let labelCr = 0;
    for (let i = 0; i < 28; i++) labelCr += labelItemPay(s, i);
    labelCr = Math.round(labelCr);
    const labelSpark = round1(28 * labelItemDrain(s));
    if (!isNight(s)) {
      list.push({ id: 'label', name: 'AI 數據標註', sub: '教 AI 認貓，好讓它以後不再需要你',
        fx: [['cr', '約 +$' + labelCr], ['body', '−8'], ['spark', '約 −' + labelSpark], ['card', '機械']],
        enabled: !s.removed.label && !labelLocked,
        reason: s.removed.label ? '職位已被 AI 取代' : labelLocked });
      list.push({ id: 'smile', name: '企業情緒陪伴', sub: '陪有錢人說笑、點頭、倒酒，笑得越準越值錢',
        fx: [['cr', '約 +$150'], ['body', '−6'], ['spark', '約 −' + round1(24 * smileItemDrain(s, 'perfect'))], ['card', '霓虹']],
        enabled: !s.removed.smile, reason: s.removed.smile ? '已被 AI 情緒伴侶 2.0 取代' : null });
      list.push({ id: 'dive', name: '舊城潛水', sub: s.flags.divedDay === s.day ? '舊城今天已被搜刮過，收穫會很少' : '用魚叉捕魚，打撈水淹舊城的遺物',
        fx: [['cr', '漁獲 約 +$20'], ['body', '−' + diveBodyCost(s) + ' 起'], ['spark', '+少許'], ['card', '水・記憶']],
        enabled: s.body > 10, reason: s.body > 10 ? null : '身體太差，下水會有生命危險' });
      const cost = chatCost(s);
      list.push({ id: 'chat', name: '找朋友聊天', sub: '還有 ' + aliveNpcs(s).length + ' 個朋友留在浮城',
        fx: [['cr', cost ? '−$' + cost : '免費'], ['body', '+' + (5 + outdoor)], ['spark', '+0.4 起'], ['card', '人情']],
        enabled: aliveNpcs(s).length > 0 && s.cr >= cost,
        reason: aliveNpcs(s).length === 0 ? '他們全都被帶走了' : s.cr < cost ? '沒錢請人喝東西' : null });
      list.push({ id: 'rest', name: '休息', sub: '什麼都不做，也是一種選擇',
        fx: [['body', '+' + (s.floor === 0 ? 12 : 22)], ['spark', '+0.3']], enabled: true });
    } else {
      const c = canCreate(s);
      list.push({ id: 'create', name: '創作', sub: '把今天的經歷變成作品，讓外星人看見',
        fx: [['card', '使用 2 至 ' + s.craftSlots + ' 張素材'], ['cr', '材料 −$' + craftCost(2) + ' 起'], ['sig', '訊號 ↑'], ['body', '−4']],
        enabled: c.ok, reason: c.reason });
      list.push({ id: 'ot', name: '深夜加班標註', sub: '收入 ×1.5，消耗 ×1.5',
        fx: [['cr', '約 +$' + Math.round(labelCr * 1.5)], ['body', '−14'], ['spark', '約 −' + round1(labelSpark * 1.5)]],
        enabled: !s.removed.label && !labelLocked && s.body > 14,
        reason: s.removed.label ? '職位已被 AI 取代' : labelLocked || (s.body <= 14 ? '身體撐不住了' : null) });
      list.push({ id: 'rest', name: '早點睡', sub: '明天又是新的一天',
        fx: [['body', '+' + (s.floor === 0 ? 12 : 22)], ['spark', '+0.3']], enabled: true });
    }
    return list;
  }

  // ---------- 商店 ----------
  function shop(s) {
    const items = [];
    const S = D.SHOP;
    items.push({ id: 'premium', ...S.premium, owned: s.premiumUntil >= s.day,
      note: s.premiumUntil >= s.day ? '有效至第 ' + s.premiumUntil + ' 天' : null });
    items.push({ id: 'supplement', ...S.supplement });
    items.push({ id: 'realfood', ...S.realfood, owned: s.realFoodDay === s.day, note: s.realFoodDay === s.day ? '今天已經吃過' : null });
    items.push({ id: 'tools', ...S.tools, owned: s.craftSlots >= 5 });
    ['tank', 'harpoon', 'bag', 'monitor'].forEach((k) => items.push({ id: k, ...S[k], owned: s.gear[k] }));
    if (s.floor === 0) {
      const f = Math.floor(s.water) + 1;
      if (f <= 8) items.push({ id: 'rehouse', name: '重新租屋（' + f + ' 樓）', desc: '按金為兩期租金', cost: 2 * rentAmount(s, f), target: f });
    } else {
      if (s.floor < 8) items.push({ id: 'moveup', name: '搬上 ' + (s.floor + 1) + ' 樓', desc: '每期租金 $' + rentAmount(s, s.floor + 1) + '，按金一期', cost: rentAmount(s, s.floor + 1) });
      if (s.floor > 1 && s.water < s.floor - 1) items.push({ id: 'movedown', name: '搬到 ' + (s.floor - 1) + ' 樓', desc: '每期租金 $' + rentAmount(s, s.floor - 1) + '，但離水更近', cost: 0 });
    }
    items.forEach((it) => { it.enabled = !it.owned && s.cr >= it.cost; });
    return items;
  }
  function buy(s, id) {
    const it = shop(s).find((x) => x.id === id);
    if (!it || !it.enabled) return { ok: false, msg: '無法購買' };
    s.cr -= it.cost;
    switch (id) {
      case 'premium': s.premiumUntil = s.day + 4; break;
      case 'supplement':
        addSpark(s, 1.2);
        s.flags.crashDay = s.day + 2; s.flags.crashAmt += 1.6; break;
      case 'realfood': s.realFoodDay = s.day; s.body = Math.min(100, s.body + 15); addSpark(s, 0.2); break;
      case 'tools': s.craftSlots = 5; break;
      case 'tank': case 'harpoon': case 'bag': case 'monitor': s.gear[id] = true; break;
      case 'moveup': s.floor += 1; break;
      case 'movedown': s.floor -= 1; break;
      case 'rehouse': s.floor = it.target; s.graceUsed = false; s.debt = 0; break;
    }
    return { ok: true, msg: '已購買：' + it.name };
  }

  // ---------- 早上 ----------
  function morning(s) {
    if (s.morning && s.morning.day === s.day) return s.morning;
    const S = seasonOf(s);
    const feed = [{ kind: 'weather', text: pick(s, D.FEED.weather[s.season]) }];
    (s.newsQueue || []).forEach((t) => feed.push({ kind: 'news', text: t }));
    s.newsQueue = [];
    feed.push(rand(s) < 0.5 ? { kind: 'ad', text: pick(s, D.FEED.ads) } : { kind: 'post', text: pick(s, D.FEED.conspiracy) });
    const k = kpi(s);
    feed.push({ kind: 'alien', text: '【星際人才發展局・招募簡報】' + k.name + '。' + k.desc + '。' });
    if (flooded(s)) feed.push({ kind: 'warn', text: '水已經淹到你住的 ' + s.floor + ' 樓。你可以搬上一層，或者繼續泡在水裡。' });
    const astar = D.ASTAR[s.day] || null;
    s.morning = { day: s.day, feed, astar, season: S.name };
    return s.morning;
  }

  function applyAutomationNews(s, before, rep) {
    Object.keys(D.FEED.autoNews).map(Number).forEach((th) => {
      if (before < th && s.auto >= th && !s.newsSeen[th]) {
        s.newsSeen[th] = true;
        s.newsQueue = s.newsQueue || [];
        s.newsQueue.push(D.FEED.autoNews[th]);
        if (rep) rep.line(D.FEED.autoNews[th], 'news');
      }
    });
    if (s.auto >= 50) s.removed.smile = true;
    if (s.auto >= 100) s.removed.label = true;
  }

  // ---------- 一天結束 ----------
  function endDay(s) {
    const S = seasonOf(s);
    const rep = report(s, '第 ' + s.day + ' 天結算');
    rep.review = null; rep.ending = null; rep.event = null;
    // 晚餐
    if (s.flags.fishDinner === s.day) {
      s.body = Math.min(100, s.body + 6);
      rep.line('晚餐：自己抓的魚', 'good', 6, 'body');
    } else if (s.cr >= S.food) {
      s.cr -= S.food;
      rep.line(s.season === 'heat' ? '晚餐與電費' : '晚餐（合成糊）', 'cost', -S.food, 'cr');
    } else {
      s.body -= 22; s.stats.hungryDays++;
      addSpark(s, -0.3);
      rep.line('沒錢吃飯，餓著肚子睡覺', 'bad', -22, 'body');
      rep.line('飢餓令你無法思考', 'bad', -0.3, 'spark');
      rep.gain('e_hunger');
    }
    // 睡覺
    if (s.floor === 0) { s.body -= 10; rep.line('在天橋下睡不好', 'bad', -10, 'body'); }
    else if (flooded(s)) { s.body -= 8; rep.line('家裡正在淹水', 'bad', -8, 'body'); }
    else { s.body = Math.min(100, s.body + 8); rep.line('睡覺', '', 8, 'body'); }
    if (S.nightBody) { s.body += S.nightBody; rep.line('熱得睡不著', 'bad', S.nightBody, 'body'); }
    // 補充劑反彈
    if (s.flags.crashDay === s.day && s.flags.crashAmt) {
      addSpark(s, -s.flags.crashAmt);
      rep.line('靈感補充劑藥效過去，火花反彈下跌', 'bad', -s.flags.crashAmt, 'spark');
      s.flags.crashAmt = 0;
    }
    // 平台活躍度
    if (!s.workedToday) {
      s.rating = clamp(s.rating - 0.15, 1, 5);
      rep.line('今天沒有上班，平台評分 −0.15', 'bad');
    }
    s.workedToday = false;
    if (s.rating < 3.5) s.rating = Math.min(3.5, s.rating + 0.05);
    // 全城自動化
    const autoBefore = s.auto;
    s.auto = clamp(s.auto + 0.8, 0, 100);
    applyAutomationNews(s, autoBefore, rep);
    // 朋友的訊號
    s.npcs.forEach((n) => {
      if (!n.alive) return;
      const def = D.NPCS.find((x) => x.id === n.id);
      n.signal += Math.round(def.base * (0.7 + rand(s) * 0.6) * (1 + s.quarter * 0.4));
    });
    // 隨機事件
    if (rand(s) < 0.45) {
      const pool = D.EVENTS.filter((e) => !e.onlySeason || e.onlySeason === s.season);
      const weights = pool.map((e) => e.w * ((e.season && e.season[s.season]) || 1));
      let r = rand(s) * weights.reduce((a, b) => a + b, 0);
      let ev = pool[0];
      for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) { ev = pool[i]; break; } }
      rep.event = ev.text;
      rep.line(ev.text, 'event');
      if (ev.body) { s.body = Math.min(100, s.body + ev.body); rep.delta('body', ev.body); }
      if (ev.spark) rep.delta('spark', addSpark(s, ev.spark));
      if (ev.crPct) { const loss = Math.min(ev.crMax, Math.round(s.cr * -ev.crPct)); s.cr -= loss; rep.delta('cr', -loss); }
      if (ev.rentHike) s.rentHike += ev.rentHike;
      if (ev.rating) s.rating = clamp(s.rating + ev.rating, 1, 5);
      if (ev.flag) s.flags[ev.flag] = s.day + 1;
      if (ev.card) rep.gain(ev.card);
    }
    // 水位
    const wasFlooded = flooded(s);
    s.water = Math.min(8.5, s.water + S.water);
    if (!wasFlooded && flooded(s)) rep.line('水位升到 ' + Math.floor(s.water) + ' 樓，淹進你家了！', 'bad');
    // 交租
    if (s.day % 5 === 0 && s.floor > 0) {
      const due = rentAmount(s) + s.debt;
      if (s.cr >= due) {
        s.cr -= due; s.debt = 0; s.graceUsed = false;
        rep.line('交租', 'cost', -due, 'cr');
        rep.rent = { paid: due };
      } else if (!s.graceUsed) {
        s.graceUsed = true; s.debt = Math.round(due * 1.2);
        rep.line('交不起租。房東寬限一期，下期連罰款要多付 $' + s.debt, 'bad');
        rep.rent = { grace: s.debt };
      } else {
        s.floor = 0; s.debt = 0; s.graceUsed = false;
        rep.line('第二次交不起租。你被趕出門，今晚開始睡在天橋下。', 'bad');
        rep.gain('e_evict');
        rep.rent = { evicted: true };
      }
    }
    // 麻木
    if (s.spark <= 0.2) s.numbStreak++; else s.numbStreak = 0;
    // 探射燈
    rep.searchlight = Math.min(1.5, signal(s) / threshold(s));
    // 篩選日
    if (s.day === reviewDay(s)) rep.review = makeReview(s);
    // 結局判定
    s.body = Math.min(100, s.body);
    if (s.body <= 0) rep.ending = endingFor(s, 'death');
    else if (s.numbStreak >= 4) rep.ending = endingFor(s, 'grey');
    else if (rep.review && rep.review.pass) rep.ending = endingFor(s, 'recruited');
    else if (rep.review && s.day >= D.DAYS) rep.ending = endingFor(s, 'ordinary');
    if (rep.ending) s.ended = rep.ending;
    else { s.day++; s.slot = 0; s.quarter = quarterOf(s.day); }
    return rep.done();
  }

  function grade(v, cuts) {
    const g = ['S', 'A', 'B', 'C', 'D'];
    for (let i = 0; i < cuts.length; i++) if (v >= cuts[i]) return g[i];
    return 'D';
  }
  function makeReview(s) {
    const sig = signal(s);
    const th = threshold(s);
    const qWorks = s.works.filter((w) => w.quarter === s.quarter);
    const fit = qWorks.length ? qWorks.filter((w) => w.score >= w.raw).length / qWorks.length : 0;
    const plastic = s.spark > 3.5 ? 'C' : s.spark >= 2 ? 'A' : s.spark >= 1 ? 'B' : 'D';
    const plasticNote = s.spark > 3.5 ? '火花過盛，難以管理' : s.spark >= 2 ? '容易塑造' : s.spark >= 1 ? '尚可' : '沒有可塑造的部分';
    const pass = sig >= th;
    let taken = null;
    if (!pass) {
      const alive = s.npcs.filter((n) => n.alive).sort((a, b) => b.signal - a.signal);
      if (alive.length) {
        alive[0].alive = false;
        taken = D.NPCS.find((x) => x.id === alive[0].id).name;
        s.saturation = Math.max(0.25, s.saturation - 0.15);
      }
    }
    return {
      quarter: s.quarter, day: s.day, signal: sig, threshold: th, pass, taken,
      kpi: kpi(s).name, works: qWorks.length,
      grades: [
        { k: '靈感潛力', g: grade(sig / th, [1.5, 1, 0.75, 0.5]), note: sig.toLocaleString() + ' / ' + th.toLocaleString() },
        { k: '文化契合度', g: grade(fit, [0.95, 0.75, 0.5, 0.25]), note: qWorks.length ? Math.round(fit * 100) + '% 作品符合 KPI' : '沒有作品' },
        { k: '可塑性', g: plastic, note: plasticNote },
      ],
    };
  }

  function epitaph(s) {
    const last = s.works[s.works.length - 1];
    let t = '死於第 ' + s.day + ' 天。' + bgOf(s).name + '。';
    if (s.stats.labels > 0) t += '標註過 ' + s.stats.labels.toLocaleString() + ' 張圖片。';
    else if (s.stats.smiles > 0) t += '一共笑了 ' + s.stats.smiles + ' 次，沒有一次是真心的。';
    else if (s.stats.fish > 0) t += '抓過 ' + s.stats.fish + ' 條魚。';
    t += last ? '最後的作品是《' + last.name + '》。' : '一生沒有完成過任何作品。';
    return t;
  }
  function endingFor(s, type) {
    const n = s.works.length;
    switch (type) {
      case 'death':
        return { type, day: s.day, title: '死亡', text: epitaph(s) };
      case 'grey':
        return { type, day: s.day, title: '灰化',
          text: '你沒有死，只是不再思考。浮城多了一個非常有效率的標註員，評分 ' + s.rating.toFixed(1) + ' 星。' };
      case 'ordinary':
        return { type, day: s.day, title: '平凡人',
          text: '第 30 天。探射燈今晚沒有停在你的窗外。水位升到 ' + Math.floor(s.water) + ' 樓，而你仍然在這裡。'
            + (n ? '你留下了 ' + n + ' 件作品，它們會沉入舊城，等待下一個人把它們打撈上來。' : '你沒有留下任何作品，但你撐過來了。') };
      case 'recruited':
        return { type, day: s.day, title: '被選中',
          text: '第 ' + s.day + ' 天，探射燈停在你的窗外。' + (s.day === 10 ? '破格錄取。' : '') };
    }
  }

  // ---------- 跨局紀錄 ----------
  function recordMeta(meta, s, finalType) {
    meta = meta || {};
    meta.runs = (meta.runs || 0) + 1;
    meta.endings = meta.endings || {};
    meta.endings[finalType] = (meta.endings[finalType] || 0) + 1;
    meta.recipes = meta.recipes || {};
    Object.keys(s.discovered).forEach((k) => { meta.recipes[k] = true; });
    meta.log = meta.log || { fish: {}, relics: {} };
    Object.keys(s.log.fish).forEach((k) => { meta.log.fish[k] = true; });
    Object.keys(s.log.relics).forEach((k) => { meta.log.relics[k] = true; });
    meta.relics = meta.relics || [];
    const best = s.stats.bestWork;
    if (best) {
      meta.relics.push({ name: best.name, tags: best.tags, score: best.raw });
      if (meta.relics.length > 8) meta.relics.shift();
    }
    if (finalType === 'grey') meta.greyed = (meta.greyed || 0) + 1;
    meta.bestSignal = Math.max(meta.bestSignal || 0, best ? best.raw : 0);
    return meta;
  }

  // ---------- 工具 ----------
  function report(s, title) {
    const r = { title, lines: [], deltas: { cr: 0, body: 0, spark: 0 }, cards: [], dropped: [] };
    return {
      get review() { return r.review; }, set review(v) { r.review = v; },
      get ending() { return r.ending; }, set ending(v) { r.ending = v; },
      get event() { return r.event; }, set event(v) { r.event = v; },
      get rent() { return r.rent; }, set rent(v) { r.rent = v; },
      get searchlight() { return r.searchlight; }, set searchlight(v) { r.searchlight = v; },
      line(text, kind, v, stat) { r.lines.push({ text, kind: kind || '', v, stat }); if (stat) r.deltas[stat] += v; },
      delta(stat, v) { r.deltas[stat] += v; },
      gain(id) {
        const res = addCard(s, id);
        r.cards.push(res.card);
        if (res.dropped) r.dropped.push(res.dropped);
      },
      done() { r.deltas.spark = round1(r.deltas.spark); return r; },
    };
  }

  IE.Rules = {
    newRun, rand, pick, clamp, round1, addCard, legacyCard, addSpark, SPARK_MAX,
    quarterOf, isNight, threshold, reviewDay, kpi, flooded, nextRentDay, rentAmount, signal,
    labelItemPay, labelItemDrain, labelConfig, applyLabel,
    smileItemPay, smileItemDrain, smileConfig, applySmile,
    diveConfig, diveBodyCost, applyDive,
    chatCost, aliveNpcs, applyChat, applyRest,
    evalCraft, commitCraft, canCreate, craftCost,
    actions, shop, buy, morning, endDay, epitaph, endingFor, recordMeta,
    MAX_CARDS,
  };
});

// ---- js/audio.js ----
// 音樂與音效：全部以 Web Audio 即時合成，沒有外部音檔。
// 音樂分為 4 層，由火花控制：火花高時旋律豐富；火花低時只剩機械節拍。
(function (IE) {
  'use strict';
  let ctx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;
  let muted = false, timer = null, step = 0, nextTime = 0;
  let spark = 2, mode = 'city', tempo = 92;
  const layers = {};

  const CHORDS = {
    city:  [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]],   // Am F C G
    alien: [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]],   // C Am F G（電梯音樂）
    work:  [[57, 60, 64], [57, 60, 64], [56, 60, 63], [56, 60, 63]],   // 單調
  };
  const LEAD = [0, 2, 4, 2, 1, 0, 2, -1, 0, 4, 2, 1, 0, -1, 0, -1];

  const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
  const clamp01 = (v) => Math.max(0, Math.min(1, v));

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.7; master.connect(ctx.destination);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.32; musicBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.55; sfxBus.connect(master);
    ['beat', 'bass', 'arp', 'lead'].forEach((k) => {
      layers[k] = ctx.createGain(); layers[k].gain.value = 0; layers[k].connect(musicBus);
    });
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextTime = ctx.currentTime + 0.1;
    timer = setInterval(schedule, 25);
    applyLayers();
  }

  function applyLayers() {
    if (!ctx) return;
    const t = ctx.currentTime;
    const v = {
      beat: mode === 'alien' ? 0.25 : 0.9,
      bass: clamp01((spark - 0.6) / 1.4),
      arp: mode === 'work' ? 0.15 : clamp01((spark - 1.6) / 1.4),
      lead: mode === 'work' ? 0 : clamp01((spark - 2.6) / 1.2),
    };
    if (mode === 'alien') { v.bass = 0.6; v.arp = 0.5; v.lead = 0.8; }
    Object.keys(v).forEach((k) => layers[k].gain.setTargetAtTime(v[k], t, 0.4));
  }

  function tone(type, freq, start, dur, gain, dest, slideTo) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, start);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, start + dur);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(gain, start + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(dest);
    o.start(start); o.stop(start + dur + 0.02);
  }
  function noise(start, dur, gain, dest, hp) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = hp ? 'highpass' : 'lowpass';
    f.frequency.value = hp || 900;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, start);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    src.connect(f); f.connect(g); g.connect(dest);
    src.start(start); src.stop(start + dur + 0.02);
  }

  function schedule() {
    if (!ctx) return;
    const spb = 60 / tempo / 4; // 每個 16 分音符
    while (nextTime < ctx.currentTime + 0.12) {
      playStep(step, nextTime, spb);
      nextTime += spb;
      step = (step + 1) % 64;
    }
  }
  function playStep(i, t, spb) {
    const bar = Math.floor(i / 16) % 4;
    const s = i % 16;
    const chord = (CHORDS[mode] || CHORDS.city)[bar];
    // 機械節拍
    if (s % 8 === 0) tone('sine', 120, t, 0.18, 0.5, layers.beat, 45);
    if (s % 2 === 0) noise(t, 0.03, 0.12, layers.beat, 7000);
    if (s === 4 || s === 12) noise(t, 0.09, 0.18, layers.beat, 1800);
    // 低音
    if (s % 4 === 0) tone('triangle', midi(chord[0] - 24), t, spb * 3.5, 0.35, layers.bass);
    // 琶音
    if (s % 2 === 0) tone('square', midi(chord[(s / 2) % 3] + 12), t, spb * 1.6, 0.06, layers.arp);
    // 旋律
    if (s % 4 === 0 || s % 4 === 3) {
      const deg = LEAD[(s + bar * 4) % 16];

    }

  const SFX = {
    coin() { const t = ctx.currentTime; tone('square', 988, t, 0.06, 0.12, sfxBus); tone('square', 1319, t + 0.05, 0.1, 0.12, sfxBus); },
    spark() { const t = ctx.currentTime; tone('sine', 1200, t, 0.35, 0.06, sfxBus, 260); },
    wrong() { const t = ctx.currentTime; tone('square', 110, t, 0.18, 0.15, sfxBus, 80); },
    combo() { const t = ctx.currentTime; [0, 4, 7, 12].forEach((n, i) => tone('square', midi(72 + n), t + i * 0.05, 0.08, 0.08, sfxBus)); },
    stamp() { const t = ctx.currentTime; noise(t, 0.08, 0.35, sfxBus); tone('sine', 90, t, 0.1, 0.3, sfxBus, 50); },
    click() { const t = ctx.currentTime; tone('square', 660, t, 0.03, 0.05, sfxBus); },
    perfect() { const t = ctx.currentTime; tone('triangle', 1568, t, 0.09, 0.1, sfxBus); tone('triangle', 2093, t + 0.04, 0.1, 0.08, sfxBus); },
    good() { const t = ctx.currentTime; tone('triangle', 1047, t, 0.08, 0.08, sfxBus); },
    splash() { const t = ctx.currentTime; noise(t, 0.4, 0.3, sfxBus); },
    bubble() { const t = ctx.currentTime; tone('sine', 400, t, 0.12, 0.08, sfxBus, 900); },
    pickup() { const t = ctx.currentTime; [0, 7, 12].forEach((n, i) => tone('triangle', midi(76 + n), t + i * 0.06, 0.1, 0.1, sfxBus)); },
    hurt() { const t = ctx.currentTime; noise(t, 0.15, 0.3, sfxBus); tone('sawtooth', 200, t, 0.2, 0.1, sfxBus, 60); },
    tick() { const t = ctx.currentTime; tone('square', 2400, t, 0.02, 0.04, sfxBus); },
    chips() { const t = ctx.currentTime; tone('square', 880 + Math.random() * 200, t, 0.04, 0.06, sfxBus); },
    mult() { const t = ctx.currentTime; tone('sawtooth', 220, t, 0.25, 0.1, sfxBus, 880); },
    boom() {
      const t = ctx.currentTime;
      noise(t, 0.6, 0.4, sfxBus);
      [0, 4, 7, 11, 14].forEach((n, i) => tone('triangle', midi(60 + n), t + i * 0.03, 1.2, 0.09, sfxBus));
    },
    beam() { const t = ctx.currentTime; tone('sine', 180, t, 3.5, 0.15, sfxBus, 1400); tone('triangle', 90, t, 3.5, 0.1, sfxBus, 700); },
    rent() { const t = ctx.currentTime; tone('square', 330, t, 0.15, 0.1, sfxBus); tone('square', 262, t + 0.15, 0.25, 0.1, sfxBus); },
    ad() { const t = ctx.currentTime; tone('square', 1760, t, 0.05, 0.06, sfxBus); tone('square', 1760, t + 0.08, 0.05, 0.06, sfxBus); },
  };

  IE.Audio = {
    init,
    get ready() { return !!ctx; },
    setSpark(v) { spark = v; applyLayers(); },
    setMode(m, bpm) { mode = m; tempo = bpm || (m === 'work' ? 120 : m === 'alien' ? 84 : 92); applyLayers(); },
    sfx(name) { if (ctx && SFX[name] && !muted) { try { SFX[name](); } catch (e) { /* 音效失敗不影響遊戲 */ } } },
    toggleMute() {
      muted = !muted;
      if (master) master.gain.setTargetAtTime(muted ? 0 : 0.7, ctx.currentTime, 0.05);
      return muted;
    },
    get muted() { return muted; },
  };
})(window.IE = window.IE || {});

        st.money = Math.round(st.money / 2);
        C.banner(st, '氧氣耗盡', '#ff4d5e', '你拚命浮上水面，失去了一半收穫');
        A.sfx('hurt');
      } else { C.banner(st, '浮上水面', '#ffc247'); A.sfx('splash'); }
    }
    const endTick = C.ender(st, () => {
      const fishOut = { sardine: 0, eel: 0, grouper: 0, jelly: st.fish.jelly };
      st.bag.forEach((b) => { if (b.kind === 'fish') fishOut[b.type]++; });
      return {
        relics: st.bag.filter((b) => b.kind === 'card' || b.kind === 'legacy').map((b) => (b.kind === 'legacy' ? b.card : b.id)),
        money: st.money, fish: fishOut, hits: st.hits, drowned: st.drowned,
      };
    }, onDone);

    // 暗角：用另一張畫布挖出頭燈與發光物的光圈
    const dark = document.createElement('canvas');
    dark.width = 320; dark.height = 180;
    const dctx = dark.getContext('2d');
    function hole(x, y, r) {
      const g = dctx.createRadialGradient(x, y, r * 0.3, x, y, r);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, r, 0, Math.PI * 2); dctx.fill();
    }

    return {
      kind: 'dive',
      controls: [{ id: 'fire', label: '魚叉', key: '空白鍵' }, { id: 'up', label: '↑ 上浮', key: '按住' }],
      hint: '電腦：方向鍵或 WASD 游泳，滑鼠點擊向該方向發射魚叉（或按空白鍵自動瞄準）。手機：按住畫面游向手指，按「魚叉」自動瞄準。停在儲物櫃旁邊可以撬開。氧氣用完之前要浮上水面。',
      control(id, down) {
        if (id === 'fire') { st.fireHeld = !!down; if (down) fire(); }
        if (id === 'up') st.upHeld = !!down;
      },
      key(k, down) {
        st.keys[k] = down;
        if ((k === ' ' || k === 'j' || k === 'J' || k === 'k' || k === 'K') ) { st.fireHeld = down; if (down) fire(); }
      },
      pointer(type, x, y, ptype) {
        const wx = x + st.cam.x, wy = y + st.cam.y;
        if (ptype === 'mouse') {
          st.aim = { x: wx, y: wy };
          if (type === 'down') fire(Math.atan2(wy - (st.y + 3), wx - (st.x + 6)));
          return;
        }
        if (type === 'down' || (type === 'move' && st.steer)) st.steer = { x: wx, y: wy };
        if (type === 'up') st.steer = null;
      },
      update(dt) {
        st.t += dt;
        if (st.banner) st.banner.t += dt;
        if (st.zoneBanner) { st.zoneBanner.t += dt; if (st.zoneBanner.t > 2.2) st.zoneBanner = null; }
        st.popups.forEach((p) => { p.t += dt; });
        st.popups = st.popups.filter((p) => p.t < 2.4);
        st.flash = Math.max(0, st.flash - dt);
        fx.update(dt);
        // 魚
        schools.forEach((sc) => {
          sc.cx += sc.vx * dt; sc.cy += Math.sin(st.t + sc.ph) * 6 * dt;
          if (sc.cx < 60 || sc.cx > 440) sc.vx = -sc.vx;
          const d = Math.hypot(sc.cx - st.x, sc.cy - st.y);
          if (d < 60) { sc.cx += (sc.cx - st.x) / d * 30 * dt; sc.cy += (sc.cy - st.y) / d * 20 * dt; }
          sc.cy = Math.max(50, Math.min(185, sc.cy));
        });
        fish.forEach((f) => {
          if (f.hp <= 0) return;
          f.flashT = Math.max(0, f.flashT - dt);
          if (f.type === 'sardine') {
            const sc = f.school;
            const tx = sc.cx + f.ox + Math.sin(st.t * 2 + f.oy) * 4, ty = sc.cy + f.oy;
            f.vx += ((tx - f.x) * 3 - f.vx) * Math.min(1, dt * 3);
            f.vy += ((ty - f.y) * 3 - f.vy) * Math.min(1, dt * 3);
            const dx = f.x - st.x, dy = f.y - st.y, d = Math.hypot(dx, dy);
            if (d < 40) { f.vx += dx / d * 140 * dt; f.vy += dy / d * 140 * dt; }
            f.x += f.vx * dt; f.y = Math.max(40, Math.min(190, f.y + f.vy * dt));
          } else if (f.type === 'eel') {
            f.t += dt; f.cool -= dt; f.stun = Math.max(0, f.stun - dt);
            if (f.stun > 0) return;
            const dx = st.x + 6 - f.x, dy = st.y + 3 - f.y, d = Math.hypot(dx, dy);
            if (f.state === 'patrol') {
              f.x += f.dir * 22 * dt; f.y = f.hy + Math.sin(f.t * 2) * 6;
              if (Math.abs(f.x - f.hx) > 50) f.dir = -Math.sign(f.x - f.hx);
              if (d < 72 && f.cool <= 0 && st.phase === 'play') { f.state = 'charge'; f.t = 0; f.cx = dx / d; f.cy = dy / d; }
            } else if (f.state === 'charge') {
              f.x += f.cx * 100 * dt; f.y += f.cy * 100 * dt; f.dir = Math.sign(f.cx) || f.dir;
              if (d < 9) { hurt(5, '被霓虹鰻咬'); f.state = 'retreat'; f.t = 0; }
              else if (f.t > 1) { f.state = 'retreat'; f.t = 0; }
            } else {
              f.x -= f.cx * 35 * dt; f.y -= f.cy * 35 * dt;
              if (f.t > 1.2) { f.state = 'patrol'; f.cool = 2; f.hx = f.x; f.hy = Math.max(225, Math.min(360, f.y)); }
            }
            f.y = Math.max(214, Math.min(368, f.y));
          } else if (f.type === 'grouper') {
            f.flee = Math.max(0, f.flee - dt);
            f.x += (f.flee > 0 ? 45 * Math.sign(f.vx) : f.vx) * dt;
            f.y += Math.sin(st.t * 0.8 + f.x * 0.01) * 4 * dt;
            if (f.x < 70 || f.x > 450) f.vx = -f.vx;
            if (Math.random() < dt * 0.2) f.vx = -f.vx;
          } else if (f.type === 'jelly') {
            f.y = f.y0 + Math.sin(st.t * 1.1 + f.ph) * 14;
            if (st.phase === 'play' && Math.hypot(f.x + 4 - (st.x + 6), f.y + 4 - (st.y + 3)) < 8) hurt(3, '被水母螫到');
          }
        });
        debris.forEach((d) => {
          d.x += d.vx * dt;
          if (d.x < 10 || d.x > WW - 20) d.vx = -d.vx;
          if (st.phase === 'play' && Math.abs(d.x + d.w / 2 - (st.x + 6)) < d.w / 2 + 5 && Math.abs(d.y + 2 - (st.y + 3)) < 6) hurt(3, '撞到漂浮的碎片');
        });
        if (st.phase === 'intro' && st.t >= 0) st.phase = 'play';
        if (st.phase !== 'play') { endTick(dt); return; }

        // ---------- 潛水員 ----------
        let ax = 0, ay = 0;
        const k = st.keys;
        if (k.ArrowLeft || k.a || k.A) ax -= 1;
        if (k.ArrowRight || k.d || k.D) ax += 1;
        if (k.ArrowUp || k.w || k.W) ay -= 1;
        if (k.ArrowDown || k.s || k.S) ay += 1;
        if (st.upHeld) ay = -1;
        if (st.steer) {
          const dx = st.steer.x - (st.x + 6), dy = st.steer.y - (st.y + 3), d = Math.hypot(dx, dy);
          if (d > 4) { ax = dx / d; ay = dy / d; }
        }
        const len = Math.hypot(ax, ay) || 1;
        const sp = speedMax();
        st.vx += (ax / len * sp * (ax ? 1 : 0) - st.vx) * Math.min(1, dt * 4);
        st.vy += (ay / len * sp * (ay ? 1 : 0) - st.vy) * Math.min(1, dt * 4) - (ax === 0 && ay === 0 ? 5 * dt : 0);
        const nx = Math.max(4, Math.min(WW - 16, st.x + st.vx * dt));
        if (!collides(nx, st.y, 12, 6)) st.x = nx; else st.vx = 0;
        const ny = Math.max(8, Math.min(WH - 10, st.y + st.vy * dt));
        if (!collides(st.x, ny, 12, 6)) st.y = ny; else st.vy = 0;
        if (st.aim) st.face = st.aim.x > st.x + 6 ? 1 : -1;
        else if (Math.abs(st.vx) > 6) st.face = st.vx > 0 ? 1 : -1;
        if (st.y > 60) st.been = true;
        if (st.been && st.y < SURF - 2) { finish(false); endTick(dt); return; }
        const z = zoneOf(st.y + 3);
        if (!st.seenZone[z]) {
          st.seenZone[z] = true;
          const zone = D().DIVE_ZONES[z];
          st.zoneBanner = { text: zone.name, sub: '深度 ' + zone.depth + ' 米', t: 0 };
          A.sfx('bubble');
        }
        // 攝影機
        const tcx = Math.max(0, Math.min(WW - 320, st.x - 154)), tcy = Math.max(0, Math.min(WH - 180, st.y - 84));
        st.cam.x += (tcx - st.cam.x) * Math.min(1, dt * 5);
        st.cam.y += (tcy - st.cam.y) * Math.min(1, dt * 5);
        // 氧氣
        if (st.y > SURF) {
          const before = st.ox;
          st.ox -= dt;
          if (Math.random() < dt * 2) fx.add({ x: st.x + (st.face > 0 ? 10 : 2), y: st.y, vy: -22, vx: rnd(-4, 4), life: 1.5, color: '#bfefff' });
          if (st.ox < cfg.oxygen * 0.3 && Math.floor(st.ox * 2) !== Math.floor(before * 2)) A.sfx('tick');
        }
        if (st.ox <= 0) { finish(true); endTick(dt); return; }
        st.inv = Math.max(0, st.inv - dt);
        // 魚叉
        st.cd = Math.max(0, st.cd - dt);
        if (st.fireHeld && st.cd <= 0 && !st.harpoon) fire();
        const h = st.harpoon;
        if (h) {
          if (h.state === 'out') {
            const step = 320 * dt;
            h.x += h.dx * step; h.y += h.dy * step; h.dist += step;
            for (const f of fish) {
              if (f.hp <= 0) continue;
              const size = f.type === 'grouper' ? 10 : f.type === 'eel' ? 7 : 5;
              const fxp = f.type === 'grouper' ? f.x + 8 : f.type === 'jelly' ? f.x + 4 : f.x;
              const fyp = f.type === 'grouper' ? f.y + 4 : f.type === 'jelly' ? f.y + 4 : f.y;
              if (Math.hypot(fxp - h.x, fyp - h.y) < size) {
                f.hp -= cfg.harpoon.dmg; f.flashT = 0.2;
                if (f.type === 'eel') f.stun = 0.5;
                if (f.type === 'grouper') { f.flee = 1.5; f.vx = Math.sign(f.x - st.x) * 12 || 12; }
                A.sfx(f.hp <= 0 ? 'combo' : 'stamp');
                fx.burst(h.x, h.y, 5, { color: '#ffffff', life: 0.3, speed: 30 });
                if (f.hp <= 0) catchFish(f);
                h.state = 'back';
                break;
              }
            }
            if (h.dist > 105 || collides(h.x, h.y, 1, 1)) h.state = 'back';
          } else {
            const dx = st.x + 6 - h.x, dy = st.y + 3 - h.y, d = Math.hypot(dx, dy);
            if (d < 8) st.harpoon = null;
            else { h.x += dx / d * 380 * dt; h.y += dy / d * 380 * dt; }
          }
        }
        // 撿拾與撬櫃
        st.lockerNear = null;
        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          const d = Math.hypot(it.x - (st.x + 6), it.y - (st.y + 3));
          if (it.type === 'locker') {
            if (it.open) continue;
            if (d < 14) {
              st.lockerNear = it;
              if (Math.hypot(st.vx, st.vy) < 45) it.prog += dt / 1.2; else it.prog = Math.max(0, it.prog - dt);
              if (it.prog >= 1) {
                it.open = true; st.money += it.l.money; A.sfx('pickup');
                if (it.l.card) {
                  if (addToBag({ kind: 'card', id: it.l.card }, 1)) relicPopup(it.l.card);
                  else popup('背包滿了，帶不走櫃裡的東西', '#ff8a9a');
                }
                popup('撬開儲物櫃　+$' + it.l.money, '#8be28f');
                fx.burst(it.x, it.y, 12, { color: '#ffd36b', life: 0.6, speed: 30 });
              }
            } else it.prog = Math.max(0, it.prog - dt * 0.5);
            continue;
          }
          if (d < 10) {
            if (it.type === 'scrap') {
              if (!addToBag({ kind: 'scrap' }, 1)) { if (!it.warned) { popup('背包滿了', '#ff8a9a'); it.warned = true; } continue; }
              items.splice(i, 1); st.money += it.v; A.sfx('coin');
              popup('廢料　+$' + it.v, '#8be28f');
            } else if (it.type === 'relic') {
              if (!addToBag({ kind: 'card', id: it.id }, 1)) { if (!it.warned) { popup('背包滿了', '#ff8a9a'); it.warned = true; } continue; }
              items.splice(i, 1); A.sfx('pickup'); relicPopup(it.id);
              fx.burst(it.x, it.y, 10, { color: '#ffc247', life: 0.8, speed: 30 });
            } else if (it.type === 'legacy') {
              if (!addToBag({ kind: 'legacy', card: it.card }, 1)) { if (!it.warned) { popup('背包滿了', '#ff8a9a'); it.warned = true; } continue; }
              items.splice(i, 1); A.sfx('boom');
              popup('你打撈到前世的作品', '#c9a6ff', it.card.name);
              fx.burst(it.x, it.y, 18, { color: '#c9a6ff', life: 1, speed: 40 });
            }
          }
        }
        endTick(dt);
      },
      draw(c) {
        const cx = Math.round(st.cam.x), cy = Math.round(st.cam.y);
        // 水色
        const g = c.createLinearGradient(0, 0, 0, 180);
        g.addColorStop(0, waterAt(cy)); g.addColorStop(1, waterAt(cy + 180));
        c.fillStyle = g; c.fillRect(0, 0, 320, 180);
        // 水面以上
        if (cy < SURF) {
          c.fillStyle = '#0b1622'; c.fillRect(0, 0, 320, SURF - cy);
          c.fillStyle = '#6b4a2e'; c.fillRect(20 - cx, SURF - cy - 6, 36, 6);
          c.fillStyle = '#8e9bb0'; c.fillRect(32 - cx, SURF - cy - 18, 2, 12);
          c.fillStyle = '#ffd36b'; c.fillRect(33 - cx, SURF - cy - 18, 6, 4);
          c.fillStyle = '#37c3d6';
          for (let x = 0; x < 320; x += 2) c.fillRect(x, SURF - cy + Math.round(Math.sin((x + cx) * 0.1 + st.t * 2)), 2, 1);
        }
        // 淺水光線
        if (cy < 200) {
          c.fillStyle = 'rgba(160,240,255,0.06)';
          for (let i = 0; i < 6; i++) {
            const x = ((i * 90 - cx * 0.3 + st.t * 4) % 380) - 30;
            c.beginPath(); c.moveTo(x, SURF - cy); c.lineTo(x + 20, SURF - cy); c.lineTo(x + 60, 200 - cy); c.lineTo(x + 30, 200 - cy); c.fill();
          }
        }
        // 舊街：倒塌的樓宇
        deco.bldg.forEach((b) => {
          const x = b.x - cx * 0.9, y = 196 - b.h - cy;
          if (x < -60 || x > 330 || y > 180) return;
          c.fillStyle = '#0a3a4a'; c.fillRect(x, y, b.w, b.h);
          c.fillStyle = '#0f4a5c';
          for (let yy = 6; yy < b.h - 4; yy += 10) for (let xx = 4; xx < b.w - 4; xx += 8) c.fillRect(x + xx, y + yy, 4, 5);
        });
        // 沉沒巴士
        if (196 - cy > -10 && 160 - cy < 180) {
          c.fillStyle = '#7a2e16'; c.fillRect(300 - cx, 178 - cy, 60, 18);
          c.fillStyle = '#2a3350'; for (let i = 0; i < 6; i++) c.fillRect(304 - cx + i * 9, 182 - cy, 6, 5);
        }
        // 地鐵站：磚牆與柱
        if (cy + 180 > 200 && cy < 380) {
          c.fillStyle = 'rgba(80,110,130,0.18)';
          for (let y = 206; y < 376; y += 8) for (let x = (y % 16 ? 0 : 8); x < WW; x += 16) { const sx = x - cx, sy = y - cy; if (sx > -16 && sx < 320 && sy > -8 && sy < 180) c.fillRect(sx, sy, 14, 6); }
          deco.pillars.forEach((x) => { c.fillStyle = '#0a2a36'; c.fillRect(x - cx, 206 - cy, 8, 170); });
          c.fillStyle = '#ffd36b'; c.fillRect(0, 372 - cy, 320, 1);
        }
        // 舊商場：店舖
        if (cy + 180 > 380) {
          deco.shops.forEach((sh) => {
            const x = sh.x - cx, y = 470 - cy;
            c.fillStyle = '#071a24'; c.fillRect(x, y, 64, 80);
            c.fillStyle = Math.sin(st.t * 3 + sh.x) > 0.6 ? '#ff4fb4' : '#3a1530'; c.fillRect(x + 6, y + 6, 52, 8);
            c.fillStyle = '#0d2a36'; c.fillRect(x + 8, y + 22, 48, 50);
          });
          // 扶手電梯
          c.fillStyle = '#1b3a46';
          for (let i = 0; i < 12; i++) c.fillRect(60 - cx + i * 4, 386 - cy + i * 7, 6, 3);
        }
        // 樓板
        c.fillStyle = '#1b2f3a';
        SLABS.forEach((r) => c.fillRect(r.x - cx, r.y - cy, r.w, r.h));
        c.fillStyle = '#2d4a58';
        SLABS.forEach((r) => c.fillRect(r.x - cx, r.y - cy, r.w, 1));
        // 海草與電線
        deco.kelp.forEach((k) => {
          const x = k.x - cx, y = k.base - cy;
          if (x < -10 || x > 330 || y < 0 || y - k.h > 180) return;
          c.fillStyle = '#1f6b4a';
          for (let i = 0; i < k.h; i += 2) c.fillRect(Math.round(x + Math.sin(st.t * 1.5 + i * 0.2 + k.x) * (i / 8)), y - i, 2, 2);
        });
        // 物件
        items.forEach((it) => {
          const x = Math.round(it.x - cx), y = Math.round(it.y - cy);
          if (x < -12 || x > 332 || y < -16 || y > 196) return;
          if (it.type === 'scrap') { c.fillStyle = '#8e9bb0'; c.fillRect(x - 3, y - 2, 6, 4); c.fillStyle = '#5a6478'; c.fillRect(x - 1, y - 1, 2, 2); }
          else if (it.type === 'locker') {
            P.sprite(c, it.open ? 'lockerOpen' : 'locker', x - 5, y - 7);
            if (!it.open && it.prog > 0) {
              c.strokeStyle = '#ffd36b'; c.lineWidth = 2;
              c.beginPath(); c.arc(x, y - 12, 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * it.prog); c.stroke();
            }
          } else {
            const col = it.type === 'legacy' ? '#c9a6ff' : '#ffc247';
            const pulse = 3 + Math.sin(st.t * 4 + it.x) * 1.5;
            c.fillStyle = P.rgba(col, 0.25); c.beginPath(); c.arc(x, y, pulse + 3, 0, Math.PI * 2); c.fill();
            c.fillStyle = col; c.fillRect(x - 2, y - 2, 4, 4);
            c.fillStyle = '#ffffff'; c.fillRect(x - 1, y - 1, 1, 1);
          }
        });
        // 魚
        fish.forEach((f) => {
          if (f.hp <= 0) return;
          const x = Math.round(f.x - cx), y = Math.round(f.y - cy);
          if (x < -20 || x > 340 || y < -20 || y > 200) return;
          const white = f.flashT > 0;
          if (f.type === 'sardine') P.sprite(c, 'sardine', x - 3, y - 1, { flip: f.vx > 0, tint: white ? '#ffffff' : undefined });
          else if (f.type === 'grouper') P.sprite(c, 'grouper', x, y, { flip: f.vx > 0, tint: white ? '#ffffff' : undefined });
          else if (f.type === 'jelly') P.sprite(c, 'jelly', x, y, { alpha: 0.85, tint: white ? '#ffffff' : undefined });
          else if (f.type === 'eel') {
            const dir = f.dir || 1;
            for (let i = 0; i < 8; i++) {
              const sx = x - dir * i * 2, sy = y + Math.round(Math.sin(st.t * 10 - i * 0.8) * 1.5);
              c.fillStyle = white ? '#ffffff' : i === 0 ? '#ff8fd1' : i % 2 ? '#ff4fb4' : '#a77bff';
              c.fillRect(sx, sy, 2, 3);
            }
            c.fillStyle = '#ffffff'; c.fillRect(x + (dir > 0 ? 1 : 0), y, 1, 1);
            if (f.state === 'charge') { c.fillStyle = 'rgba(255,79,180,0.35)'; c.fillRect(x - 3, y - 2, 6, 7); }
          }
        });
        debris.forEach((d) => {
          const x = Math.round(d.x - cx), y = Math.round(d.y - cy);
          if (x < -30 || x > 330 || y < -10 || y > 190) return;
          c.fillStyle = '#5a4a3a'; c.fillRect(x, y, d.w, 4); c.fillStyle = '#a0522d'; c.fillRect(x + 2, y, 2, 1);
        });
        // 魚叉
        const h = st.harpoon;
        if (h) {
          c.strokeStyle = '#cfd8ee'; c.lineWidth = 1;
          c.beginPath(); c.moveTo(st.x + 6 - cx, st.y + 3 - cy); c.lineTo(h.x - cx, h.y - cy); c.stroke();
          c.fillStyle = '#ffffff'; c.fillRect(Math.round(h.x - cx) - 1, Math.round(h.y - cy) - 1, 3, 3);
        }
        // 潛水員
        if (st.phase !== 'end' || !st.drowned) {
          if (st.inv <= 0 || Math.floor(st.t * 12) % 2 === 0) P.sprite(c, 'diver', Math.round(st.x - cx), Math.round(st.y - cy), { flip: st.face < 0 });
        }
        fx.draw(c);
        // 黑暗
        const darkness = Math.max(0, Math.min(0.9, (st.y - 150) / 330));
        if (darkness > 0.02) {
          dctx.globalCompositeOperation = 'source-over';
          dctx.clearRect(0, 0, 320, 180);
          dctx.fillStyle = 'rgba(1,4,9,' + darkness + ')';
          dctx.fillRect(0, 0, 320, 180);
          dctx.globalCompositeOperation = 'destination-out';
          hole(st.x + 6 - cx + st.face * 10, st.y + 3 - cy, 58);

// 創作：選擇素材 → 即時看到組合與分數 → 爆分演出。
(function (IE) {
  'use strict';
  const D = () => IE.DATA;
  const R = () => IE.Rules;
  const UI = () => IE.UI;
  const A = () => IE.Audio;

  function known(s, id) {
    const meta = IE.Game.meta || {};
    return !!(s.discovered[id] || (meta.recipes && meta.recipes[id]));
  }
  function comboHtml(s, c) {
    const m = '<span class="m">+' + c.mult + '</span>';
    if (c.kind === 'res' || c.kind === 'medley') return '<span class="combo res">' + c.name + m + '</span>';
    if (!known(s, c.id)) return '<span class="combo hidden">？？？ 新組合' + m + '</span>';
    return '<span class="combo' + (c.secondary ? ' secondary' : '') + '">' + c.name + m + '</span>';
  }

  function open(s, onDone) {
    let sel = [];
    const render = () => {
      const ev = sel.length ? R().evalCraft(s, sel) : null;
      const cost = R().craftCost(Math.max(2, sel.length));
      const k = R().kpi(s);
      const can = sel.length >= 2 && s.cr >= R().craftCost(sel.length);
      const slots = [];
      for (let i = 0; i < 5; i++) {
        const uid = sel[i];
        const c = uid != null ? s.cards.find((x) => x.uid === uid) : null;
        if (i >= s.craftSlots) slots.push('<div class="slot locked">要創作工具</div>');
        else slots.push('<div class="slot">' + (c ? UI().cardHtml(c, { button: true, sel: true }) : '空') + '</div>');
      }
      const formula = ev
        ? '<div class="formula">'
          + '<span class="term t-chips"><small>籌碼</small>' + ev.chips + '</span><span class="op">×</span>'
          + '<span class="term t-mult"><small>倍率</small>' + ev.mult + '</span><span class="op">×</span>'
          + '<span class="term t-spark"><small>火花</small>' + ev.spark.toFixed(1) + '</span>'
          + (ev.kpiMod !== 1 ? '<span class="op">×</span><span class="term t-kpi"><small>KPI</small>' + ev.kpiMod + '</span>' : '')
          + '<span class="op">=</span><span class="term t-total"><small>作品分</small>' + UI().fmt(ev.total) + '</span></div>'
          + '<div class="combos">' + (ev.combos.length ? ev.combos.map((c) => comboHtml(s, c)).join('') : '<span class="mute" style="font-size:13px">沒有組合。試試選擇同一標籤，或者搭配不同標籤。</span>') + '</div>'
        : '<p class="mute" style="font-size:14px">選擇 2 至 ' + s.craftSlots + ' 張素材。同一標籤出現 3 張或以上會「同調」，特定標籤組合會觸發具名組合。</p>';
      UI().modal('<div class="modal wide craft">'
        + '<div class="panel-head"><h2>創作</h2><p>火花 ×' + s.spark.toFixed(1) + '・本季 KPI：' + UI().esc(k.name) + '（' + UI().esc(k.desc) + '）</p></div>'
        + '<div class="craft-tray">' + slots.join('') + '</div>'
        + formula
        + '<h3>你的素材（材料費 $' + cost + '，你有 $' + UI().fmt(s.cr) + '）</h3>'
        + '<div class="craft-grid">' + s.cards.map((c) => UI().cardHtml(c, {
          button: true, sel: sel.includes(c.uid),
          disabled: !sel.includes(c.uid) && sel.length >= s.craftSlots,
        })).join('') + '</div>'
        + '<div class="btn-row"><button class="btn" type="button" data-do="cancel">暫時不做</button>'
        + '<button class="btn primary big" type="button" data-do="make"' + (can ? '' : ' disabled') + '>創作' + (sel.length >= 2 ? '（$' + R().craftCost(sel.length) + '）' : '') + '</button></div>'
        + '</div>', {
        card(el) {
          const uid = Number(el.dataset.uid);
          if (sel.includes(uid)) sel = sel.filter((u) => u !== uid);
          else if (sel.length < s.craftSlots) sel.push(uid);
          render();
        },
        cancel() { UI().closeModal(); onDone(null); },
        make() { reveal(s, sel, onDone); },
      });
    };
    render();
  }

  // 爆分演出
  function reveal(s, sel, onDone) {
    const before = R().signal(s);
    const res = R().commitCraft(s, sel);
    const ev = res.ev;
    const fast = IE.Pixel.reducedMotion;
    const step = fast ? 60 : 1;
    UI().modal('<div class="modal"><div class="reveal">'
      + '<span class="mute">你' + UI().esc(res.work.medium) + '作品</span>'
      + '<div class="formula" id="rv-formula">'
      + '<span class="term t-chips"><small>籌碼</small><span id="rv-chips">0</span></span><span class="op">×</span>'
      + '<span class="term t-mult"><small>倍率</small><span id="rv-mult">1</span></span><span class="op">×</span>'
      + '<span class="term t-spark"><small>火花</small><span id="rv-spark">?</span></span>'
      + '<span class="op" id="rv-kop" hidden>×</span><span class="term t-kpi" id="rv-kpi" hidden><small>KPI</small>' + ev.kpiMod + '</span></div>'
      + '<div class="combos" id="rv-combos"></div>'
      + '<div class="score" id="rv-score">0</div>'
      + '<div class="work" id="rv-work" hidden>《' + UI().esc(res.work.name) + '》</div>'
      + '<div id="rv-extra" hidden></div>'
      + '</div><div class="btn-row"><button class="btn" type="button" data-do="skip" id="rv-skip">跳過</button>'
      + '<button class="btn primary" type="button" data-do="done" id="rv-done" hidden>完成</button></div></div>', {
      skip() { finishNow(); },
      done() { UI().closeModal(); onDone(res); },
    });
    const $ = (id) => document.getElementById(id);
    const timers = [];
    const at = (ms, fn) => timers.push(setTimeout(fn, ms / step));
    let t = 0;
    const tickChips = (target, dur) => {
      const n = 10;
      for (let i = 1; i <= n; i++) at(t + (dur * i) / n, () => { $('rv-chips').textContent = Math.round((target * i) / n); A().sfx('chips'); });
      t += dur;
    };
    // 1. 素材籌碼
    tickChips(ev.cardChips, 600);
    // 2. 組合
    let mult = 1, chips = ev.cardChips;
    ev.combos.forEach((c) => {
      at(t, () => {
        chips += c.chips; mult = Math.round((mult + c.mult) * 10) / 10;
        $('rv-chips').textContent = chips;
        $('rv-mult').textContent = mult;
        const span = document.createElement('span');
        span.className = 'combo' + (c.kind !== 'recipe' ? ' res' : c.secondary ? ' secondary' : '');
        span.innerHTML = c.name + '<span class="m">+' + c.mult + '</span>' + (c.kind === 'recipe' && c.isNew ? ' <b class="new">新！</b>' : '');
        $('rv-combos').appendChild(span);
        A().sfx('mult');
      });
      t += 380;
    });
    // 3. 火花
    at(t, () => { $('rv-spark').textContent = ev.spark.toFixed(1); A().sfx('stamp'); IE.Pixel.view.shake = 3; });
    t += 420;
    // 4. KPI
    if (ev.kpiMod !== 1) {
      at(t, () => { $('rv-kop').hidden = false; $('rv-kpi').hidden = false; A().sfx(ev.kpiMod >= 1 ? 'combo' : 'wrong'); });
      t += 420;
    }
    // 5. 總分
    const total = ev.total;
    for (let i = 1; i <= 12; i++) at(t + i * 45, () => { $('rv-score').textContent = UI().fmt((total * i) / 12); });
    t += 12 * 45;
    at(t, () => finishNow());

    let finished = false;
    function finishNow() {
      if (finished) return;
      finished = true;
      timers.forEach(clearTimeout);
      $('rv-chips').textContent = ev.chips;
      $('rv-mult').textContent = ev.mult;
      $('rv-spark').textContent = ev.spark.toFixed(1);
      if (ev.kpiMod !== 1) { $('rv-kop').hidden = false; $('rv-kpi').hidden = false; }
      if (!$('rv-combos').children.length) $('rv-combos').innerHTML = ev.combos.map((c) => '<span class="combo' + (c.kind !== 'recipe' ? ' res' : '') + '">' + c.name + '<span class="m">+' + c.mult + '</span></span>').join('');
      const sc = $('rv-score');
      sc.textContent = UI().fmt(total);
      sc.classList.add('boom');
      $('rv-work').hidden = false;
      const after = R().signal(s);
      const extra = [];
      if (res.fresh.length) extra.push('<p class="new">靈光一閃！發現新組合：' + res.fresh.map((c) => c.name).join('、') + (res.sparkUp ? '（火花 +' + res.sparkUp + '）' : '') + '</p>');
      if (ev.kpiMod === 0) extra.push('<p style="color:#ff9aa6">外星人不計算這件作品：' + UI().esc(ev.kpi.desc) + '</p>');
      extra.push('<p class="mute">訊號 ' + UI().fmt(before) + ' → <b style="color:#ffd6ef">' + UI().fmt(after) + '</b> / ' + UI().fmt(R().threshold(s)) + '</p>');
      $('rv-extra').innerHTML = extra.join('');
      $('rv-extra').hidden = false;
      $('rv-skip').hidden = true;
      $('rv-done').hidden = false;
      $('rv-done').focus({ preventScroll: true });
      A().sfx('boom');
      IE.Game.celebrate(total);
    }
  }

  IE.Craft = { open };
})(window.IE = window.IE || {});

// 遊戲流程：早上看手機 → 三個時段 → 晚上結算 → 探射燈 → 篩選日 → 結局。
(function (IE) {

  const store = {
    get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 存不了也照樣可以玩 */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* 忽略 */ } },

    celebrate(total) {
      const s = Game.state;
      if (!s || Game.scene !== S.City) return;
      const p = S.City.playerPos(s);
      const n = Math.min(80, 12 + Math.round(total / 300));
      const cols = ['#ffc247', '#ff4fb4', '#37c3d6', '#9be36b', '#ffffff'];
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, sp = 20 + Math.random() * 60;
        S.City.fx.add({ x: p.x + 4, y: p.y + 4, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20, g: 30, drag: 0.98, life: 1.4 + Math.random(), color: cols[i % cols.length], size: Math.random() < 0.3 ? 2 : 1 });
      }

      setCityFilter();
    },

  const save = () => { if (Game.state && !Game.state.ended) store.set(KEY_RUN, Game.state); };

  function setCityFilter() {
