      + '<div class="d-head"><span>星際人才發展局・人類樣本檔案</span><span class="num">' + esc(dos.sampleId) + '</span></div>'
      + '<div class="d-meta"><span>來源：浮城（地球）</span><span>觀察期：' + dos.days + ' 天</span><span>狀態：' + esc(dos.status) + '</span></div>'

  function dossierText(e, s, dos) {

  function helpModal() {

// 創作：選擇素材 → 即時看到組合與分數 → 爆分演出。
(function (IE) {
  'use strict';
  const D = () => IE.DATA;
  const R = () => IE.Rules;
  const UI = () => IE.UI;
  const A = () => IE.Audio;

  function known(s, id) {
    const meta = IE.Game.meta || {};
    return !!(s.discovered[id] || (meta.recipes && meta.recipes[id]));
  }
  function comboHtml(s, c) {
    const m = '<span class="m">+' + c.mult + '</span>';
    if (c.kind === 'res' || c.kind === 'medley') return '<span class="combo res">' + c.name + m + '</span>';
    if (!known(s, c.id)) return '<span class="combo hidden">？？？ 新組合' + m + '</span>';
    return '<span class="combo' + (c.secondary ? ' secondary' : '') + '">' + c.name + m + '</span>';
  }

  function open(s, onDone) {
    let sel = [];
    const render = () => {
      const ev = sel.length ? R().evalCraft(s, sel) : null;
      const cost = R().craftCost(Math.max(2, sel.length));
      const k = R().kpi(s);
      const can = sel.length >= 2 && s.cr >= R().craftCost(sel.length);
      const slots = [];
      for (let i = 0; i < 5; i++) {
        const uid = sel[i];
        const c = uid != null ? s.cards.find((x) => x.uid === uid) : null;
        if (i >= s.craftSlots) slots.push('<div class="slot locked">要創作工具</div>');
        else slots.push('<div class="slot">' + (c ? UI().cardHtml(c, { button: true, sel: true }) : '空') + '</div>');
      }
      const formula = ev
        ? '<div class="formula">'
          + '<span class="term t-chips"><small>籌碼</small>' + ev.chips + '</span><span class="op">×</span>'
          + '<span class="term t-mult"><small>倍率</small>' + ev.mult + '</span><span class="op">×</span>'
          + '<span class="term t-spark"><small>火花</small>' + ev.spark.toFixed(1) + '</span>'
          + (ev.kpiMod !== 1 ? '<span class="op">×</span><span class="term t-kpi"><small>KPI</small>' + ev.kpiMod + '</span>' : '')
          + '<span class="op">=</span><span class="term t-total"><small>作品分</small>' + UI().fmt(ev.total) + '</span></div>'
          + '<div class="combos">' + (ev.combos.length ? ev.combos.map((c) => comboHtml(s, c)).join('') : '<span class="mute" style="font-size:13px">沒有組合。試試選擇同一標籤，或者搭配不同標籤。</span>') + '</div>'
          + (ev.relief ? '<p class="relief">把愧疚寫進作品：靈魂 −' + ev.relief + ' 克（' + s.soul.toFixed(1) + ' → ' + Math.max(0, s.soul - ev.relief).toFixed(1) + ' 克）</p>' : '')
        : '<p class="mute" style="font-size:14px">選擇 2 至 ' + s.craftSlots + ' 張素材。同一標籤出現 3 張或以上會「同調」，特定標籤組合會觸發具名組合。</p>';
      UI().modal('<div class="modal wide craft">'
        + '<div class="panel-head"><h2>創作</h2><p>火花 ×' + s.spark.toFixed(1) + '・本季 KPI：' + UI().esc(k.name) + '（' + UI().esc(k.desc) + '）</p></div>'
        + '<div class="craft-tray">' + slots.join('') + '</div>'
        + formula
        + '<h3>你的素材（材料費 $' + cost + '，你有 $' + UI().fmt(s.cr) + '）</h3>'
        + '<div class="craft-grid">' + s.cards.map((c) => UI().cardHtml(c, {
          button: true, sel: sel.includes(c.uid),
          disabled: !sel.includes(c.uid) && sel.length >= s.craftSlots,
        })).join('') + '</div>'
        + '<div class="btn-row"><button class="btn" type="button" data-do="cancel">暫時不做</button>'
        + '<button class="btn primary big" type="button" data-do="make"' + (can ? '' : ' disabled') + '>創作' + (sel.length >= 2 ? '（$' + R().craftCost(sel.length) + '）' : '') + '</button></div>'
        + '</div>', {
        card(el) {
          const uid = Number(el.dataset.uid);
          if (sel.includes(uid)) sel = sel.filter((u) => u !== uid);
          else if (sel.length < s.craftSlots) sel.push(uid);
          render();
        },
        cancel() { UI().closeModal(); onDone(null); },
        make() { reveal(s, sel, onDone); },
      });
    };
    render();
  }

  // 爆分演出
  function reveal(s, sel, onDone) {
    const before = R().signal(s);
    const res = R().commitCraft(s, sel);
    const ev = res.ev;
    const fast = IE.Pixel.reducedMotion;
    const step = fast ? 60 : 1;
    UI().modal('<div class="modal"><div class="reveal">'
      + '<span class="mute">你' + UI().esc(res.work.medium) + '作品</span>'
      + '<div class="formula" id="rv-formula">'
      + '<span class="term t-chips"><small>籌碼</small><span id="rv-chips">0</span></span><span class="op">×</span>'
      + '<span class="term t-mult"><small>倍率</small><span id="rv-mult">1</span></span><span class="op">×</span>'
      + '<span class="term t-spark"><small>火花</small><span id="rv-spark">?</span></span>'
      + '<span class="op" id="rv-kop" hidden>×</span><span class="term t-kpi" id="rv-kpi" hidden><small>KPI</small>' + ev.kpiMod + '</span></div>'
      + '<div class="combos" id="rv-combos"></div>'
      + '<div class="score" id="rv-score">0</div>'
      + '<div class="work" id="rv-work" hidden>《' + UI().esc(res.work.name) + '》</div>'
      + '<div id="rv-extra" hidden></div>'
      + '</div><div class="btn-row"><button class="btn" type="button" data-do="skip" id="rv-skip">跳過</button>'
      + '<button class="btn primary" type="button" data-do="done" id="rv-done" hidden>完成</button></div></div>', {
      skip() { finishNow(); },
      done() { UI().closeModal(); onDone(res); },
    });
    const $ = (id) => document.getElementById(id);
    const timers = [];
    const at = (ms, fn) => timers.push(setTimeout(fn, ms / step));
    let t = 0;
    const tickChips = (target, dur) => {
      const n = 10;
      for (let i = 1; i <= n; i++) at(t + (dur * i) / n, () => { $('rv-chips').textContent = Math.round((target * i) / n); A().sfx('chips'); });
      t += dur;
    };
    // 1. 素材籌碼
    tickChips(ev.cardChips, 600);
    // 2. 組合
    let mult = 1, chips = ev.cardChips;
    ev.combos.forEach((c) => {
      at(t, () => {
        chips += c.chips; mult = Math.round((mult + c.mult) * 10) / 10;
        $('rv-chips').textContent = chips;
        $('rv-mult').textContent = mult;
        const span = document.createElement('span');
        span.className = 'combo' + (c.kind !== 'recipe' ? ' res' : c.secondary ? ' secondary' : '');
        span.innerHTML = c.name + '<span class="m">+' + c.mult + '</span>' + (c.kind === 'recipe' && c.isNew ? ' <b class="new">新！</b>' : '');
        $('rv-combos').appendChild(span);
        A().sfx('mult');
      });
      t += 380;
    });
    // 3. 火花
    at(t, () => { $('rv-spark').textContent = ev.spark.toFixed(1); A().sfx('stamp'); IE.Pixel.view.shake = 3; });
    t += 420;
    // 4. KPI
    if (ev.kpiMod !== 1) {
      at(t, () => { $('rv-kop').hidden = false; $('rv-kpi').hidden = false; A().sfx(ev.kpiMod >= 1 ? 'combo' : 'wrong'); });
      t += 420;
    }
    // 5. 總分
    const total = ev.total;
    for (let i = 1; i <= 12; i++) at(t + i * 45, () => { $('rv-score').textContent = UI().fmt((total * i) / 12); });
    t += 12 * 45;
    at(t, () => finishNow());

    let finished = false;
    function finishNow() {
      if (finished) return;
      finished = true;
      timers.forEach(clearTimeout);
      $('rv-chips').textContent = ev.chips;
      $('rv-mult').textContent = ev.mult;
      $('rv-spark').textContent = ev.spark.toFixed(1);
      if (ev.kpiMod !== 1) { $('rv-kop').hidden = false; $('rv-kpi').hidden = false; }
      if (!$('rv-combos').children.length) $('rv-combos').innerHTML = ev.combos.map((c) => '<span class="combo' + (c.kind !== 'recipe' ? ' res' : '') + '">' + c.name + '<span class="m">+' + c.mult + '</span></span>').join('');
      const sc = $('rv-score');
      sc.textContent = UI().fmt(total);
      sc.classList.add('boom');
      $('rv-work').hidden = false;
      const after = R().signal(s);
      const extra = [];
      if (res.relief) extra.push('<p class="relief">你把愧疚寫了出來。靈魂輕了 ' + res.relief + ' 克，現在重 ' + s.soul.toFixed(1) + ' 克。</p>');
      if (res.fresh.length) extra.push('<p class="new">靈光一閃！發現新組合：' + res.fresh.map((c) => c.name).join('、') + (res.sparkUp ? '（火花 +' + res.sparkUp + '）' : '') + '</p>');
      if (ev.kpiMod === 0) extra.push('<p style="color:#ff9aa6">外星人不計算這件作品：' + UI().esc(ev.kpi.desc) + '</p>');
      extra.push('<p class="mute">訊號 ' + UI().fmt(before) + ' → <b style="color:#ffd6ef">' + UI().fmt(after) + '</b> / ' + UI().fmt(R().threshold(s)) + '</p>');
      $('rv-extra').innerHTML = extra.join('');
      $('rv-extra').hidden = false;
      $('rv-skip').hidden = true;
      $('rv-done').hidden = false;
      $('rv-done').focus({ preventScroll: true });
      A().sfx('boom');
      IE.Game.celebrate(total);
    }
  }

  IE.Craft = { open };
})(window.IE = window.IE || {});

        close() { UI.closeModal(); if (morning) morningDilemma(); else showHub(); },
      }, morning ? null : { dismiss: () => showHub() });
    };
    render();
  }
  // 早上的道德抉擇：做了選擇才開始一天
  function morningDilemma() {
    const s = Game.state;
    if (!R.drawDilemma(s)) { showHub(); return; }
    save();
    UI.setPanel('<p class="mute">出門前，發生了一件事。</p>');
    UI.modal(UI.dilemmaModal(R.dilemmaView(s), s), {
      pick(el) {
        const rep = R.resolveDilemma(s, Number(el.dataset.i));
        A.sfx(rep.deltas.soul > 0 ? 'wrong' : 'pickup');
        UI.renderHud(s); A.setSpark(s.spark); save();
        UI.modal(UI.reportModal(rep, '開始今天'), { ok() { UI.closeModal(); showHub(); } });
      },
    });
  }
  function showHub() {
    const s = Game.state;
    if (!s || s.ended) return;
    setScene(S.City);
    UI.renderHud(s);
    A.setMode('city');
    A.setSpark(s.spark);
    UI.setPanel(UI.actionsPanel(s, R.actions(s)), {
      act(el) { doAction(el.dataset.id); },
    });
    save();
  }

  function doAction(id) {
    const s = Game.state;
    switch (id) {
      case 'label': case 'ot': case 'smile': case 'dive': case 'delivery': case 'farm': case 'busk': case 'clinic':
        return startMicro(id);
      case 'rest':
        return afterAction(R.applyRest(s));
      case 'volunteer':
        return afterAction(R.applyVolunteer(s));
      case 'chat':
        return UI.setPanel(UI.chatPanel(s), {
          npc(el) { afterAction(R.applyChat(s, el.dataset.id)); },
          back() { showHub(); },
        });
      case 'create':
        return IE.Craft.open(s, (res) => {
          if (!res) { showHub(); return; }
          UI.renderHud(s);
          afterSlot();
        });
    }
  }

  // ---------- 小遊戲 ----------
  function startMicro(kind, onResult) {
    const token = {};
    Game.microToken = token;
    const done = (result) => {
      if (Game.microToken !== token) return;
      Game.microToken = null; Game.micro = null;
      if (onResult) { onResult(result); return; }
      Game.applyMicroResult(kind, result);
    };
    const m = IE.Micro.create(kind, {}, done);
    Game.micro = m;
    setScene(m);
    UI.setPanel(UI.controlsPanel(m), {});
    // 按鈕支援「按住」：按下時 control(id, true)，放開時 control(id, false)
    document.querySelectorAll('[data-ctrl]').forEach((b) => {
      const id = b.dataset.ctrl;
      let held = false;
      const up = () => { if (held && Game.micro === m) { held = false; m.control(id, false); } };
      b.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        try { b.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
        if (Game.micro === m) { held = true; m.control(id, true); }
      });
      b.addEventListener('pointerup', up);
      b.addEventListener('pointercancel', up);
      b.addEventListener('lostpointercapture', up);
      b.addEventListener('click', (e) => { if (e.detail === 0 && Game.micro === m) { m.control(id, true); m.control(id, false); } });
      b.addEventListener('contextmenu', (e) => e.preventDefault());
    });
    window.scrollTo({ top: Math.max(0, stage().offsetTop - 8), behavior: 'smooth' });
  }
  // 小遊戲與測試共用：把小遊戲結果套用到規則
  Game.applyMicroResult = function (kind, result) {
    const s = Game.state;
    Game.microToken = null; Game.micro = null;
    let rep;
    if (kind === 'label' || kind === 'ot') rep = R.applyLabel(s, result, { ot: kind === 'ot' });
    else if (kind === 'smile') rep = R.applySmile(s, result);
    else if (kind === 'dive') rep = R.applyDive(s, result);
    else if (kind === 'delivery') rep = R.applyDelivery(s, result);
    else if (kind === 'farm') rep = R.applyFarm(s, result);
    else if (kind === 'busk') rep = R.applyBusk(s, result);
    else if (kind === 'clinic') rep = R.applyClinic(s, result);
    else if (kind === 'interview') rep = R.applyInterview(s, result.answers);
    setScene(S.City);
    afterAction(rep);
  };

  function afterAction(rep) {
    const s = Game.state;
    UI.renderHud(s);
    A.setSpark(s.spark);
    UI.setPanel('<p class="mute">' + UI.esc(rep.title) + '</p>');
    UI.modal(UI.reportModal(rep), { ok() { UI.closeModal(); afterSlot(); } });
    save();
  }
  function afterSlot() {
    const s = Game.state;
    if (s.body <= 0) return finishRun(R.endingFor(s, 'death'));
    if (R.isNight(s)) return endOfDay();
    s.slot++;
    showHub();
  }

  // ---------- 晚上 ----------
  function endOfDay() {
    const s = Game.state;
    // 狀態列停留在今晚，結算完才切換到明天
    UI.renderHud(s);
    const rep = R.endDay(s);
    S.City.forceNight = true;
    setScene(S.City);
    UI.setPanel('<p class="mute">晚上。外星人的探射燈又出來掃視城市。</p>');
    save();
    // 訊號達標，探射燈就會停在窗外；但靈魂太重的話，光束拉不動你
    const lock = !!(rep.review && rep.review.signalOk);
    const heavy = !!(rep.review && rep.review.overweight && rep.review.signalOk);
    S.City.searchlight(rep.searchlight || 0, lock, () => {
      UI.modal(UI.settleModal(rep, s), {
        ok() {
          UI.closeModal();
          if (rep.review) {
            A.sfx(rep.review.pass ? 'combo' : 'stamp');
            UI.modal(UI.reviewModal(rep.review), {
              ok() {
                UI.closeModal();
                if (rep.ending && rep.ending.type === 'recruited') chooseToGo();
                else if (rep.ending) finishRun(rep.ending);
                else { setCityFilter(); startDay(); }
              },
            });
          } else if (rep.ending) finishRun(rep.ending);
          else if (rep.interview) dreamInterview();
          else startDay();
        },
      });
    }, heavy);
  }

  // ---------- 夢境面試（篩選日前兩晚） ----------
  function dreamInterview() {
    const s = Game.state;
    R.interviewQuestions(s);
    save();
    UI.setPanel('<p class="mute">你睡著了。</p>');
    UI.modal('<div class="modal dilemma"><span class="eyebrow">深夜・夢境</span><p class="d-text">你夢見有人敲門。門外是一張很長的辦公桌，桌後坐著一個沒有臉的面試官。</p>'
      + '<p class="mute">「請坐。這只是一個非正式的對話。」</p><div class="btn-row"><button class="btn primary" type="button" data-do="ok">坐下</button></div></div>', {
      ok() {
        UI.closeModal();
        startMicro('interview', (res) => {
          const rep = R.applyInterview(s, res.answers);
          setScene(S.City);
          UI.renderHud(s); A.setMode('city'); save();
          UI.modal(UI.reportModal(rep, '醒來'), { ok() { UI.closeModal(); startDay(); } });
        });
      },
    });
  }

  // ---------- 被選中 ----------
  function chooseToGo() {
    const s = Game.state;
    UI.modal(UI.stayModal(s), {
      go() { UI.closeModal(); recruit(); },
      stay() {
        UI.closeModal();
        A.sfx('stamp');
        finishRun(R.endingFor(s, 'guardian'));
      },
    });
  }
  function recruit() {
    const s = Game.state;
    UI.setPanel('<p class="mute">光。很多很多光。</p>');
    S.City.forceNight = true;
    s.saturation = 1.3;
    setCityFilter();
    A.setMode('alien');
    S.City.startBeam(() => {
      S.City.flash = 1;
      S.Office.enter([
        '歡迎加入星際人才發展局。',
        '我們不是一個組織，我們是一個宇宙大家庭。',
        '你的朋友阿星也在這裡。阿星本季的表現符合預期。',
        '你的第一份工作很簡單：',
        '替我們篩選下一批地球候選人。',
      ], () => startMicro('alien', (res) => {
        const pct = Math.round(res.accuracy * 100);
        const stars = Math.max(1, Math.min(5, Math.round(res.accuracy * 5 * 10) / 10)).toFixed(1);
        let e;
        if (res.accuracy < 0.45) {
          e = { kind: 'returned', title: '被遣返',
            text: '你的員工評分只有 ★' + stars + '。星際人才發展局以「文化不契合」為由把你遣返地球。你帶著一身火花回到浮城，水位又上升了。' };
        } else {
          const self = res.selfJudged === false ? '你也沒有錄取「樣本 #2080」，一個很像你的人。指引就是指引。'
            : res.selfJudged === true ? '你錄取了「樣本 #2080」。違反指引，已記錄在案。' : '';
          const light = s.conscience < 0.3 ? '你的靈魂只有 ' + s.soul.toFixed(1) + ' 克，輕得像一張表格。你篩選地球人時，一點也不猶豫。' : '';
          e = { kind: 'agent', title: s.conscience < 0.3 ? '完美員工' : '星際特工',
            text: '你被選中了。第一份工作是篩選地球人，準確度 ' + pct + '%，員工評分 ★' + stars + '。' + self + light + '阿星就坐在隔壁，沒有抬頭看你。' };
        }
        S.City.enter('hub');
        finishRun(e);
      }));
      setScene(S.Office);
      UI.setPanel('<div class="controls"><p class="hint">按畫面或空白鍵繼續。</p></div>');
    });
  }

  function finishRun(ending) {
    const s = Game.state;
    const kind = ending.kind || ending.type;
    ending.kind = kind;
    s.ended = ending;
    const dossier = IE.Dossier.evaluate(s, kind);
    Game.meta = R.recordMeta(Game.meta, s, kind, dossier);
    store.set(KEY_META, Game.meta);
    store.del(KEY_RUN);
    S.City.forceNight = true;
    setScene(S.City);
    A.setMode(kind === 'agent' ? 'alien' : 'city');
    A.setSpark(kind === 'grey' ? 0 : s.spark);
    UI.renderHud(s);
    UI.setPanel('<div class="btn-row"><button class="btn primary" type="button" data-do="again">再玩一局</button><button class="btn" type="button" data-do="title">返回標題</button></div>',
      { again: () => { UI.closeModal(); showSetup(); }, title: () => showTitle() });
    UI.modal(UI.dossierModal(ending, s, dossier, Game.meta), {
      copy() {
        const text = UI.dossierText(ending, s, dossier);
        const ok = () => UI.toast('已複製', 'good');
        try {
          navigator.clipboard.writeText(text).then(ok, () => UI.toast(text));
        } catch (e) { UI.toast(text); }
      },
      again() { UI.closeModal(); showSetup(); },
    }, { dismiss: () => {} });
  }

  // ---------- 輸入 ----------
  function toLow(e) {
    const r = P.view.canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * P.W, y: (e.clientY - r.top) / r.height * P.H };
  }
  function bindInput() {
    const cv = P.view.canvas;
    ['pointerdown', 'pointermove', 'pointerup', 'pointercancel'].forEach((type) => {
      cv.addEventListener(type, (e) => {
        const sc = Game.scene;
        if (!sc || !sc.pointer) return;
        if (type === 'pointerdown') { try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ } e.preventDefault(); }
        const p = toLow(e);
        sc.pointer(type === 'pointerdown' ? 'down' : type === 'pointermove' ? 'move' : 'up', p.x, p.y, e.pointerType);
      });
    });
    const KEYS = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '];
    window.addEventListener('keydown', (e) => {
      const sc = Game.scene;
      if (sc && sc.key && sc !== S.City) {
        if (KEYS.includes(e.key)) e.preventDefault();
        if (!e.repeat) sc.key(e.key, true);
        return;
      }
      if (UI.modalOpen()) return;
      if (/^[0-9]$/.test(e.key)) {
        const btns = document.querySelectorAll('#panel .act');
        const b = btns[(Number(e.key) + 9) % 10];
        if (b && !b.disabled) b.click();
      }
    });
    window.addEventListener('keyup', (e) => {
      const sc = Game.scene;
      if (sc && sc.key && sc !== S.City) sc.key(e.key, false);
    });
    document.getElementById('hud').addEventListener('click', (e) => {
      const b = e.target.closest('[data-hud]');
      if (!b || !Game.state) return;
      A.sfx('click');
      if (b.dataset.hud === 'mute') { A.init(); A.toggleMute(); UI.renderHud(Game.state); }
      else if (b.dataset.hud === 'help') UI.pushModal(UI.helpModal(), { close: UI.closeModal }, { dismiss: () => {} });
      else if (b.dataset.hud === 'stats' && !Game.micro) UI.pushModal(UI.statsModal(Game.state), { close: UI.closeModal }, { dismiss: () => {} });
      else if (b.dataset.hud === 'phone' && !Game.micro && !Game.state.ended && !UI.modalOpen()) openPhone(false);
    });
    window.addEventListener('resize', () => P.resize());
  }

  // ---------- 開機 ----------
  function boot(data) {
    P.setup(document.getElementById('screen'));
    UI.bindDelegation();
    bindInput();
    S.City.forceNight = false;
    requestAnimationFrame(frame);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => P.resize());
    if (data && data.run && !data.run.ended) { Game.state = data.run; S.City.enter('hub'); showHub(); }
    else showTitle();
  }
  const hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(() => ({ run: Game.state && !Game.state.ended && !Game.micro ? Game.state : null })); } catch (e) { /* 不支援就略過 */ }
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});

  window.__IE = IE; // 方便測試
})(window.IE = window.IE || {});
</script>
</body>
</html>
