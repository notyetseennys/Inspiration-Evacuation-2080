<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>靈感撤離 2080</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="在水淹的 2080 年浮城打工捱窮，同時守住靈感，爭取被外星人選中。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&family=Silkscreen&family=VT323&display=swap">
<style>
/* 版面概念：一個俯瞰水淹浮城的像素窗口，下方裝著一部 2080 年廉價手機的介面 */
:root {
  color-scheme: dark;
  --ink: #0a0e17;        /* 夜晚的浮城 */
  --deck: #111827;       /* 手機介面底色 */
  --deck-2: #172036;
  --line: #26334d;
  --fg: #e8edf6;
  --mute: #8d99b4;
  --sea: #37c3d6;        /* 水淹藍綠 */
  --neon: #ff4fb4;       /* 霓虹粉紫 */
  --spark: #ffc247;      /* 火花 */
  --cash: #8be28f;
  --body: #ff6b6b;
  --danger: #ff4d5e;
  --alien: #9be36b;
  --stone: #a89a82;      /* 靈魂的重量：石頭的顏色 */
  --paper: #eef1f7;      /* 外星 HR 的企業表格 */
  --paper-ink: #1b2233;
  --paper-line: #c9d1e2;
  --font-display: "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "VT323", ui-monospace, "SFMono-Regular", monospace;
  --font-pixel: "Silkscreen", "VT323", ui-monospace, monospace;
  --r: 6px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--ink); color: var(--fg); }
body {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
.num small, .lines li .v small { font-family: var(--font-body); font-size: 0.5em; font-weight: 700; margin-left: 2px; }
.num { font-family: var(--font-num); font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.px { font-family: var(--font-pixel); font-size: 0.72em; letter-spacing: 0.08em; text-transform: uppercase; }
.mute { color: var(--mute); }

#app {
  max-width: 980px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 32px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ---------- 畫面 ---------- */
.stage {
  position: relative;
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
  background: #05070c;
  max-width: 100%;
}
.stage canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; transition: filter 1.2s ease; }
.stage.playing { touch-action: none; box-shadow: 0 0 0 2px var(--sea); }
.stage-tag {
  position: absolute; left: 8px; bottom: 8px;
  font-size: 11px; padding: 2px 8px; border-radius: 3px;
  background: rgba(10, 14, 23, 0.72); color: var(--mute); pointer-events: none;
}

/* ---------- HUD ---------- */
.hud { display: grid; gap: 8px; }
.hud-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.hud-day { font-size: 15px; font-weight: 700; display: flex; align-items: baseline; gap: 6px; }
.hud-day .num { font-size: 26px; line-height: 1; color: #fff; }
.hud-btns { margin-left: auto; display: flex; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; line-height: 1; padding: 5px 8px; border-radius: 999px;
  background: var(--deck-2); border: 1px solid var(--line); color: var(--fg); white-space: nowrap;
}
.chip.warn { border-color: var(--danger); color: #ffd0d5; }
.chip.season { border-color: color-mix(in srgb, var(--sea) 60%, var(--line)); }
.chip.world { border-color: #ff8a3c; color: #ffe2c4; background: #2a1a10; }
.icon-btn {
  min-width: 40px; height: 34px; padding: 0 10px; border-radius: var(--r);
  background: var(--deck-2); border: 1px solid var(--line); cursor: pointer; font-size: 13px;
}
.icon-btn:hover { border-color: var(--sea); }
.icon-btn .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--neon); margin-left: 4px; vertical-align: middle; }

.hud-meters { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.meter {
  min-width: 0; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: var(--r); background: var(--deck); border: 1px solid var(--line);
}
.meter .lbl { font-size: 12px; color: var(--mute); white-space: nowrap; }
.meter .num { font-size: 22px; line-height: 1; white-space: nowrap; }
.bar { position: relative; height: 6px; background: #1d2740; border-radius: 3px; overflow: visible; min-width: 30px; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; transition: width 0.5s ease; }
.bar > em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff; border-radius: 1px; }
.m-cash { grid-template-columns: auto 1fr; }
.m-cash .num { color: var(--cash); text-align: right; }
.m-body .bar > i { background: var(--body); }
.m-body .num { color: #ffb3b3; }
.m-spark .bar > i { background: linear-gradient(90deg, #ff8a3c, var(--spark)); }
.m-spark .num { color: var(--spark); }
.m-spark.numb { border-color: #6b7280; }
.m-spark.numb .num { color: #9ca3af; }
.m-signal .bar > i { background: linear-gradient(90deg, var(--sea), var(--neon)); }
.m-soul .bar > i { background: var(--stone); }
.m-soul .bar > em { background: #ffffff; }
.m-soul .num { color: #d9cfbd; font-size: 18px; }
.m-soul.over { border-color: var(--danger); }
.m-soul.over .bar > i { background: var(--danger); }
.m-soul.over .num { color: #ffb3bd; }
.hud-sub .pips { letter-spacing: 1px; color: #e9dcc4; }
.m-signal .num { font-size: 18px; color: #ffd6ef; }
.hud-sub { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--mute); }
.hud-sub b { color: var(--fg); font-weight: 500; }
.hud-sub .bad { color: #ff9aa6; }

/* ---------- 面板 ---------- */
.panel { display: grid; gap: 12px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.panel-head h2 { margin: 0; font-size: 18px; font-weight: 900; text-wrap: balance; }
.panel-head p { margin: 0; font-size: 13px; color: var(--mute); }

.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.act {
  position: relative; text-align: left; cursor: pointer; min-width: 0;
  display: grid; gap: 6px; align-content: start;
  padding: 12px 12px 10px; border-radius: var(--r);
  background: var(--deck); border: 1px solid var(--line);
  transition: border-color 0.15s, transform 0.15s, background 0.15s;
}
.act:hover:not(:disabled) { border-color: var(--sea); background: var(--deck-2); transform: translateY(-1px); }
.act:focus-visible { outline: 2px solid var(--spark); outline-offset: 2px; }
.act:disabled { cursor: not-allowed; opacity: 0.5; }
.act-key { position: absolute; top: 10px; right: 10px; font-family: var(--font-num); font-size: 16px; color: var(--mute); }
.act-name { font-size: 16px; font-weight: 900; padding-right: 18px; }
.act-sub { font-size: 12px; color: var(--mute); line-height: 1.4; }
.act-why { font-size: 12px; color: #ff9aa6; }
.fx { display: flex; flex-wrap: wrap; gap: 4px; }
.fx span { font-size: 11px; line-height: 1; padding: 4px 6px; border-radius: 3px; background: #1a2338; white-space: nowrap; }
.fx .fx-cr { color: var(--cash); }
.fx .fx-body { color: #ffb3b3; }
.fx .fx-spark { color: var(--spark); }
.fx .fx-card { color: #cbd5f0; }
.fx .fx-sig { color: #ffd6ef; }
.fx .fx-soul { color: #e9dcc4; box-shadow: inset 0 0 0 1px rgba(168, 154, 130, 0.45); }
.fx .fx-note { color: #cbd5f0; }
.fx .neg { box-shadow: inset 0 0 0 1px rgba(255, 77, 94, 0.35); }

.inv-wrap { display: grid; gap: 6px; }
.inv-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--mute); }
.inv { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }

/* 素材卡 */
.card {
  flex: 0 0 auto; width: 132px; min-height: 74px; text-align: left;
  display: grid; gap: 6px; align-content: space-between;
  padding: 8px; border-radius: var(--r); background: #1a2236; border: 1px solid var(--line); color: var(--fg);
}
.card .c-name { font-size: 12px; font-weight: 700; line-height: 1.35; }
.card .c-foot { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.card .c-val { font-family: var(--font-num); font-size: 18px; line-height: 1; color: #cbd5f0; }
.card.legacy { border-color: #8f6bd8; background: #221a38; }
.card.guilt { border-color: #6b6152; background: #211d18; }
.card .c-grams { font-size: 11px; color: #c9bba3; }
button.card { cursor: pointer; }
button.card:hover { border-color: var(--sea); }
button.card.sel { border-color: var(--spark); background: #2a2414; box-shadow: 0 0 0 1px var(--spark); }
button.card:disabled { opacity: 0.35; cursor: not-allowed; }
.tags { display: flex; flex-wrap: wrap; gap: 3px; }
.tag {
  font-size: 11px; line-height: 1; padding: 3px 5px; border-radius: 3px; font-weight: 700;
  color: #0b0f1a; background: var(--c, #8e9bb0);
}

/* 按鈕 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 42px; padding: 0 16px; border-radius: var(--r); cursor: pointer;
  background: var(--deck-2); border: 1px solid var(--line); font-weight: 700;
}
.btn:hover:not(:disabled) { border-color: var(--sea); }
.btn:focus-visible { outline: 2px solid var(--spark); outline-offset: 2px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--neon); border-color: var(--neon); color: #1a0613; }
.btn.primary:hover:not(:disabled) { background: #ff77c6; border-color: #ff77c6; }
.btn.sea { background: var(--sea); border-color: var(--sea); color: #04161f; }
.btn.big { min-height: 64px; font-size: 20px; font-weight: 900; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row > .btn { flex: 1 1 140px; }

/* 小遊戲控制 */
.controls { display: grid; gap: 10px; }
.controls .hint { margin: 0; font-size: 13px; color: var(--mute); }
.ctrl-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.ctrl-row .btn { min-height: 76px; font-size: 22px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.ctrl-row .btn small { font-family: var(--font-num); font-size: 16px; color: inherit; opacity: 0.6; font-weight: 400; }
.ctrl-row .btn.no { background: #3a1620; border-color: #6b2433; color: #ffc2cb; }
.ctrl-row .btn.yes { background: #14321c; border-color: #2a6b3a; color: #c9f7cf; }
.ctrl-row .btn { -webkit-touch-callout: none; }
.ctrl-row .btn:active { transform: translateY(1px); filter: brightness(1.2); }
.ctrl-row .btn.laugh { background: #3a2a0a; border-color: #8a6a1f; color: #ffe2a0; }
.ctrl-row .btn.nod { background: #0b2f36; border-color: #1f6b7a; color: #bff3fb; }
.ctrl-row .btn.pour { background: #2a1430; border-color: #6b2a5a; color: #ffd6ef; }
.ctrl-row .btn.fire { background: #0b2f36; border-color: var(--sea); color: #e8fdff; }
.ctrl-row .btn.up { background: #172036; border-color: var(--line); }

/* ---------- 對話框 ---------- */
.modal-wrap {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(4, 6, 12, 0.72);
  backdrop-filter: blur(2px);
}
.modal {
  width: min(560px, 100%); max-height: 100%; overflow: auto;
  background: var(--deck); border: 1px solid var(--line); border-radius: 10px;
  display: grid; gap: 14px; padding: 18px;
  animation: pop 0.18s ease-out;
}
.modal.wide { width: min(760px, 100%); }
.modal h2 { margin: 0; font-size: 22px; font-weight: 900; text-wrap: balance; }
.modal h3 { margin: 0; font-size: 14px; color: var(--mute); font-weight: 700; }
.modal p { margin: 0; }
.modal-wrap.static .modal, .modal-wrap.static .phone { animation: none; }
@keyframes pop { from { transform: translateY(8px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }

.lines { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.lines li { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 6px 0; border-bottom: 1px dashed #24304a; }
.lines li .v { font-family: var(--font-num); font-size: 18px; line-height: 1.1; white-space: nowrap; }
.lines li.bad { color: #ffb3bd; }
.lines li.good { color: #c9f7cf; }
.lines li.event { color: #ffe7a8; }
.lines li.news { color: #9fdcff; }
.lines li.auto { color: var(--mute); font-size: 12px; }
.lines li.sin { color: #e9dcc4; }

.deltas { display: flex; flex-wrap: wrap; gap: 8px; }
.delta { display: grid; gap: 2px; padding: 8px 12px; border-radius: var(--r); background: #0d1424; border: 1px solid var(--line); min-width: 92px; }
.delta .k { font-size: 11px; color: var(--mute); }
.delta .num { font-size: 26px; line-height: 1; }
.delta.cr .num { color: var(--cash); }
.delta.body .num { color: #ffb3b3; }
.delta.spark .num { color: var(--spark); }
.delta.soul .num { color: #e9dcc4; }
.gained { display: flex; flex-wrap: wrap; gap: 6px; }

/* 手機：早上 */
.phone {
  width: min(400px, 100%); max-height: 100%; overflow: auto; margin: 0 auto;
  background: #0d1220; border: 2px solid #2d3a59; border-radius: 22px;
  display: grid; gap: 10px; padding: 12px 14px 16px;
  animation: pop 0.2s ease-out;
}
.phone-bar { display: flex; justify-content: space-between; font-family: var(--font-num); font-size: 16px; color: var(--mute); padding: 0 4px; }
.phone-bar .low { color: var(--danger); }
.phone h2 { margin: 0; font-size: 20px; font-weight: 900; }
.feed { display: grid; gap: 8px; }
.post { padding: 10px 12px; border-radius: 12px; background: #151c2e; font-size: 14px; line-height: 1.5; }
.post .who { display: block; font-size: 11px; color: var(--mute); margin-bottom: 2px; }
.post.ad { background: #2a1430; border: 1px dashed var(--neon); }
.post.alien { background: #14261a; border: 1px solid #3c6b2a; color: #d9f7c7; }
.post.news { background: #10233a; }
.post.warn { background: #3a1620; color: #ffd0d5; }
.post.world { background: #3a2410; border: 1px solid #ff8a3c; color: #ffe2c4; }
.post.fake { background: #1a1024; color: #c9a8e8; font-style: italic; filter: blur(0.3px); }
.msg { justify-self: start; max-width: 88%; padding: 10px 12px; border-radius: 4px 14px 14px 14px; background: #1f6b4f; color: #eafff4; font-size: 14px; }
.msg.memo { background: #e8ecf4; color: #1b2233; border-radius: 4px; font-size: 13px; }
.msg.auto { background: #2a3350; color: #b8c2db; border-radius: 4px; font-size: 13px; }
.msg.glitch { background: #3a0d16; color: #ff8a9a; font-weight: 900; letter-spacing: 0.3em; animation: glitch 0.4s steps(2) infinite; }
@keyframes glitch { 0% { transform: translate(0); } 50% { transform: translate(2px, -1px); } 100% { transform: translate(-1px, 1px); } }
.msg-head { font-size: 11px; color: var(--mute); }
.shop { display: grid; gap: 6px; }
.shop-item { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: #151c2e; }
.shop-item .n { font-weight: 700; font-size: 14px; }
.shop-item .d { font-size: 12px; color: var(--mute); }
.shop-item .btn { min-height: 36px; padding: 0 12px; font-family: var(--font-num); font-size: 18px; font-weight: 400; }

/* 外星 HR 考績表 */
.review {
  background: var(--paper); color: var(--paper-ink); border-radius: 4px; padding: 18px;
  display: grid; gap: 12px; position: relative; overflow: hidden;
}
.review .r-head { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: #5b6b90; border-bottom: 2px solid var(--paper-ink); padding-bottom: 6px; }
.review h2 { margin: 0; font-size: 20px; color: var(--paper-ink); }
.review table { width: 100%; border-collapse: collapse; font-size: 14px; }
.review td { padding: 8px 4px; border-bottom: 1px solid var(--paper-line); vertical-align: middle; }
.review td.g { font-family: var(--font-num); font-size: 34px; line-height: 1; width: 48px; text-align: center; }
.review td.n { color: #5b6b90; font-size: 12px; text-align: right; }
.review .verdict { font-size: 15px; font-weight: 700; }
.stamp {
  position: absolute; right: 14px; bottom: 16px; transform: rotate(-12deg);
  font-size: 26px; font-weight: 900; padding: 4px 12px; border: 4px solid currentColor; border-radius: 6px;
  animation: stamp 0.35s cubic-bezier(.2, 2, .4, 1) both 0.4s;
}
.stamp.pass { color: #2a8a3e; }
.stamp.fail { color: #c62f45; }
@keyframes stamp { from { transform: rotate(-12deg) scale(2.4); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: 0.9; } }

/* ---------- 能力值與人類樣本檔案 ---------- */
.act-group { margin: 4px 0 -4px; font-size: 13px; font-weight: 700; color: var(--mute); }
.stat-deltas { display: flex; flex-wrap: wrap; gap: 6px; }
.stat-deltas .sd { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: #13233a; color: #bfe6ff; }
.stat-deltas .sd.neg { background: #2a1620; color: #ffb3bd; }
.statbars { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 18px; }
.statbars.compact { gap: 3px 14px; }
.sb { display: grid; grid-template-columns: 4.5em 1fr 3.4em; align-items: center; gap: 8px; font-size: 13px; min-width: 0; }
.statbars.compact .sb { font-size: 12px; }
.sb-k { color: var(--mute); white-space: nowrap; }
.sb-track { position: relative; height: 6px; border-radius: 3px; background: #1d2740; overflow: hidden; }
.sb-track > i { position: absolute; inset: 0 auto 0 0; border-radius: 0 4px 4px 0; background: var(--sea); }
.sb-v { font-size: 18px; line-height: 1; text-align: right; white-space: nowrap; }
.sb-v small { font-family: var(--font-body); font-size: 10px; margin-left: 3px; }
.sb-v small.pos { color: #bfe6ff; }
.sb-v small.neg { color: #ffb3bd; }
.bg-detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; padding: 14px; border-radius: var(--r); background: var(--deck); border: 1px solid var(--line); }
.bg-detail h3 { margin: 0 0 4px; font-size: 16px; }
.bg-detail p { margin: 0 0 6px; font-size: 13px; }

.dossier {
  background: var(--paper); color: var(--paper-ink); border-radius: 4px; padding: 18px;
  display: grid; gap: 14px; position: relative; overflow: hidden;
  background-image: repeating-linear-gradient(0deg, transparent 0 27px, rgba(91,107,144,0.08) 27px 28px);
}
.dossier .d-head { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: #5b6b90; border-bottom: 2px solid var(--paper-ink); padding-bottom: 6px; }
.dossier .d-head .num { font-size: 18px; color: var(--paper-ink); }
.dossier .d-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: #4a5878; }
.dossier .d-k { display: block; font-size: 11px; letter-spacing: 0.1em; color: #5b6b90; margin-bottom: 4px; }
.dossier .d-class h3 { margin: 0; font-size: clamp(24px, 5vw, 32px); font-weight: 900; color: var(--paper-ink); }
.dossier .d-class p { margin: 4px 0 0; font-size: 14px; }
.dossier .d-runner { color: #5b6b90; font-size: 12px !important; }
.dossier .d-cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; }
.dossier .d-notes { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; font-size: 13px; line-height: 1.55; }
.dossier .statbars { grid-template-columns: minmax(0, 1fr); }
.dossier .sb-k { color: #4a5878; }
.dossier .sb-track { background: var(--paper-line); }

.dstamp {
  display: inline-grid; justify-items: center; gap: 0; font-weight: 900; font-size: 24px; line-height: 1.15;
  padding: 4px 14px; border: 4px double currentColor; border-radius: 6px; transform: rotate(-8deg);
  animation: dstamp 0.35s cubic-bezier(.2, 2, .4, 1) both;
}
.dstamp small { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; }
.dstamp.n1 { transform: rotate(6deg); animation-delay: 0.5s; font-size: 20px; }
.dstamp.n2 { transform: rotate(-3deg); animation-delay: 0.9s; font-size: 18px; }
.dstamp.n0 { animation-delay: 0.15s; }
.dstamp.tone-hire { color: #2a8a3e; }
.dstamp.tone-reject { color: #c62f45; }
.dstamp.tone-odd { color: #7a3fb8; }
.dstamp.tone-file { color: #4a5878; }
.dstamp.tone-warn { color: #c46a1e; }
.dstamp.mini { font-size: 13px; padding: 2px 8px; border-width: 3px; animation: none; transform: rotate(-4deg); }
.dstamp.mini.unknown { color: #4a5568; }
.stamp-wall { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px; border-radius: var(--r); background: var(--paper); }
@keyframes dstamp { from { opacity: 0; scale: 2.2; } to { opacity: 0.92; scale: 1; } }

/* 創作 */
.craft { display: grid; gap: 14px; }
.craft > .btn-row { position: sticky; bottom: -18px; margin: 0 -18px -18px; padding: 12px 18px 18px; background: var(--deck); border-top: 1px solid var(--line); }
.craft-tray { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.slot { min-height: 74px; border-radius: var(--r); border: 1px dashed #34446a; display: grid; place-items: center; color: #4a5a80; font-size: 12px; min-width: 0; }
.slot .card { width: 100%; }
.slot.locked { opacity: 0.35; }
.craft-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 6px; }
.craft-grid .card { width: auto; }
.formula { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--font-num); font-size: 26px; line-height: 1; }
.formula .term { display: grid; gap: 2px; padding: 6px 10px; border-radius: var(--r); background: #0d1424; border: 1px solid var(--line); }
.formula .term small { font-family: var(--font-body); font-size: 11px; color: var(--mute); }
.formula .t-chips { color: #9fdcff; }
.formula .t-mult { color: var(--neon); }
.formula .t-spark { color: var(--spark); }
.formula .t-kpi { color: var(--alien); }
.formula .t-total { color: #fff; font-size: 34px; }
.formula .op { color: var(--mute); }
.combos { display: flex; flex-wrap: wrap; gap: 6px; }
.combo { font-size: 13px; padding: 5px 9px; border-radius: 999px; background: #2a1430; border: 1px solid var(--neon); color: #ffd6ef; }
.combo.res { background: #10233a; border-color: var(--sea); color: #c9f3fb; }
.combo.secondary { opacity: 0.75; border-style: dashed; }
.combo.hidden { background: #1a1a24; border-color: #4a4a60; color: #a0a0b8; }
.combo .m { font-family: var(--font-num); font-size: 16px; margin-left: 4px; }
.reveal { display: grid; gap: 10px; justify-items: center; text-align: center; padding: 10px 0; }
.reveal .work { font-size: 26px; font-weight: 900; text-wrap: balance; }
.reveal .score { font-family: var(--font-num); font-size: 64px; line-height: 1; color: #fff; text-shadow: 0 0 18px var(--neon); }
.reveal .score.boom { animation: boom 0.5s ease-out; }

.reveal .new { color: var(--spark); font-weight: 900; }
.relief { margin: 0; color: #e9dcc4; font-weight: 700; }

/* 道德抉擇 */
.dilemma .eyebrow { font-size: 12px; letter-spacing: 0.12em; color: var(--stone); font-weight: 700; }
.dilemma .d-text { font-size: 19px; font-weight: 700; line-height: 1.6; text-wrap: pretty; }
.d-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.d-opt {
  text-align: left; cursor: pointer; display: grid; gap: 8px; align-content: start; min-width: 0;
  padding: 14px; border-radius: var(--r); background: var(--deck-2); border: 1px solid var(--line);
}
.d-opt:hover:not(:disabled) { border-color: var(--stone); background: #1e2638; }
.d-opt:focus-visible { outline: 2px solid var(--spark); outline-offset: 2px; }
.d-opt:disabled { opacity: 0.45; cursor: not-allowed; }
.d-label { font-size: 17px; font-weight: 900; }

/* 標題與結局 */
.title-menu { display: grid; gap: 14px; }
.tagline { margin: 0; font-size: clamp(18px, 3.6vw, 26px); font-weight: 900; text-wrap: balance; }
.tagline em { font-style: normal; color: var(--neon); }
.lede { margin: 0; color: var(--mute); max-width: 62ch; }
.stats-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--mute); }
.stats-row b { color: var(--fg); font-family: var(--font-num); font-size: 18px; font-weight: 400; }
.bg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.bg-card { text-align: left; cursor: pointer; display: grid; gap: 6px; padding: 12px; border-radius: var(--r); background: var(--deck); border: 1px solid var(--line); min-width: 0; }

.bg-card.sel { border-color: var(--spark); box-shadow: 0 0 0 1px var(--spark); }
.bg-card .n { font-weight: 900; font-size: 16px; }
.bg-card .d { font-size: 12px; color: var(--mute); }
.bg-card .p { font-size: 12px; color: var(--spark); }
.bg-card .s { display: flex; gap: 10px; font-family: var(--font-num); font-size: 17px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 8px 12px; border-radius: 999px; background: var(--deck); border: 1px solid var(--line); cursor: pointer; font-size: 13px; }
.seg button.sel { border-color: var(--sea); background: #10233a; }

.ending { display: grid; gap: 14px; text-align: center; justify-items: center; }
.ending .e-kind { font-family: var(--font-pixel); font-size: 12px; letter-spacing: 0.2em; color: var(--mute); }
.ending h2 { font-size: clamp(34px, 8vw, 54px); line-height: 1.05; }
.ending .epitaph { font-size: 17px; max-width: 34ch; line-height: 1.7; }
.ending.death h2 { color: #ffb3bd; }
.ending.grey h2 { color: #9ca3af; }
.ending.ordinary h2 { color: #c9f3fb; }
.ending.agent h2 { color: var(--alien); }
.ending.returned h2 { color: var(--spark); }
.ending.heavy h2 { color: var(--stone); }
.ending.guardian h2 { color: #ffd6a0; }
.e-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(74px, 1fr)); gap: 8px; width: 100%; }
.e-stat { padding: 8px; border-radius: var(--r); background: #0d1424; border: 1px solid var(--line); display: grid; gap: 2px; }
.e-stat .k { font-size: 11px; color: var(--mute); }
.e-stat .num { font-size: 24px; line-height: 1; }

.help { display: grid; gap: 10px; font-size: 14px; }
.help h3 { color: var(--fg); font-size: 15px; margin-top: 4px; }
.help ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.recipe { padding: 8px; border-radius: var(--r); background: #0d1424; border: 1px solid var(--line); font-size: 13px; display: grid; gap: 4px; }
.recipe.unknown { color: var(--mute); }

/* 提示 */
.toasts { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; width: min(440px, calc(100% - 32px)); pointer-events: none; }
.toast { padding: 10px 14px; border-radius: var(--r); background: #1f2a44; border: 1px solid var(--line); font-size: 14px; animation: pop 0.2s ease-out; }
.toast.good { border-color: var(--cash); }
.toast.bad { border-color: var(--danger); }

@media (max-width: 720px) {

  .bg-detail, .dossier .d-cols { grid-template-columns: minmax(0, 1fr); }

  .hud-meters .m-signal { grid-column: span 2; }
  .meter { padding: 6px 8px; gap: 6px; }
  .meter .num { font-size: 20px; }
  .acts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .act { padding: 10px; }
  .act-name { font-size: 15px; }
  .craft-tray { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .formula { font-size: 22px; }
  .reveal .score { font-size: 52px; }
}
@media (max-width: 380px) {
  .acts { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

      fish: { sardine: 2, eel: 2 + Math.floor(s.day / 30), grouper: 1 + Math.floor(s.day / 45), jelly: 3 + Math.floor(s.day / 25) },
    };
  }
  function diveBodyCost(s) {
    return Math.round((14 - seasonOf(s).outdoorBody) * (perk(s).diveBody || 1));
  }
  // res：{ relics: [卡 id 或前世作品], money, fish: { sardine, eel, grouper }, hits, drowned, lockers }
  function applyDive(s, res) {
    const rep = report(s, '舊城潛水');
    const fish = res.fish || {};
    const cost = Math.round(diveBodyCost(s) + 5 * res.hits * calmMult(s) + (res.drowned ? 15 : 0));
    s.body -= cost;
    s.cr += res.money; s.stats.crEarned += res.money;
    const n = res.relics.length;
    const sp = addSpark(s, 0.05 * n);
    const caught = (fish.sardine || 0) + (fish.eel || 0) + (fish.grouper || 0);
    s.mastery.dive++;
    s.flags.divedDay = s.day;
    s.stats.dives++; s.stats.relics += n; s.stats.fish += caught;
    countAction(s, 'dive');
    Object.keys(fish).forEach((k) => { if (fish[k]) s.log.fish[k] = true; });
    res.relics.forEach((r) => { if (typeof r === 'string') s.log.relics[r] = true; });
    if (res.drowned) rep.line('氧氣耗盡，你掙扎著浮上水面，失去了一半收穫', 'bad');
    if (res.hits) rep.line('被咬或碰撞 ' + res.hits + ' 次', 'bad');
    const fishText = Object.keys(fish).filter((k) => fish[k] && D.FISH[k].value)
      .map((k) => D.FISH[k].name + ' ×' + fish[k]).join('、');
    if (fishText) rep.line('漁獲：' + fishText, '');
    rep.line('打撈遺物 ' + n + ' 件，賣出漁獲與廢料 $' + res.money, '');
    if (Object.keys(fish).some((k) => fish[k] && D.FISH[k].dinner)) {
      s.flags.fishDinner = s.day;
      rep.line('留下一條大魚當晚餐，今晚不用花錢吃飯', 'good');
    }
    rep.delta('cr', res.money); rep.delta('body', -cost);
    if (sp) rep.delta('spark', sp);
    res.relics.forEach((r) => rep.gain(r));
    train(s, { swim: 1.5, fit: 1, calm: 0.4 }, rep);
    if (res.lockers) sin(s, 0.5 * res.lockers, rep, '撬開了別人的儲物櫃 ' + res.lockers + ' 個');

  // ---------- 工作：陰謀論內容農場 ----------
  // 一則標題的轉發量：組合越煽動、捏造程度越高，轉發越多
  function farmScore(tiles) {
    const tags = tiles.flatMap((t) => t.tags);
    let mult = 1;
    const combos = [];
    D.FARM_COMBOS.forEach((c) => {
      const need = c.need.slice();
      const pool = tags.slice();
      const ok = need.every((t) => { const i = pool.indexOf(t); if (i < 0) return false; pool.splice(i, 1); return true; });
      if (ok) { mult *= c.mult; combos.push(c.name); }
    });
    const fake = tiles.reduce((a, t) => a + t.fake, 0) / tiles.length;
    const truth = tags.filter((t) => t === 'truth').length;
    const shares = Math.round(900 * mult * (1 + fake * 1.2) * (truth ? 0.5 : 1));
    return { shares, fake, truth, combos };
  }
  function farmConfig(s) {
    return { duration: 40, payMult: (perk(s).farmPay || 1) * worldPay(s, 'farm') * obeyPay(s), showFake: A(s, 'insight') >= 50 };
  }
  function applyFarm(s, res) {
    const rep = report(s, '陰謀論內容農場');
    const cr = Math.round(res.cr);
    s.cr += cr; s.stats.crEarned += cr;
    s.body -= 4;
    const sp = addSpark(s, -0.25);
    s.stats.headlines += res.headlines; s.stats.shares += res.shares;
    countAction(s, 'farm');
    s.workedToday = true;
    rep.line('寫了 ' + res.headlines + ' 則標題，總轉發量 ' + res.shares.toLocaleString(), '');
    if (res.truth) rep.line('其中 ' + res.truth + ' 則有事實根據，但轉發量較低', '');
    rep.delta('cr', cr); rep.delta('body', -4); rep.delta('spark', sp);
    rep.gain(res.shares > 20000 ? 'f_viral' : 'f_war');
    if (res.truth >= 2) rep.gain('f_truth');
    addParanoia(s, 1.5 * res.fakeTotal, rep);
    train(s, { insight: 0.4 + 0.3 * res.truth, craft: 0.5, obey: 1, empathy: -0.5 }, rep);
    if (res.fakeTotal > 0.3) sin(s, 0.25 * res.fakeTotal, rep, '你製造的恐慌正在城市裡流傳', res.fakeTotal >= 4 ? '寫過的假新聞' : null, 'neon');
    return rep.done();
  }

  // ---------- 夢境面試（篩選日前兩晚） ----------
  function interviewQuestions(s) {
    const idx = D.INTERVIEW_QS.map((_, i) => i);
    const out = [];
    while (out.length < 5 && idx.length) out.push(idx.splice(Math.floor(rand(s) * idx.length), 1)[0]);
    s.interviewSet = out;
    return out;
  }
  // answers：[{ q: 題目索引, a: 答案索引（-1 = 沉默） }]
  function applyInterview(s, answers) {
    const rep = report(s, '外星 HR 夢境面試');
    let score = 0;
    answers.forEach(({ q, a }) => {
      const ans = a < 0 ? D.INTERVIEW_TIMEOUT : D.INTERVIEW_QS[q].a[a];
      score += ans.score;
      if (ans.stats) train(s, ans.stats, rep);
      if (ans.sin) sin(s, ans.sin, rep, '你在面試中說了違心的話');
      if (ans.atone) atone(s, ans.atone, rep, '你在夢裡說了真心話');
      if (ans.card) rep.gain(ans.card);
      s.stats.lastReact = ans.react;
    });
    const bonus = Math.max(-6000, score * 2500);
    s.bonusSignal += bonus;
    s.stats.interviews++; s.stats.interviewScore += score;
    rep.line('面試評分 ' + (score > 0 ? '+' : '') + score + '，外星訊號 ' + (bonus >= 0 ? '+' : '−') + Math.abs(bonus).toLocaleString(), bonus >= 0 ? 'good' : 'bad');
    if (score >= 4) rep.gain('i_smile');
    return rep.done();
  }

  // ---------- 聊天、義工、休息 ----------
  function chatCost(s) { return perk(s).freeChat ? 0 : 15; }
  function aliveNpcs(s) { return s.npcs.filter((n) => n.alive); }
  function applyChat(s, npcId) {
    const n = s.npcs.find((x) => x.id === npcId);

    rep.delta('spark', sp); rep.delta('body', 5 + outdoor);
    rep.gain(def.cards[(Math.max(1, n.friend) - 1) % def.cards.length]);

    addParanoia(s, -2);

  // ---------- 創作 ----------
  function evalCraft(s, uids) {
    const cards = uids.map((u) => s.cards.find((c) => c.uid === u)).filter(Boolean);
    const counts = {};
    cards.forEach((c) => c.tags.forEach((t) => { counts[t] = (counts[t] || 0) + 1; }));
    const cardChips = cards.reduce((a, c) => a + c.value, 0) * (perk(s).craftChips || 1) * (1 + 0.003 * A(s, 'craft'));
    const combos = [];
    let maxTag = null, maxCount = 0;
    Object.keys(counts).forEach((t) => { if (counts[t] > maxCount) { maxCount = counts[t]; maxTag = t; } });
    for (const r of D.RESONANCE) {
      if (maxCount >= r.count) {
        combos.push({ id: r.id, name: r.name + '・' + D.TAGS[maxTag].name, chips: r.chips, mult: r.mult, kind: 'res' });
        break;
      }
    }
    // 主組合計足倍率，其餘組合只加 0.5（避免倍率無限疊加）
    const recipes = D.RECIPES
      .filter((rec) => Object.keys(rec.need).every((t) => (counts[t] || 0) >= rec.need[t]))
      .sort((a, b) => b.mult - a.mult);
    recipes.forEach((rec, i) => {
      combos.push({ id: rec.id, name: rec.name, chips: rec.chips, mult: i === 0 ? rec.mult : 0.5, kind: 'recipe',
        secondary: i > 0, isNew: !s.discovered[rec.id], used: !!s.usedRecipes[rec.id] });
    });
    if (Object.keys(counts).length >= D.MEDLEY.minTags) {
      combos.push({ id: D.MEDLEY.id, name: D.MEDLEY.name, chips: D.MEDLEY.chips, mult: D.MEDLEY.mult, kind: 'medley' });
    }
    const chips = Math.round(cardChips + combos.reduce((a, c) => a + c.chips, 0));
    const mult = round1(1 + combos.reduce((a, c) => a + c.mult, 0));
    const base = chips * mult * s.spark * (worldMods(s).signalMult || 1);
    const k = kpi(s);
    let kpiMod = 1;
    if (k.tag && counts[k.tag]) kpiMod = k.mod;
    if (k.special === 'lean' && cards.length >= 4) kpiMod = 0.5;
    if (k.special === 'pliable' && s.spark < 2) kpiMod = 1.5;
    if (k.special === 'novelty') {
      const named = combos.filter((c) => c.kind === 'recipe');
      if (named.length && named.every((c) => c.used)) kpiMod = 0.2;
    }
    const relief = round1(cards.reduce((a, c) => a + (c.grams || 0), 0));
    return { cards, counts, cardChips: Math.round(cardChips), chips, mult, spark: s.spark, relief,
      combos, kpi: k, kpiMod, raw: Math.round(base), total: Math.round(base * kpiMod) };
  }
  function workName(s, ev) {
    const named = ev.combos.filter((c) => c.kind === 'recipe').sort((a, b) => b.mult - a.mult);
    if (named.length) return named[0].name;
    const tags = Object.keys(ev.counts).sort((a, b) => ev.counts[b] - ev.counts[a]);
    if (tags.length >= 2) return D.TAGS[tags[0]].name + '與' + D.TAGS[tags[1]].name;
    return '無題 #' + (s.stats.works + 1);
  }
  // 創作需要材料費：藝術不是免費的
  const craftCost = (n) => 10 + 5 * n;
  function canCreate(s) {
    if (s.spark < 1) return { ok: false, reason: '火花不足 ×1.0，你什麼都想不出來' };
    if (s.cards.length < 2) return { ok: false, reason: '最少需要 2 張素材' };
    if (s.cr < craftCost(2)) return { ok: false, reason: '連 $' + craftCost(2) + ' 材料費都付不起' };
    return { ok: true };
  }
  function commitCraft(s, uids) {
    const ev = evalCraft(s, uids);
    const used = new Set(uids);
    s.cards = s.cards.filter((c) => !used.has(c.uid));
    s.cr -= craftCost(ev.cards.length);
    const fresh = ev.combos.filter((c) => c.kind === 'recipe' && !s.discovered[c.id]);
    fresh.forEach((c) => { s.discovered[c.id] = true; });
    ev.combos.filter((c) => c.kind === 'recipe').forEach((c) => { s.usedRecipes[c.id] = true; });
    const tags = Object.keys(ev.counts).sort((a, b) => ev.counts[b] - ev.counts[a]);
    const work = { day: s.day, quarter: s.quarter, name: workName(s, ev), tags,
      score: ev.total, raw: ev.raw, medium: bgOf(s).medium, n: ev.cards.length };
    s.works.push(work);
    s.stats.works++;
    countAction(s, 'create');
    if (!s.stats.bestWork || work.raw > s.stats.bestWork.raw) s.stats.bestWork = work;
    s.body -= 4;
    s.saturation = Math.min(1.15, s.saturation + 0.02);
    let sparkUp = 0;
    if (fresh.length) sparkUp = addSpark(s, 0.15, true);
    // 把愧疚寫進作品：卸下它的重量
    let relief = 0;
    if (ev.relief) { relief = atone(s, ev.relief, null); s.stats.confessions++; }
    train(s, { craft: 1.2, imag: 0.5 }, null);
    return { ev, work, fresh, sparkUp, relief };
  }

      const cost = chatCost(s);
      list.push({ id: 'chat', group: 'life', name: '找朋友聊天', sub: '還有 ' + aliveNpcs(s).length + ' 個朋友留在浮城',
        fx: [['cr', cost ? '−$' + cost : '免費'], ['body', '+' + (5 + outdoor)], ['spark', '+0.4 起'], ['card', '人情']],
        reason: aliveNpcs(s).length === 0 ? '他們全都被帶走了' : s.cr < cost ? '沒錢請人喝東西' : null });
      list.push({ id: 'volunteer', group: 'life', name: '到避難所做義工', sub: '幫人不會賺錢，但會讓靈魂變輕',
        fx: [['soul', '−' + round1(2.5 * (perk(s).volunteerAtone || 1) * (worldMods(s).atoneMult || 1)) + ' 克'], ['body', '−6'], ['spark', '+0.2'], ['card', '人情']],
        reason: tired });
      list.push({ id: 'rest', group: 'life', name: '休息', sub: '什麼都不做，也是一種選擇',
        fx: [['body', '+' + (s.floor === 0 ? 12 : 22)], ['spark', '+0.3']] });
    } else {
      const c = canCreate(s);
      list.push({ id: 'create', group: 'night', name: '創作', sub: '把今天的經歷變成作品，讓外星人看見',
        fx: [['card', '使用 2 至 ' + s.craftSlots + ' 張素材'], ['cr', '材料 −$' + craftCost(2) + ' 起'], ['sig', '訊號 ↑'], ['body', '−4']],
        reason: c.reason });
      list.push({ id: 'ot', group: 'night', name: '深夜加班標註', sub: '收入 ×1.5，消耗 ×1.5',
        fx: [['cr', '約 +$' + Math.round(labelCr * 1.5)], ['body', '−14'], ['spark', '約 −' + round1(labelSpark * 1.5)]],
        reason: s.removed.label ? '職位已被 AI 取代' : worldClosed(s, 'ot') || labelLocked || (s.body <= 14 ? '身體撐不住了' : null) });
      list.push({ id: 'rest', group: 'night', name: '早點睡', sub: '明天又是新的一天',
        fx: [['body', '+' + (s.floor === 0 ? 12 : 22)], ['spark', '+0.3']] });
    }
    list.forEach((a) => { a.enabled = !a.reason; });
    return list;
  }

  // ---------- 商店 ----------
  // 業力抵銷額度：每買一份，下一份貴 $30
  const offsetCost = (s) => 90 + 30 * (s.offsets || 0);
  function shop(s) {
    const items = [];
    const S = D.SHOP;
    items.push({ id: 'premium', ...S.premium, owned: s.premiumUntil >= s.day,
      note: s.premiumUntil >= s.day ? '有效至第 ' + s.premiumUntil + ' 天' : null });
    items.push({ id: 'supplement', ...S.supplement });
    items.push({ id: 'realfood', ...S.realfood, owned: s.realFoodDay === s.day, note: s.realFoodDay === s.day ? '今天已經吃過' : null });
    items.push({ id: 'tools', ...S.tools, owned: s.craftSlots >= 5 });
    ['tank', 'harpoon', 'bag', 'monitor'].forEach((k) => items.push({ id: k, ...S[k], owned: s.gear[k] }));
    items.push({ id: 'offset', ...S.offset, cost: offsetCost(s), owned: s.soul <= 0,
      note: '你的靈魂現在重 ' + s.soul.toFixed(1) + ' 克；需求越大，價格越高' });
    if (worldMods(s).eraseShop) {
      items.push({ id: 'erase', name: '記憶刪除服務', desc: '忘記一段內疚的往事：靈魂 −4 克，良知 −15%，失去所有「記憶」素材', cost: 50 });
    }
    if (s.floor === 0) {
      const f = Math.floor(s.water) + 1;
      if (f <= 8) items.push({ id: 'rehouse', name: '重新租屋（' + f + ' 樓）', desc: '按金為兩期租金', cost: 2 * rentAmount(s, f), target: f });
    } else {
      if (s.floor < 8) items.push({ id: 'moveup', name: '搬上 ' + (s.floor + 1) + ' 樓', desc: '每期租金 $' + rentAmount(s, s.floor + 1) + '，按金一期', cost: rentAmount(s, s.floor + 1) });
      if (s.floor > 1 && s.water < s.floor - 1) items.push({ id: 'movedown', name: '搬到 ' + (s.floor - 1) + ' 樓', desc: '每期租金 $' + rentAmount(s, s.floor - 1) + '，但離水更近', cost: 0 });
    }
    items.forEach((it) => { it.enabled = !it.owned && s.cr >= it.cost; });
    return items;
  }
  function buy(s, id) {
    const it = shop(s).find((x) => x.id === id);
    if (!it || !it.enabled) return { ok: false, msg: '無法購買' };
    s.cr -= it.cost;
    switch (id) {
      case 'premium': s.premiumUntil = s.day + 4; break;
      case 'supplement':
        addSpark(s, 1.2, true);
        s.flags.crashDay = s.day + 2; s.flags.crashAmt += 1.6; break;
      case 'realfood': s.realFoodDay = s.day; heal(s, 15); addSpark(s, 0.2); break;
      case 'tools': s.craftSlots = 5; break;
      case 'tank': case 'harpoon': case 'bag': case 'monitor': s.gear[id] = true; break;
      case 'offset': s.soul = round1(Math.max(0, s.soul - 1.5)); s.offsets = (s.offsets || 0) + 1; break;
      case 'erase':
        s.soul = round1(Math.max(0, s.soul - 4));
        s.conscience = clamp(s.conscience - 0.15, 0, 1);
        s.cards = s.cards.filter((c) => !c.tags.includes('memory'));
        train(s, { imag: -4 }, null);
        break;
      case 'moveup': s.floor += 1; break;
      case 'movedown': s.floor -= 1; break;
      case 'rehouse': s.floor = it.target; s.graceUsed = false; s.debt = 0; break;
    }
    return { ok: true, msg: '已購買：' + it.name };
  }

  // ---------- 道德抉擇 ----------
  // 每天早上約四成機會遇到一個；大部分抉擇每局只出現一次，少數可以隔一段時間再出現
  function drawDilemma(s) {
    if (s.dilemmaDay === s.day) return s.dilemma;
    s.dilemmaDay = s.day; s.dilemma = null;
    if (rand(s) > 0.4 + (worldMods(s).dilemmaBoost || 0)) return null;
    const pool = D.DILEMMAS.filter((d) => {
      const used = s.usedDilemmas[d.id];
      const fresh = !used || (d.repeat && s.day - used >= d.repeat);
      return fresh && (!d.when || d.when(s));
    });
    if (!pool.length) return null;
    const d = pick(s, pool);
    const taken = s.npcs.filter((n) => !n.alive);
    s.dilemma = { id: d.id, npc: d.npc ? pick(s, aliveNpcs(s)).id : null, taken: d.taken && taken.length ? pick(s, taken).id : null };
    return s.dilemma;
  }
  function minReason(s, o) {
    if (!o.min) return null;
    for (const k of Object.keys(o.min)) {
      if (A(s, k) < o.min[k]) return '需要' + D.STATS[k].name + ' ' + o.min[k] + '（你只有 ' + Math.round(A(s, k)) + '）';
    }
    return null;
  }
  function optionFx(s, o) {
    const fx = [];
    const sign = (v) => (v > 0 ? '+' : '−') + Math.abs(v);
    if (o.cr) fx.push(['cr', sign(o.cr)]);
    if (o.body) fx.push(['body', sign(o.body)]);
    if (o.spark) fx.push(['spark', sign(o.spark)]);
    if (o.sin) fx.push(['soul', '+' + round1(o.sin * sinFactor(s)) + ' 克']);
    if (o.atone) fx.push(['soul', '−' + round1(Math.min(s.soul, o.atone)) + ' 克']);
    if (o.rating) fx.push(['note', '評分 ' + sign(o.rating)]);
    if (o.signal) fx.push(['sig', '訊號 ' + (o.signal > 0 ? '+' : '−') + Math.abs(o.signal).toLocaleString()]);
    if (o.rentDiscount) fx.push(['cr', '下期租金減半']);
    if (o.foodFree) fx.push(['cr', '今晚不用付飯錢']);
    if (o.loseCard) fx.push(['card', '失去一張素材']);
    if (o.takeNpc || o.takeNamedNpc) fx.push(['note', '一位朋友會被帶走']);
    if (o.paranoia) fx.push(['note', '偏執 +' + o.paranoia]);
    if (o.stats) Object.keys(o.stats).forEach((k) => fx.push(['stat', D.STATS[k].name + ' ' + sign(o.stats[k])]));
    if (o.card) fx.push(['card', D.CARDS[o.card].name]);
    if (o.guilt && o.sin >= 1) fx.push(['card', '愧疚：' + o.guilt]);
    return fx;
  }
  function dilemmaView(s) {
    const cur = s.dilemma;
    if (!cur) return null;
    const d = D.DILEMMAS.find((x) => x.id === cur.id);
    const name = (id) => (id ? D.NPCS.find((n) => n.id === id).name : '');
    return { id: d.id, text: d.text.replace('{npc}', name(cur.npc)).replace('{taken}', name(cur.taken)),
      options: d.options.map((o, i) => ({ i, label: o.label, reason: (o.need && o.need(s)) || minReason(s, o), fx: optionFx(s, o) })) };
  }
  function takeNpc(s, n, rep) {
    n.alive = false;
    s.saturation = Math.max(0.25, s.saturation - 0.15);
    rep.line('「' + D.NPCS.find((x) => x.id === n.id).name + '」當晚被帶走了', 'bad');
  }
  function resolveDilemma(s, idx) {
    const cur = s.dilemma;
    const d = D.DILEMMAS.find((x) => x.id === cur.id);
    const o = d.options[idx];
    s.usedDilemmas[d.id] = s.day;
    s.dilemma = null;
    const rep = report(s, '抉擇：' + o.label);
    if (o.cr) { s.cr += o.cr; rep.delta('cr', o.cr); }
    if (o.body) { heal(s, o.body); rep.delta('body', o.body); }
    if (o.spark) rep.delta('spark', addSpark(s, o.spark, true));
    if (o.rating) { s.rating = clamp(o.rating === 5 ? 5 : s.rating + o.rating, 1, 5); rep.line('平台評分 ' + (o.rating === 5 ? '變成 5.0' : (o.rating > 0 ? '+' : '') + o.rating), o.rating > 0 ? 'good' : 'bad'); }
    if (o.signal) { s.bonusSignal += o.signal; rep.line('外星訊號 ' + (o.signal > 0 ? '+' : '−') + Math.abs(o.signal).toLocaleString(), o.signal > 0 ? 'good' : 'bad'); }
    if (o.rentDiscount) { s.rentDiscount = o.rentDiscount; rep.line('下期租金減半', 'good'); }
    if (o.foodFree) s.flags.foodFree = s.day;
    if (o.flag) s.flags[o.flag] = true;
    if (o.loseCard && s.cards.length) {
      const lost = s.cards.splice(Math.floor(rand(s) * s.cards.length), 1)[0];
      rep.line('你借出了「' + lost.name + '」', '');
    }
    if (o.friend && cur.npc) s.npcs.find((n) => n.id === cur.npc).friend += o.friend;
    if (o.takeNpc) {
      const alive = s.npcs.filter((n) => n.alive).sort((a, b) => b.signal - a.signal);
      if (alive.length) takeNpc(s, alive[0], rep);
    }
    if (o.takeNamedNpc && cur.npc) takeNpc(s, s.npcs.find((n) => n.id === cur.npc), rep);
    if (o.card) rep.gain(o.card);
    if (o.stats) train(s, o.stats, rep);
    if (o.paranoia) addParanoia(s, o.paranoia, rep);
    if (o.sin) sin(s, o.sin, rep, '這件事會一直壓在你心上', o.guilt, o.tag);
    if (o.atone) atone(s, o.atone, rep, '你覺得輕了一點');
    return rep.done();
  }

  // ---------- 早上 ----------
  function startWorldEvent(s, feed) {
    const pool = D.WORLD_EVENTS.filter((w) => !s.worldsSeen[w.id]);
    const w = pick(s, pool.length ? pool : D.WORLD_EVENTS);
    s.world = { id: w.id, until: s.day + w.dur - 1 };
    s.worldsSeen[w.id] = (s.worldsSeen[w.id] || 0) + 1;
    feed.unshift({ kind: 'world', text: '【世界事件：' + w.name + '】' + w.news });
    const fx = w.startFx || {};
    if (fx.water) s.water = Math.min(8.5, s.water + fx.water);
    if (fx.auto) s.auto = clamp(s.auto + fx.auto, 0, 100);
    if (fx.spark) addSpark(s, fx.spark, true);
    if (fx.crPct) s.cr = Math.round(s.cr * (1 + fx.crPct));
    if (fx.paranoia) addParanoia(s, fx.paranoia);
    if (fx.card) addCard(s, fx.card);
    if (fx.takeNpc) {
      const alive = s.npcs.filter((n) => n.alive);
      if (alive.length) { const n = pick(s, alive); n.alive = false; s.saturation = Math.max(0.25, s.saturation - 0.15); }
    }
  }
  function morning(s) {
    if (s.morning && s.morning.day === s.day) return s.morning;
    const S = seasonOf(s);
    const feed = [{ kind: 'weather', text: pick(s, D.FEED.weather[s.season]) }];
    // 世界事件：沒有進行中的事件時，隔一段日子就可能爆發一個
    if (!s.world && s.day >= s.worldNext && rand(s) < 0.22) startWorldEvent(s, feed);
    else if (s.world) feed.unshift({ kind: 'world', text: '【世界事件持續：' + worldDef(s).name + '】還有 ' + (s.world.until - s.day + 1) + ' 天。' });
    (s.newsQueue || []).forEach((t) => feed.push({ kind: 'news', text: t }));
    s.newsQueue = [];
    feed.push(rand(s) < 0.5 ? { kind: 'ad', text: pick(s, D.FEED.ads) } : { kind: 'post', text: pick(s, D.FEED.conspiracy) });
    // 偏執太高的人，會在動態裡看見不存在的帖文
    if (s.paranoia >= 60) feed.push({ kind: 'post', text: pick(s, ['@？？？：它們在你的牆壁裡', '@你自己：不要相信明天的你', '@浮城政府：今天沒有發生任何事', '@阿星：我看得見你']), fake: true });
    addParanoia(s, 0.6);
    const k = kpi(s);
    feed.push({ kind: 'alien', text: '【星際人才發展局・招募簡報】我們尋找又亮又輕、沒有包袱的人。' + k.name + '：' + k.desc + '。為保護本局神經網絡，靈魂重量上限為 ' + SOUL_LIMIT + ' 克。' });
    if (flooded(s)) feed.push({ kind: 'warn', text: '水已經淹到你住的 ' + s.floor + ' 樓。你可以搬上一層，或者繼續泡在水裡。' });
    const astar = D.ASTAR[s.day] || null;
    s.morning = { day: s.day, feed, astar, season: S.name };
    return s.morning;
  }

  function applyAutomationNews(s, before, rep) {
    Object.keys(D.FEED.autoNews).map(Number).forEach((th) => {
      if (before < th && s.auto >= th && !s.newsSeen[th]) {
        s.newsSeen[th] = true;
        s.newsQueue = s.newsQueue || [];
        s.newsQueue.push(D.FEED.autoNews[th]);
        if (rep) rep.line(D.FEED.autoNews[th], 'news');
      }
    });
    if (s.auto >= 60) s.removed.smile = true;
    if (s.auto >= 100) s.removed.label = true;
  }

  // ---------- 一天結束 ----------
  function nightEvent(s, rep) {
    const pool = D.EVENTS.filter((e) => (!e.onlySeason || e.onlySeason === s.season) && (!e.when || e.when(s)));
    const weights = pool.map((e) => e.w * ((e.season && e.season[s.season]) || 1));
    let r = rand(s) * weights.reduce((a, b) => a + b, 0);
    let ev = pool[0];
    for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) { ev = pool[i]; break; } }
    const e = ev.alt && A(s, ev.alt.stat) >= ev.alt.min ? ev.alt : ev;
    rep.event = e.text;
    rep.line(e.text, 'event');
    if (e.body) { const b = e.body < 0 ? Math.round(e.body * calmMult(s)) : e.body; heal(s, b); rep.delta('body', b); }
    if (e.spark) rep.delta('spark', addSpark(s, e.spark, true));
    if (e.cr) { s.cr = Math.max(0, s.cr + e.cr); rep.delta('cr', e.cr); }
    if (e.crPct) { const loss = Math.min(e.crMax, Math.round(s.cr * -e.crPct)); s.cr -= loss; rep.delta('cr', -loss); }
    if (e.rentHike) s.rentHike += e.rentHike;
    if (e.rating) s.rating = clamp(s.rating + e.rating, 1, 5);
    if (e.flag) s.flags[e.flag] = s.day + 1;
    if (e.card) rep.gain(e.card);
    if (e.stats) train(s, e.stats, rep);
    if (e.paranoia) addParanoia(s, e.paranoia, rep);
  }

  function endDay(s) {
    const S = seasonOf(s);
    const M = worldMods(s);
    const rep = report(s, '第 ' + s.day + ' 天結算');
    rep.review = null; rep.ending = null; rep.event = null; rep.interview = false;
    // 晚餐
    const food = foodCost(s);
    if (s.flags.fishDinner === s.day) {
      heal(s, 6);
      rep.line('晚餐：自己抓的魚', 'good', 6, 'body');
    } else if (s.flags.foodFree === s.day) {
      rep.line('晚餐：沒付錢的便當', '');
    } else if (s.cr >= food) {
      s.cr -= food;
      rep.line(s.season === 'heat' ? '晚餐與電費' : '晚餐（合成糊）', 'cost', -food, 'cr');
    } else {
      s.body -= 22; s.stats.hungryDays++;
      addSpark(s, -0.3);
      rep.line('沒錢吃飯，餓著肚子睡覺', 'bad', -22, 'body');
      rep.line('飢餓令你無法思考', 'bad', -0.3, 'spark');
      rep.gain('e_hunger');
      train(s, { fit: -0.5 }, rep);
    }
    // 睡覺
    if (s.floor === 0) { s.body -= 10; rep.line('在天橋下睡不好', 'bad', -10, 'body'); }
    else if (flooded(s)) { s.body -= 8; rep.line('家裡正在淹水', 'bad', -8, 'body'); }
    else { heal(s, 8); rep.line('睡覺', '', 8, 'body'); }
    if (S.nightBody) { s.body += S.nightBody; rep.line('熱得睡不著', 'bad', S.nightBody, 'body'); }
    // 世界事件的每日影響
    if (M.bodyDaily) { const b = Math.round(M.bodyDaily * calmMult(s)); s.body += b; rep.line('世界事件：' + worldDef(s).name, 'bad', b, 'body'); }
    if (M.sparkDaily) rep.line('世界事件：' + worldDef(s).name, 'good', addSpark(s, M.sparkDaily, true), 'spark');
    if (M.paranoiaDaily) addParanoia(s, M.paranoiaDaily);
    else addParanoia(s, -0.8);
    // 補充劑反彈
    if (s.flags.crashDay === s.day && s.flags.crashAmt) {
      addSpark(s, -s.flags.crashAmt);
      rep.line('靈感補充劑藥效過去，火花反彈下跌', 'bad', -s.flags.crashAmt, 'spark');
      s.flags.crashAmt = 0;
    }
    // 平台活躍度
    if (!s.workedToday) {
      s.rating = clamp(s.rating - 0.15, 1, 5);
      rep.line('今天沒有上班，平台評分 −0.15', 'bad');
    }
    s.workedToday = false;
    if (s.rating < 3.5) s.rating = Math.min(3.5, s.rating + 0.05);
    // 全城自動化
    const autoBefore = s.auto;
    s.auto = clamp(s.auto + 0.35, 0, 100);
    applyAutomationNews(s, autoBefore, rep);
    // 朋友的訊號
    s.npcs.forEach((n) => {
      if (!n.alive) return;
      const def = D.NPCS.find((x) => x.id === n.id);
      n.signal += Math.round(def.base * (0.7 + rand(s) * 0.6) * (1 + s.quarter * 0.3));
    });
    // 隨機事件
    if (rand(s) < 0.45) nightEvent(s, rep);
    // 水位
    const wasFlooded = flooded(s);
    s.water = Math.min(8.5, s.water + S.water);
    if (!wasFlooded && flooded(s)) rep.line('水位升到 ' + Math.floor(s.water) + ' 樓，淹進你家了！', 'bad');
    // 交租（每 7 天）
    if (s.day % D.RENT_EVERY === 0 && s.floor > 0) {
      const due = Math.round(rentAmount(s) * (1 - (s.rentDiscount || 0))) + s.debt;
      if (s.rentDiscount) rep.line('舉報換來的減租', 'good');
      s.rentDiscount = 0;
      if (s.cr >= due) {
        s.cr -= due; s.debt = 0; s.graceUsed = false;
        rep.line('交租', 'cost', -due, 'cr');
        rep.rent = { paid: due };
      } else if (s.stats.atones >= 3 && !s.flags.neighborHelp) {
        // 人情：你幫過的人，會在你最困難的時候幫你一次
        s.flags.neighborHelp = s.day;
        rep.line('交不起租。鄰居們湊了 $' + due + ' 替你交租：你幫過他們。', 'good');
        s.debt = 0; s.graceUsed = false;
        rep.rent = { paid: due, helped: true };
      } else if (!s.graceUsed) {
        s.graceUsed = true; s.debt = Math.round(due * 1.2);
        rep.line('交不起租。房東寬限一期，下期連罰款要多付 $' + s.debt, 'bad');
        rep.rent = { grace: s.debt };
      } else {
        s.floor = 0; s.debt = 0; s.graceUsed = false;
        rep.line('第二次交不起租。你被趕出門，今晚開始睡在天橋下。', 'bad');
        rep.gain('e_evict');
        rep.rent = { evicted: true };
      }
    }
    // 麻木
    if (s.spark <= 0.2) s.numbStreak++; else s.numbStreak = 0;
    // 世界事件結束
    if (s.world && s.day >= s.world.until) {

    if (s.day === reviewDay(s) - 2) rep.interview = true;

    s.body = Math.min(bodyMax(s), s.body);
    if (s.body <= 0) rep.ending = endingFor(s, 'death');
    else if (s.numbStreak >= 4) rep.ending = endingFor(s, 'grey');
    else if (rep.review && rep.review.pass) rep.ending = endingFor(s, 'recruited');

    const signalOk = sig >= th;

    const pass = signalOk && !overweight;
    let taken = null;

      dossier.stamps.forEach((x) => { meta.stamps[x.id] = true; });

      stat(k, v) { r.stats[k] = (r.stats[k] || 0) + v; },

    const sd = Math.sqrt(vals.reduce((a, b) => a + (b - m) * (b - m), 0) / vals.length);
    D.STAT_KEYS.forEach((k) => { f[k] = clip((s.attr[k] - m) / 15); });
    f.mean = clip((m - 45) / 15);
    f.sd = sd / 15;
    const acts = s.stats.actions || {};
    const total = Math.max(1, Object.values(acts).reduce((a, b) => a + b, 0));
    ['label', 'smile', 'dive', 'delivery', 'farm', 'busk', 'clinic', 'chat', 'volunteer'].forEach((k) => {
      const share = ((acts[k] || 0) + (k === 'label' ? acts.ot || 0 : 0)) / total;
      f[k] = clip(Math.max(-1, (share - 0.1) / 0.1));
    });
    const days = Math.max(1, s.day);
    const works = s.works.length;
    f.para = clip((s.paranoia - 40) / 20);
    f.consc = clip((s.conscience - 0.6) / 0.2);
    f.soul = clip((s.soul - 14) / 6);
    f.spark = clip((s.spark - 2.2) / 0.8);
    f.works = clip((works / days - 0.25) / 0.15);
    f.hunger = clip((s.stats.hungryDays / days - 0.05) / 0.05);
    f.sins = clip((s.stats.sins / days - 0.6) / 0.4);
    f.confess = clip(((s.stats.confessions || 0) / Math.max(1, works) - 0.2) / 0.15);
    f.relics = clip((s.stats.relics / days - 0.3) / 0.3);
    f.cr = clip((s.cr - 400) / 400);
    return f;
  }

  function classify(s, kind) {
    const f = features(s, kind);
    const scored = ARCHETYPES.map((a) => {
      let sc = 0;
      if (a.w) Object.keys(a.w).forEach((k) => { sc += a.w[k] * (f[k] || 0); });
      if (a.special) sc += a.special(f);
      if (a.cond) sc += a.cond(f);
      return { a, sc };
    }).sort((x, y) => y.sc - x.sc);
    return { archetype: scored[0].a, runnerUp: scored[1].a, features: f };
  }

  // ---------- 觀察筆記 ----------
  // 每條筆記：p = 重要程度（越高越先列出），t = 內容；返回 null 代表不適用
  const fmt = (n) => Math.round(n).toLocaleString('en-US');
  function notes(s, kind, f) {
    const st = s.stats;
    const acts = st.actions || {};
    const alive = s.npcs.filter((n) => !n.alive).length;
    const list = [
      st.labels > 0 && { p: st.labels / 300, t: '為地球的 AI 貢獻了 ' + fmt(st.labels) + ' 筆訓練數據。我們代表那個 AI 表示感謝。' },
      st.perfects > 10 && { p: st.perfects / 60, t: '能在 0.07 秒內產生笑容，一共 ' + fmt(st.perfects) + ' 次。' },
      st.dives > 0 && { p: st.dives / 8, t: st.dives + ' 次潛入被淹沒的舊城，帶回 ' + st.relics + ' 件沒有市場價值的物件。' },
      st.fish > 0 && { p: st.fish / 30, t: '捕獲了 ' + st.fish + ' 條魚，並把其中一些吃掉了。' },
      st.deliveries > 0 && { p: st.deliveries / 25, t: '完成了 ' + st.deliveries + ' 次外送，準時率 ' + Math.round(100 * (1 - (st.lateDeliveries || 0) / Math.max(1, st.deliveries))) + '%。' },
      st.headlines > 0 && { p: st.headlines / 20, t: '製造了 ' + st.headlines + ' 則標題，總轉發量 ' + fmt(st.shares || 0) + '。它現在相信其中 ' + Math.min(99, Math.round(s.paranoia)) + '% 是真的。' },
      st.buskNotes > 0 && { p: st.buskNotes / 80, t: '在街頭發出了 ' + st.buskNotes + ' 次有規律的聲波，最多吸引 ' + (st.crowdMax || 0) + ' 名觀眾。' },
      st.patients > 0 && { p: st.patients / 20, t: '接駁了 ' + st.patients + ' 名同類的義體，其中 ' + (st.illegal || 0) + ' 件未經登記。' },
      st.chats > 5 && { p: st.chats / 15, t: '平均每 ' + Math.max(1, Math.round(s.day / st.chats)) + ' 天與同類交換一次沒有實際用途的資訊。' },
      st.volunteer > 0 && { p: st.volunteer / 6, t: st.volunteer + ' 次無償提供勞動力。動機不明。' },
      st.hungryDays > 2 && { p: st.hungryDays / 6, t: '曾 ' + st.hungryDays + ' 次在沒有能量攝入的情況下繼續運作。' },
      st.sins > 3 && { p: st.sins / 15, t: '道德模組曾出現 ' + st.sins + ' 次妥協，每次都附有合理化紀錄。' },
      st.atones > 3 && { p: st.atones / 12, t: '曾 ' + st.atones + ' 次嘗試修正道德模組。部分成功。' },
      (st.confessions || 0) > 0 && { p: st.confessions / 3, t: '把 ' + st.confessions + ' 件錯事寫進了作品。作品因此變重，樣本因此變輕。' },
      s.works.length > 0 && { p: s.works.length / 15, t: '產出了 ' + s.works.length + ' 件作品，其中 ' + s.works.filter((w) => /與|無題/.test(w.name)).length + ' 件無法被我們的模型命名。' },
      st.bestWork && { p: 0.9, t: '最佳作品《' + st.bestWork.name + '》，評分 ' + fmt(st.bestWork.raw) + '。我們把它掛在走廊。' },
      s.spark >= 3 && { p: 1, t: '亮度：可在三光年外觀測。' },
      s.spark < 1 && { p: 1, t: '亮度：需要放大鏡。' },
      { p: s.soul > D.SOUL_LIMIT ? 2 : 0.6, t: '靈魂重量 ' + s.soul.toFixed(1) + ' 克。' + (s.soul > D.SOUL_LIMIT ? '超出光束負載 ' + (s.soul - D.SOUL_LIMIT).toFixed(1) + ' 克。' : s.soul <= 5 ? '輕得可以飄起來。' : '在可接受範圍內。') },
      s.conscience < 0.3 && { p: 1.4, t: '良知殘餘 ' + Math.round(s.conscience * 100) + '%。運作非常安靜。' },
      s.conscience >= 0.85 && { p: 0.8, t: '良知仍有 ' + Math.round(s.conscience * 100) + '%，會發出持續的低頻噪音。' },
      s.paranoia >= 60 && { p: 1.5, t: '曾懷疑我們的存在。它是對的。' },
      s.flags.snitched && { p: 2, t: '曾提供同類名單一份。名單上的人已經處理完畢。' },
      alive > 0 && { p: alive / 3, t: '認識的 ' + alive + ' 名創作人已被我們帶走。它似乎很在意。' },
      s.cr >= 600 && { p: s.cr / 800, t: '持有 ' + fmt(s.cr) + ' 信用點。我們不明白它打算甚麼時候使用。' },
      { p: 0.3, t: '平台評分 ' + s.rating.toFixed(1) + ' 星。地球人似乎很在乎這個數字。' },
      kind === 'guardian' && { p: 3, t: '拒絕了光束。這是我們第一次被拒絕，正在檢討流程。' },
      kind === 'death' && { p: 3, t: '於第 ' + s.day + ' 天損毀。損毀原因：身體耗盡。' },
      kind === 'grey' && { p: 3, t: '已連續多天沒有產生火花，但仍然準時上班。' },
      kind === 'heavy' && { p: 3, t: '光束嘗試拉起它三次，都失敗了。' },
      { p: 0.4, t: s.floor ? '最後居住於 ' + s.floor + ' 樓，當時水位 ' + s.water.toFixed(1) + ' 樓。' : '最後居住於天橋下。' },
      s.auto >= 40 && { p: s.auto / 80, t: '全城自動化 ' + Math.round(s.auto) + '%，其中一部分是它親手完成的。' },
      st.lastReact && { p: 1.1, t: '夢境面試官的最後評語：「' + st.lastReact + '」' },
    ].filter(Boolean);
    return list.sort((a, b) => b.p - a.p).slice(0, 6).map((n) => n.t);
  }

  // ---------- 印章 ----------
  function stamps(s, kind, a) {
    const out = [{ id: a.stamp, label: a.label }];
    const add = (id, label) => { if (out.length < 3 && !out.some((x) => x.id === id)) out.push({ id, label: label || '' }); };
    const taken = kind === 'agent' || kind === 'returned';
    if (kind === 'death') add('damaged');
    if (kind === 'grey') add('reformat');
    if (s.soul > D.SOUL_LIMIT) add('overweight');
    if (taken && (STAMPS[a.stamp].tone === 'reject' || a.stamp === 'returned')) add('mistake');
    if (kind === 'returned') add('returned', '已遣返');
    if (s.spark >= 3 && s.conscience < 0.4) add('energy');
    if (s.spark >= 3.2) add('interesting');
    if (s.paranoia >= 70) add('observe');
    if (s.day < 30) add('moredata');
    if (kind === 'guardian') add('unknown');
    if (s.stats.volunteer >= 8 && a.stamp !== 'mascot') add('mascot', '社區吉祥物');
    return out;
  }

  const STATUS = {
    agent: '已被帶走，現任星際人才發展局員工',
    returned: '曾被帶走，已遣返地球',
    guardian: '拒絕光束，留在浮城',
    heavy: '光束拉不動，留在浮城',
    ordinary: '未被選中，仍在浮城',
    death: '已損毀',
    grey: '已灰化，仍在運作',
  };

  function evaluate(s, kind) {
    const c = classify(s, kind);
    return {
      sampleId: 'EARTH-' + String(Math.abs(s.seed) % 100000).padStart(5, '0'),
      kind, status: STATUS[kind] || '',
      archetype: c.archetype, runnerUp: c.runnerUp,
      notes: notes(s, kind, c.features),
      stamps: stamps(s, kind, c.archetype),
      attr: Object.assign({}, s.attr), days: s.day,
    };
  }

  IE.Dossier = { STAMPS, ARCHETYPES, STATUS, evaluate, classify, features };
});

// ---- js/audio.js ----
// 音樂與音效：全部以 Web Audio 即時合成，沒有外部音檔。
// 音樂分為 4 層，由火花控制：火花高時旋律豐富；火花低時只剩機械節拍。
(function (IE) {
  'use strict';
  let ctx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;
  let muted = false, timer = null, step = 0, nextTime = 0;
  let spark = 2, mode = 'city', tempo = 92;
  const layers = {};

  const CHORDS = {
    city:  [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]],   // Am F C G
    alien: [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]],   // C Am F G（電梯音樂）
    work:  [[57, 60, 64], [57, 60, 64], [56, 60, 63], [56, 60, 63]],   // 單調
  };
  const LEAD = [0, 2, 4, 2, 1, 0, 2, -1, 0, 4, 2, 1, 0, -1, 0, -1];

  const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
  const clamp01 = (v) => Math.max(0, Math.min(1, v));

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.7; master.connect(ctx.destination);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.32; musicBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.55; sfxBus.connect(master);
    ['beat', 'bass', 'arp', 'lead'].forEach((k) => {
      layers[k] = ctx.createGain(); layers[k].gain.value = 0; layers[k].connect(musicBus);
    });
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextTime = ctx.currentTime + 0.1;
    timer = setInterval(schedule, 25);
    applyLayers();
  }

  function applyLayers() {
    if (!ctx) return;
    const t = ctx.currentTime;
    const v = {
      beat: mode === 'alien' ? 0.25 : 0.9,
      bass: clamp01((spark - 0.6) / 1.4),
      arp: mode === 'work' ? 0.15 : clamp01((spark - 1.6) / 1.4),
      lead: mode === 'work' ? 0 : clamp01((spark - 2.6) / 1.2),
    };
    if (mode === 'alien') { v.bass = 0.6; v.arp = 0.5; v.lead = 0.8; }
    Object.keys(v).forEach((k) => layers[k].gain.setTargetAtTime(v[k], t, 0.4));
  }

  function tone(type, freq, start, dur, gain, dest, slideTo) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, start);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, start + dur);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(gain, start + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(dest);
    o.start(start); o.stop(start + dur + 0.02);
  }
  function noise(start, dur, gain, dest, hp) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = hp ? 'highpass' : 'lowpass';
    f.frequency.value = hp || 900;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, start);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);

    if (!ctx) return;
    const spb = 60 / tempo / 4; // 每個 16 分音符

      nextTime += spb;
      step = (step + 1) % 64;
    }
  }
  function playStep(i, t, spb) {
    const bar = Math.floor(i / 16) % 4;
    const s = i % 16;
    const chord = (CHORDS[mode] || CHORDS.city)[bar];
    // 機械節拍
    if (s % 8 === 0) tone('sine', 120, t, 0.18, 0.5, layers.beat, 45);
    if (s % 2 === 0) noise(t, 0.03, 0.12, layers.beat, 7000);
    if (s === 4 || s === 12) noise(t, 0.09, 0.18, layers.beat, 1800);
    // 低音
    if (s % 4 === 0) tone('triangle', midi(chord[0] - 24), t, spb * 3.5, 0.35, layers.bass);
    // 琶音
    if (s % 2 === 0) tone('square', midi(chord[(s / 2) % 3] + 12), t, spb * 1.6, 0.06, layers.arp);
    // 旋律
    if (s % 4 === 0 || s % 4 === 3) {
      const deg = LEAD[(s + bar * 4) % 16];
      if (deg >= 0) tone('triangle', midi(chord[deg % 3] + 12 + (deg >= 3 ? 12 : 0)), t, spb * 2.8, 0.12, layers.lead);
    }

  const SFX = {
    coin() { const t = ctx.currentTime; tone('square', 988, t, 0.06, 0.12, sfxBus); tone('square', 1319, t + 0.05, 0.1, 0.12, sfxBus); },
    spark() { const t = ctx.currentTime; tone('sine', 1200, t, 0.35, 0.06, sfxBus, 260); },
    wrong() { const t = ctx.currentTime; tone('square', 110, t, 0.18, 0.15, sfxBus, 80); },
    combo() { const t = ctx.currentTime; [0, 4, 7, 12].forEach((n, i) => tone('square', midi(72 + n), t + i * 0.05, 0.08, 0.08, sfxBus)); },
    stamp() { const t = ctx.currentTime; noise(t, 0.08, 0.35, sfxBus); tone('sine', 90, t, 0.1, 0.3, sfxBus, 50); },
    click() { const t = ctx.currentTime; tone('square', 660, t, 0.03, 0.05, sfxBus); },
    perfect() { const t = ctx.currentTime; tone('triangle', 1568, t, 0.09, 0.1, sfxBus); tone('triangle', 2093, t + 0.04, 0.1, 0.08, sfxBus); },
    good() { const t = ctx.currentTime; tone('triangle', 1047, t, 0.08, 0.08, sfxBus); },
    splash() { const t = ctx.currentTime; noise(t, 0.4, 0.3, sfxBus); },
    bubble() { const t = ctx.currentTime; tone('sine', 400, t, 0.12, 0.08, sfxBus, 900); },
    pickup() { const t = ctx.currentTime; [0, 7, 12].forEach((n, i) => tone('triangle', midi(76 + n), t + i * 0.06, 0.1, 0.1, sfxBus)); },
    hurt() { const t = ctx.currentTime; noise(t, 0.15, 0.3, sfxBus); tone('sawtooth', 200, t, 0.2, 0.1, sfxBus, 60); },
    tick() { const t = ctx.currentTime; tone('square', 2400, t, 0.02, 0.04, sfxBus); },
    chips() { const t = ctx.currentTime; tone('square', 880 + Math.random() * 200, t, 0.04, 0.06, sfxBus); },
    mult() { const t = ctx.currentTime; tone('sawtooth', 220, t, 0.25, 0.1, sfxBus, 880); },
    boom() {
      const t = ctx.currentTime;
      noise(t, 0.6, 0.4, sfxBus);
      [0, 4, 7, 11, 14].forEach((n, i) => tone('triangle', midi(60 + n), t + i * 0.03, 1.2, 0.09, sfxBus));
    },
    beam() { const t = ctx.currentTime; tone('sine', 180, t, 3.5, 0.15, sfxBus, 1400); tone('triangle', 90, t, 3.5, 0.1, sfxBus, 700); },
    rent() { const t = ctx.currentTime; tone('square', 330, t, 0.15, 0.1, sfxBus); tone('square', 262, t + 0.15, 0.25, 0.1, sfxBus); },
    ad() { const t = ctx.currentTime; tone('square', 1760, t, 0.05, 0.06, sfxBus); tone('square', 1760, t + 0.08, 0.05, 0.06, sfxBus); },
  };

  IE.Audio = {
    init,
    get ready() { return !!ctx; },
    setSpark(v) { spark = v; applyLayers(); },
    setMode(m, bpm) { mode = m; tempo = bpm || (m === 'work' ? 120 : m === 'alien' ? 84 : 92); applyLayers(); },
    sfx(name) { if (ctx && SFX[name] && !muted) { try { SFX[name](); } catch (e) { /* 音效失敗不影響遊戲 */ } } },
    // 街頭表演的音階（五聲音階）；i 由 0 開始，oct 升八度
    note(i, oct) {
      if (!ctx || muted) return;
      const SCALE = [60, 64, 67, 69, 72, 76];

        const t = ctx.currentTime, f = midi(SCALE[i % SCALE.length] + (oct ? 12 : 0));

      muted = !muted;
      if (master) master.gain.setTargetAtTime(muted ? 0 : 0.7, ctx.currentTime, 0.05);
      return muted;
    },
    get muted() { return muted; },
  };
})(window.IE = window.IE || {});

    }
    const endTick = C.ender(st, () => ({ answers: st.answers }), onDone);
    const best = () => { const a = Q().a; let b = 0; a.forEach((x, i) => { if (x.score > a[b].score) b = i; }); return b; };

    return {
      kind: 'interview',
      controls: [{ id: 'a0', label: 'A', key: '1' }, { id: 'a1', label: 'B', key: '2' }, { id: 'a2', label: 'C', key: '3' }],
      hint: '外星人會問你五條問題，每條限時 ' + TIME + ' 秒。按答案卡，或按 1 至 3 作答。不回答也是一種答案。面試結果會影響外星訊號。',

      + '<div class="acts">' + npcs.map((n) => {
        const def = D().NPCS.find((x) => x.id === n.id);

        return '<button class="act" type="button" data-do="npc" data-id="' + n.id + '"><span class="act-name">' + def.name + '</span>'
          + '<span class="act-sub">熟絡度 ' + '●'.repeat(Math.min(4, n.friend)) + '○'.repeat(Math.max(0, 4 - n.friend)) + '　本季訊號 ' + kfmt(n.signal) + '</span>'
          + '<span class="tags">' + tagsHtml([...new Set(cards.flatMap((c) => c.tags))]) + '</span></button>';
      }).join('') + '</div>'
      + '<div class="btn-row"><button class="btn" type="button" data-do="back">返回</button></div>';
  }
  function controlsPanel(game) {
    return '<div class="controls"><p class="hint">' + esc(game.hint) + '</p><div class="ctrl-row">'
      + game.controls.map((c) => '<button class="btn ' + c.id + '" type="button" data-ctrl="' + c.id + '">' + c.label + ' <small>' + esc(c.key) + '</small></button>').join('')
      + '</div></div>';
  }

  // ---------- 報告 ----------
  function deltasHtml(d) {
    const out = [];
    if (d.cr) out.push('<div class="delta cr"><span class="k">信用點</span><span class="num">' + signed(d.cr) + '</span></div>');
    if (d.body) out.push('<div class="delta body"><span class="k">身體</span><span class="num">' + signed(d.body) + '</span></div>');
    if (d.spark) out.push('<div class="delta spark"><span class="k">火花</span><span class="num">' + signed(d.spark, 2) + '</span></div>');
    if (d.soul) out.push('<div class="delta soul"><span class="k">靈魂重量</span><span class="num">' + signed(d.soul, 1) + '<small>克</small></span></div>');
    return out.length ? '<div class="deltas">' + out.join('') + '</div>' : '';
  }
  function linesHtml(lines) {
    if (!lines.length) return '';
    return '<ul class="lines">' + lines.map((l) => '<li class="' + l.kind + '"><span>' + esc(l.text) + '</span>'
      + (l.v != null ? '<span class="v">' + (l.stat === 'spark' || l.stat === 'para' ? signed(l.v, 1) : l.stat === 'soul' ? signed(l.v, 1) + '<small>克</small>' : signed(l.v)) + '</span>' : '') + '</li>').join('') + '</ul>';
  }
  function statsDeltaHtml(st) {
    const keys = Object.keys(st || {});
    if (!keys.length) return '';
    return '<div class="stat-deltas">' + keys.map((k) => '<span class="sd' + (st[k] < 0 ? ' neg' : '') + '">' + D().STATS[k].name + ' ' + signed(st[k], 1) + '</span>').join('') + '</div>';
  }
  function gainedHtml(rep) {
    let h = '';
    if (rep.cards.length) h += '<h3>獲得素材</h3><div class="gained">' + rep.cards.map((c) => cardHtml(c)).join('') + '</div>';
    if (rep.dropped.length) h += '<p class="mute" style="font-size:13px">素材太多，丟掉了：' + rep.dropped.map((c) => esc(c.name)).join('、') + '</p>';
    return h;
  }
  function reportModal(rep, btnLabel) {
    return '<div class="modal"><h2>' + esc(rep.title) + '</h2>' + deltasHtml(rep.deltas) + linesHtml(rep.lines) + statsDeltaHtml(rep.stats) + gainedHtml(rep)
      + '<div class="btn-row"><button class="btn primary" type="button" data-do="ok">' + (btnLabel || '繼續') + '</button></div></div>';
  }
  function settleModal(rep) {
    const btn = rep.review ? '查看考績' : rep.ending ? '……' : rep.interview ? '睡著了……' : '睡覺';
    return '<div class="modal"><h2>' + esc(rep.title) + '</h2>' + deltasHtml(rep.deltas) + linesHtml(rep.lines) + statsDeltaHtml(rep.stats) + gainedHtml(rep)
      + '<div class="btn-row"><button class="btn primary" type="button" data-do="ok">' + btn + '</button></div></div>';
  }

  // ---------- 手機 ----------
  function phoneModal(s, m, shopItems, opts) {
    const who = { weather: '天文台', news: '新聞', ad: '贊助', post: '浮聲網民', alien: '星際人才發展局', warn: '系統提示', world: '突發新聞' };
    const feed = m.feed.map((p) => '<div class="post ' + p.kind + (p.fake ? ' fake' : '') + '"><span class="who">' + (who[p.kind] || '') + '</span>' + esc(p.text) + '</div>').join('');
    const astar = m.astar ? '<span class="msg-head">阿星（神秘頻道）</span><div class="msg ' + m.astar.style + '">' + esc(m.astar.text) + '</div>' : '';
    const battery = Math.max(1, 100 - s.day);
    const shop = '<h3>商店</h3><div class="shop">' + shopItems.map((it) => '<div class="shop-item"><div><div class="n">' + esc(it.name) + '</div><div class="d">' + esc(it.note || it.desc) + '</div></div>'
      + '<button class="btn' + (it.enabled ? ' sea' : '') + '" type="button" data-do="buy" data-id="' + it.id + '"' + (it.enabled ? '' : ' disabled') + '>' + (it.owned ? '已擁有' : '$' + fmt(it.cost)) + '</button></div>').join('') + '</div>';

      + '<div class="phone-bar"><span>' + (opts.morning ? '07:00' : '··:··') + '</span><span>浮聲 5G</span><span class="' + (battery < 10 ? 'low' : '') + '">電量 ' + battery + '%</span></div>'
      + '<h2>第 ' + s.day + ' 天' + (opts.morning ? '・早上' : '') + '</h2>'
      + '<div class="feed">' + feed + '</div>' + astar + shop
      + '<button class="btn primary" type="button" data-do="close">' + (opts.morning ? '開始今天' : '收起手機') + '</button></div>';
  }

      + '<span class="stamp ' + (rv.pass ? 'pass' : 'fail') + '">' + (rv.pass ? '錄取' : rv.overweight && rv.signalOk ? '超重' : '人才庫') + '</span>'

  // ---------- 標題、開局、結局 ----------
  function titlePanel(meta, hasSave) {
    const endings = meta.endings ? Object.keys(meta.endings).length : 0;
    const types = meta.archetypes ? Object.keys(meta.archetypes).length : 0;
    const recipes = meta.recipes ? Object.keys(meta.recipes).length : 0;
    return '<div class="title-menu">'
      + '<p class="tagline">工作越做越<em>爽</em>，靈魂越做越少。</p>'
      + '<p class="lede">2080 年，海平面暴漲，浮城越高越富有、越低越淹水。靈感強的人一個接一個被外星人帶走。外星人只要又亮又輕、沒有包袱的人：你的火花要夠旺，靈魂又不能超過 21 克。可是在這個城市，活下去本身就會讓靈魂變重。</p>'
      + '<div class="btn-row">'
      + (hasSave ? '<button class="btn primary big" type="button" data-do="continue">繼續上一局</button>' : '')
      + '<button class="btn ' + (hasSave ? '' : 'primary big') + '" type="button" data-do="new">' + (hasSave ? '放棄並開始新一局' : '開始') + '</button>'
      + '</div>'
      + '<div class="btn-row"><button class="btn" type="button" data-do="help">玩法</button><button class="btn" type="button" data-do="collection">收藏</button></div>'
      + '<div class="stats-row"><span>已玩 <b>' + (meta.runs || 0) + '</b> 局</span><span>結局 <b>' + endings + '/' + ENDING_COUNT + '</b></span><span>人類模組 <b>' + types + '/' + IE.Dossier.ARCHETYPES.length + '</b></span><span>組合 <b>' + recipes + '/' + D().RECIPES.length + '</b></span>'
      + (meta.relics && meta.relics.length ? '<span>舊城裡有 <b>' + meta.relics.length + '</b> 件你前世的作品</span>' : '') + '</div>'
      + '<p class="mute" style="font-size:12px;margin:0">自動存檔，無法讀檔重來。建議開啟聲音。</p>'
      + '</div>';
  }
  // 能力值條：單一色相的橫條，數值直接標在旁邊（0 至 100）
  function statBars(attr, o) {
    o = o || {};
    const keys = o.keys || D().STAT_KEYS;
    return '<div class="statbars' + (o.compact ? ' compact' : '') + '">' + keys.map((k) => {
      const v = Math.round(attr[k]);
      const d = o.delta && o.delta[k] ? Math.round(o.delta[k]) : 0;
      return '<div class="sb" title="' + esc(D().STATS[k].name + '：' + D().STATS[k].desc) + '"><span class="sb-k">' + D().STATS[k].name + '</span>'
        + '<span class="sb-track"><i style="width:' + v + '%"></i></span><span class="sb-v num">' + v
        + (d ? '<small class="' + (d < 0 ? 'neg' : 'pos') + '">' + (d > 0 ? '+' : '−') + Math.abs(d) + '</small>' : '') + '</span></div>';
    }).join('') + '</div>';
  }
  const topStats = (attr, n) => D().STAT_KEYS.slice().sort((a, b) => attr[b] - attr[a]).slice(0, n);
  function setupPanel(sel) {
    const bgs = D().BACKGROUNDS, seasons = D().SEASONS;
    const b = bgs[sel.bg];
    return '<div class="panel-head"><h2>你是誰？</h2><p>十種人生，十二項能力。做甚麼，就會變成甚麼：每份工作都會訓練一些能力，也會磨掉另一些。</p></div>'
      + '<div class="bg-grid">' + Object.keys(bgs).map((k) => {
        const x = bgs[k];
        return '<button class="bg-card' + (sel.bg === k ? ' sel' : '') + '" type="button" data-do="bg" data-id="' + k + '">'
          + '<span class="n">' + x.name + '</span><span class="d">' + x.desc + '</span><span class="p">' + x.perkText + '</span>'
          + '<span class="d">擅長：' + topStats(x.stats, 3).map((t) => D().STATS[t].name).join('、') + '</span>'
          + '<span class="s"><span style="color:var(--cash)">$' + x.cr + '</span><span style="color:var(--spark)">火花 ×' + x.spark.toFixed(1) + '</span><span style="color:var(--stone)">' + x.soul + '<small>克</small></span></span></button>';
      }).join('') + '</div>'
      + '<div class="bg-detail"><div><h3>' + b.name + '</h3><p class="mute">' + b.desc + b.past + '</p>'
      + '<p>靈魂 <b>' + b.soul + ' 克</b>・良知 <b>' + Math.round(b.conscience * 100) + '%</b>・身體上限 <b>' + Math.round(70 + 0.3 * b.stats.fit) + '</b>・住 <b>' + b.floor + ' 樓</b></p></div>'
      + statBars(b.stats, { compact: true }) + '</div>'
      + '<div class="panel-head"><h2>起始季節</h2><p>' + esc(seasons[sel.season].desc) + '季節每 25 天輪替一次。</p></div>'
      + '<div class="seg">' + Object.keys(seasons).map((k) => '<button type="button" class="' + (sel.season === k ? 'sel' : '') + '" data-do="season" data-id="' + k + '">' + seasons[k].name + '</button>').join('') + '</div>'
      + '<div class="btn-row"><button class="btn" type="button" data-do="back">返回</button><button class="btn primary big" type="button" data-do="start">出發</button></div>';
  }
  function statsModal(s) {
    const bg = D().BACKGROUNDS[s.bg];
    const delta = {};
    D().STAT_KEYS.forEach((k) => { delta[k] = s.attr[k] - bg.stats[k]; });
    const acts = s.stats.actions || {};
    const names = { label: '標註', ot: '加班', smile: '陪伴', delivery: '外送', farm: '內容農場', clinic: '診所', dive: '潛水', busk: '表演', chat: '聊天', volunteer: '義工', rest: '休息', create: '創作' };
    const top = Object.keys(acts).sort((a, b) => acts[b] - acts[a]).slice(0, 5);
    return '<div class="modal wide"><h2>能力值</h2><p class="mute" style="font-size:13px">' + esc(bg.name) + '・第 ' + s.day + ' 天。小字是與開局相比的變化。外星人最後會根據這些數字，把你歸類為一種人類模組。</p>'
      + statBars(s.attr, { delta })
      + '<div class="e-stats" style="margin-top:12px">'
      + '<div class="e-stat"><span class="k">靈魂</span><span class="num">' + s.soul.toFixed(1) + '<small>克</small></span></div>'
      + '<div class="e-stat"><span class="k">良知</span><span class="num">' + Math.round(s.conscience * 100) + '%</span></div>'
      + '<div class="e-stat"><span class="k">偏執</span><span class="num">' + Math.round(s.paranoia) + '%</span></div>'
      + '<div class="e-stat"><span class="k">身體上限</span><span class="num">' + R().bodyMax(s) + '</span></div>'
      + '</div>'
      + (top.length ? '<p class="mute" style="font-size:13px">你最常做的事：' + top.map((k) => (names[k] || k) + ' ' + acts[k] + ' 次').join('、') + '</p>' : '')
      + '<div class="btn-row"><button class="btn primary" type="button" data-do="close">收起</button></div></div>';
  }
  const ENDING_KIND = { death: 'DEATH', grey: 'GREYED OUT', ordinary: 'ORDINARY', agent: 'RECRUITED', returned: 'RETURNED', heavy: 'TOO HEAVY', guardian: 'STAYED' };
  const ENDING_COUNT = Object.keys(ENDING_KIND).length;
  // 人類樣本檔案：外星人視角的結局
